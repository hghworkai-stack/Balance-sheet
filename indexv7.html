this._stmtTextModal.selectedTxIds = selectAll ? stmt.allAsc.map(t => t.id) : [];
const boxes = document.querySelectorAll('#stxt-multi-list input[type="checkbox"]');
boxes.forEach(b => { b.checked = !!selectAll; });
this.refreshStatementTextarea();
},
refreshStatementTextarea() {
const st = this._stmtTextModal;
const ta = document.getElementById('text-export-area');
if (!st || !ta) return;
if (st.mode === 'multi') {
ta.value = this.buildMultiReceiptsText(st.cpId, st.selectedTxIds, {
includeName: st.multiIncludeName,
includeBalance: st.multiIncludeBalance
});
} else {
let sliceOpts = { mode: 'all' };
if (st.mode === 'detailed') {
if (st.textScope === 'since_confirm') sliceOpts = { mode: 'since_confirm' };
else if (st.textScope === 'page') sliceOpts = { mode: this.ui.periodMode || 'all', dateFrom: this.ui.dateFrom || '', dateTo: this.ui.dateTo || '' };
else sliceOpts = { mode: 'all' };
}
ta.value = this.buildCleanStatementText(st.cpId, st.mode, {
includeSettled: st.includeSettled,
includeRunning: st.includeRunning,
includeName: st.includeName,
sliceOpts
});
}
},
buildTxReceiptText(txId, includeBalance = true, includeAllBalances = false, includeName = false) {
const tx = this.getActiveTransactions().find(t => t.id === txId && !t.deleted);
if (!tx) return '';
const cp = this.findCounterpartyById(tx.cpId);
if (!cp) return '';

const lines = [];
if (includeName) {
lines.push(`👤 حساب: ${cp.name}`);
}
lines.push(...this.buildSingleTxBlockLines(tx, { showId: true, showEffects: true }));

if (includeBalance) {
const stmt = this.buildCounterpartyStatement(cp.id);
const balList = includeAllBalances
? (stmt.currentBalances || [])
: (tx.type === 'settlement'
? ((stmt.fullRunningById && stmt.fullRunningById[tx.id]) || [])
: ((stmt.touchedRunningById && stmt.touchedRunningById[tx.id]) || []));
lines.push('');
lines.push(includeAllBalances ? '⚖️ مانده کل حساب:' : '⚖️ مانده جدید پس از این ثبت:');
if (!balList.length) {
lines.push('⚪ تمامی ارزها تسویه (صفر) است.');
} else {
for (const b of balList) {
lines.push(this.formatCleanBalanceLine(b.code, b.micro));
}
}
}

return lines.join('\n');
},

} else if (which === 'name') {
this._receiptModal.includeName = !!checked;
}
this.refreshTxReceiptTextarea();
},
refreshTxReceiptTextarea() {
const st = this._receiptModal;
const ta = document.getElementById('tx-receipt-area');
if (!st || !ta) return;
const txId = st.txIds[st.activeIdx] || st.txIds[0];
ta.value = this.buildTxReceiptText(txId, st.includeBalance, st.includeAllBalances, st.includeName);
},
copyFromTextarea(elId) {
const ta = document.getElementById(elId);
if (!ta) return;
const text = ta.value || '';
if (!text.trim()) return;
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(text).then(() => {
this.toast('متن با موفقیت کپی شد ✓');
}).catch(() => this.fallbackCopyText(text));
} else {
this.fallbackCopyText(text);
}
},
async shareFromTextarea(elId, title = 'گزارش حساب') {
const ta = document.getElementById(elId);
if (!ta) return;
const text = ta.value || '';
if (!text.trim()) return;
try {
if (navigator.share) {
await navigator.share({ title, text });
return;
}
} catch (e) {
if (e && e.name === 'AbortError') return;
}
this.copyFromTextarea(elId);
},
fallbackCopyText(text) {
const ta = document.createElement('textarea');
ta.value = text;
ta.setAttribute('readonly', '');
ta.style.position = 'fixed';
ta.style.top = '-9999px';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.select();
try {
document.execCommand('copy');
this.toast('متن با موفقیت کپی شد.');
} catch (e) {
this.toast('کپی خودکار انجام نشد؛ لطفاً متن را دستی کپی کنید.', true);
}
ta.remove();
},

const nt = st.dateTo ? Jalali.normalizeDate(st.dateTo) : '';

runSelectedStatementExport() {

}

return `<tr style="${tx.type==='settlement'?'background:#ecfdf5; font-weight:700;':''}">

},
exportCsvStatement(cpId, sliceOpts = null) {
if (!this.canAccessCounterparty(cpId)) return;
const cp = this.findCounterpartyById(cpId);
if (!cp) return;
const stmt = sliceOpts
? this.buildStatementSlice(cpId, sliceOpts)
: this.buildCounterpartyStatement(cpId);
const balances = stmt.isFiltered ? stmt.periodEndingBalances : stmt.currentBalances;
const txs = stmt.inPeriodAsc;
const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
const rows = [];
rows.push([esc('صورت‌حساب'), esc(cp.name), esc('تاریخ گزارش'), esc(Jalali.nowDateTimeStr()), esc('محدوده گزارش'), esc(stmt.periodLabel)].join(','));
rows.push('');
rows.push([esc('خلاصه بالانس نهایی'), esc('ارز'), esc('مبلغ'), esc('وضعیت')].join(','));
if (!balances.length) {
rows.push([esc(''), esc('همه ارزها'), esc('0'), esc('تسویه')].join(','));
} else {
for (const b of balances) {
const cur = this.getCurrency(b.code);
rows.push([esc(''), esc(cur.name), esc(Dec.toCanonicalStr(b.micro)), esc(this.getStatusText(b.micro))].join(','));
}
}
if (stmt.isFiltered) {
rows.push('');
const bfLabel = stmt.isFromConfirmation
? `مانده تأییدشده ابتدای دوره (${stmt.confirmInfo.date})`
: 'مانده انتقالی ابتدای دوره';
rows.push([esc(bfLabel), esc('ارز'), esc('مبلغ'), esc('وضعیت')].join(','));
if (!stmt.broughtForward.length) {
rows.push([esc(''), esc('همه ارزها'), esc('0'), esc('تسویه')].join(','));
} else {
for (const b of stmt.broughtForward) {
const cur = this.getCurrency(b.code);
rows.push([esc(''), esc(cur.name), esc(Dec.toCanonicalStr(b.micro)), esc(this.getStatusText(b.micro))].join(','));
}
}
}
rows.push('');
rows.push([esc('ردیف'), esc('شناسه'), esc('تاریخ'), esc('نوع'), esc('شماره فیش / پیگیری'), esc('شرح'), esc('تأثیر روی حساب'), esc('مانده لحظه‌ای'), esc('توضیحات')].join(','));
txs.forEach((tx, i) => {
const efTxt = tx.type === 'settlement'
? 'تأیید مانده'
: (tx.effects || []).map(ef => {
const c = this.getCurrency(ef.currency);
return `${c.name}: ${Num.formatSigned(ef.delta)}`;
}).join(' | ');
const runTxt = this.formatRunningTextForTx(tx, stmt);
const dispSum = this.getTxDisplaySummary(tx, true);
const dispId = this.getTxPublicId(tx);
const pubType = this.getTxPublicType(tx);
const typeFa = pubType === 'deal' ? 'معامله'
: (pubType === 'opening' ? 'مانده اولیه'
: (pubType === 'settlement' ? 'تأیید مانده'
: (pubType === 'profit_share' ? 'سهم سود' : 'انتقال')));
const notes = [tx.roundingNote, tx.note].filter(Boolean).join(' - ');
rows.push([esc(i + 1), esc(dispId), esc(tx.date), esc(typeFa), esc(tx.refCode || ''), esc(dispSum), esc(efTxt), esc(runTxt), esc(notes)].join(','));
});
const csvContent = '\uFEFF' + rows.join('\r\n');
const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `statement-${safeFilename(cp.name)}-${Jalali.todayStr().replace(/\//g, '-')}.csv`;
a.click();
URL.revokeObjectURL(url);
this.toast(`فایل اکسل (CSV) با ${txs.length} ردیف دانلود شد ✓`);
},
saveSecurityPrefs() {
if (!this.requireAdmin()) return;
const autoEl = document.getElementById('set-autolock');

<!-- CLEAN OPTIONAL FEATURE TOGGLES (Collapsed by default!) -->
<div class="opt-toggle-bar">
<button type="button" id="ofs-pill-pricing" class="opt-pill" onclick="app.toggleOffsetOpt('pricing')">💱 نرخ خرید/فروش</button>
<button type="button" id="ofs-pill-share" class="opt-pill" onclick="app.toggleOffsetOpt('share')">🤝 تسهیم سود</button>
<button type="button" id="ofs-pill-priv" class="opt-pill" onclick="app.toggleOffsetOpt('priv')">⚙️ بیشتر ▾</button>
</div>

<!-- OPTIONAL PANEL 1: BUY/SELL PRICING & PROFIT -->
<div id="ofs-panel-pricing" class="opt-panel" style="display:none;">
<div style="font-size:12px; font-weight:800; color:var(--primary-dark); margin-bottom:8px;">💱 معامله دوجانبه با اختلاف نرخ (محاسبه خودکار سود شما)</div>
<div class="grid-2" style="margin-bottom:8px;">
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">ارز تسویه / معادل</label>
<select id="ofs-cur2" class="form-control" onchange="app.onOffsetCur2Change()">${this.currencyOptionsHtml(defaultCur2)}</select>
</div>
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">عملگر تبدیل نرخ</label>
<div class="segmented" style="margin-bottom:0;">
<button type="button" id="ofs-op-mul" class="seg-btn" onclick="app.setOffsetOp('mul')">ضرب (×)</button>
<button type="button" id="ofs-op-div" class="seg-btn" onclick="app.setOffsetOp('div')">تقسیم (÷)</button>
</div>
</div>
</div>
<div class="grid-2" style="margin-bottom:6px;">
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">نرخ خرید شما از طرف اول</label>
<input type="text" inputmode="decimal" id="ofs-buy-rate" class="form-control input-ltr" placeholder="مثلاً 68,000" value="${buyRateVal}" oninput="Num.formatLiveInput(this); app.updateOffsetPreview()" />
</div>
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">نرخ فروش شما به طرف دوم</label>
<input type="text" inputmode="decimal" id="ofs-sell-rate" class="form-control input-ltr" placeholder="مثلاً 69,000" value="${sellRateVal}" oninput="Num.formatLiveInput(this); app.updateOffsetPreview()" />
</div>
</div>
<div id="ofs-rate-hint" class="rate-hint-wrap"></div>
<div class="form-group" style="margin:6px 0 0;">
<label class="form-label">نحوه ثبت در حساب‌ها</label>
<div class="segmented" style="margin-bottom:0;">
<button type="button" id="ofs-del-direct" class="seg-btn" style="font-size:11.5px;" onclick="app.setOffsetDelivery('direct')">تحویل مستقیم شد (فقط معادل)</button>
<button type="button" id="ofs-del-open" class="seg-btn" style="font-size:11.5px;" onclick="app.setOffsetDelivery('open')">ثبت دوارزی کامل (معامله باز)</button>
</div>
</div>
</div>

<!-- OPTIONAL PANEL 2: PROFIT SHARING WITH PARTNER -->
<div id="ofs-panel-share" class="opt-panel" style="display:none;">
<div style="font-size:12px; font-weight:800; color:var(--amber-text); margin-bottom:8px;">🤝 تسهیم سود با شریک / معرف</div>
<div class="form-group" style="margin-bottom:8px;">
<label class="form-label">طرف حساب دریافت‌کننده سهم سود (+ طلبکار می‌شود)</label>
<select id="ofs-partner" class="form-control" onchange="app.updateOffsetPreview()">${cpOpts(defaultPartner)}</select>
</div>
<div id="ofs-share-mode-wrap" style="margin-bottom:8px;">
<div class="segmented" style="margin-bottom:6px;">
<button type="button" id="ofs-sm-pct" class="seg-btn" onclick="app.setOffsetShareMode('percent')">درصدی از سود (%)</button>
<button type="button" id="ofs-sm-fix" class="seg-btn" onclick="app.setOffsetShareMode('fixed')">مبلغ ثابت</button>
</div>
</div>
<div id="ofs-share-pct-box" style="margin-bottom:6px;">
<label class="form-label">
<span>درصد سهم شریک</span>
<span style="display:flex; gap:4px;">
<button type="button" class="btn btn-xs btn-secondary" onclick="app.setOffsetSharePercent(25)">25%</button>
<button type="button" class="btn btn-xs btn-secondary" onclick="app.setOffsetSharePercent(33.33)">33%</button>
<button type="button" class="btn btn-xs btn-secondary" onclick="app.setOffsetSharePercent(50)">50%</button>
</span>
</label>
<input type="text" inputmode="decimal" id="ofs-share-pct" class="form-control input-ltr" placeholder="مثلاً 50" value="${escapeHtml(sharePctVal)}" oninput="Num.formatLiveInput(this); app.updateOffsetPreview()" />
</div>
<div id="ofs-share-fix-box" style="display:none;">
<div class="grid-2">
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">مبلغ سهم شریک</label>
<input type="text" inputmode="decimal" id="ofs-share-amt" class="form-control input-ltr" placeholder="مثلاً 50" value="${shareAmtVal}" oninput="Num.formatLiveInput(this); app.updateOffsetPreview()" />
</div>
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">ارز سهم شریک</label>
<select id="ofs-share-cur" class="form-control" onchange="app.updateOffsetPreview()">${this.currencyOptionsHtml(shareCurDefault)}</select>
</div>
</div>
<div id="ofs-manual-gross-wrap" class="form-group" style="margin:8px 0 0; display:none;">
<label class="form-label">سود کل این تراکنش قبل از تقسیم (اختیاری — برای گزارش سود)</label>
<input type="text" inputmode="decimal" id="ofs-manual-gross" class="form-control input-ltr" placeholder="مثلاً 100" value="${manualGrossVal}" oninput="Num.formatLiveInput(this); app.updateOffsetPreview()" />
</div>
</div>
</div>

<!-- OPTIONAL PANEL 3: MORE (DATE, REF, PRIVATE NOTE) -->
<div id="ofs-panel-priv" class="opt-panel" style="display:none;">
<div class="grid-2" style="margin-bottom:8px;">
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">
<span>تاریخ شمسی</span>
<span>
<button type="button" class="btn btn-xs btn-secondary" onclick="app.setDateInputValue('ofs-date', Jalali.todayStr())">امروز</button>
<button type="button" class="btn btn-xs btn-secondary" onclick="app.setDateInputValue('ofs-date', Jalali.yesterdayStr())">دیروز</button>
</span>
</label>
<input type="text" id="ofs-date" class="form-control input-ltr" value="${escapeHtml(isEdit ? editFromTx.date : Jalali.todayStr())}" oninput="app.validateDateInput('ofs-date')" />
<div id="ofs-date-hint" class="date-hint"></div>
</div>
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">شماره فیش / کد پیگیری</label>
<input type="text" id="ofs-ref" class="form-control input-ltr" placeholder="اختیاری" value="${escapeHtml(isEdit ? (editFromTx.refCode || '') : '')}" />
</div>
</div>
<div class="form-group" style="margin-bottom:0;">
<label class="form-label" style="color:var(--purple);">🔒 یادداشت محرمانه مدیر (فقط برای خودتان — هیچ کاربری نمی‌بیند)</label>
<input type="text" id="ofs-private-note" class="form-control" placeholder="مثلاً خرید از صرافی الف و تحویل به ب..." value="${escapeHtml(isEdit ? (editFromTx.privateNote || '') : '')}" />
</div>
</div>

<div class="preview-box" id="ofs-preview-box"></div>
<div class="grid-2">
<button class="btn btn-primary" onclick="app.saveOffset(false)">
${isEdit ? '💾 ذخیره تغییرات' : '🔄 ثبت در حساب‌ها'}
</button>
<button class="btn btn-blue" onclick="app.saveOffset(true)">
📋 ${isEdit ? 'ذخیره + متن رسید' : 'ثبت + متن رسید'}
</button>
</div>
`);
this.syncOffsetUi();
this.validateDateInput('ofs-date');
this.renderOffsetRateHint();
this.updateOffsetPreview();
},
toggleOffsetOpt(which) {
if (!this._ofsState) return;
if (which === 'pricing') {
this._ofsState.showPricing = !this._ofsState.showPricing;
if (this._ofsState.showPricing) {
const c1 = document.getElementById('ofs-cur')?.value;
const c2El = document.getElementById('ofs-cur2');
if (c2El && c2El.value === c1) {
const alt = this.state.currencies.find(c => c.code !== c1);
if (alt) c2El.value = alt.code;
}
}
} else if (which === 'share') {
this._ofsState.showShare = !this._ofsState.showShare;
if (this._ofsState.showShare && !this._ofsState.showPricing) {
this._ofsState.shareMode = 'fixed';
}
} else if (which === 'priv') {
this._ofsState.showPriv = !this._ofsState.showPriv;
}
this.syncOffsetUi();
this.renderOffsetRateHint();
this.updateOffsetPreview();
},
setOffsetOp(op) {
this._ofsState.op = op;
this.syncOffsetUi();
this.updateOffsetPreview();
},
setOffsetDelivery(mode) {
this._ofsState.delivery = mode;
this.syncOffsetUi();
this.updateOffsetPreview();
},
setOffsetShareMode(mode) {
this._ofsState.shareMode = mode;
this.syncOffsetUi();
this.updateOffsetPreview();
},
setOffsetSharePercent(pct) {
const el = document.getElementById('ofs-share-pct');
if (el) el.value = String(pct);
this.updateOffsetPreview();
},
onOffsetCur1Change() {
const c1 = document.getElementById('ofs-cur')?.value;
const c2El = document.getElementById('ofs-cur2');
if (c2El && c2El.value === c1) {
const alt = this.state.currencies.find(c => c.code !== c1);
if (alt) c2El.value = alt.code;
}
if (!this._ofsState.showPricing) {
const shCur = document.getElementById('ofs-share-cur');
if (shCur) shCur.value = c1;
}
this.renderOffsetRateHint();
this.updateOffsetPreview();
},
onOffsetCur2Change() {
const c2 = document.getElementById('ofs-cur2')?.value;
const shCur = document.getElementById('ofs-share-cur');
if (shCur && this._ofsState.showPricing) shCur.value = c2;
this.renderOffsetRateHint();
this.updateOffsetPreview();
},
renderOffsetRateHint() {
const box = document.getElementById('ofs-rate-hint');
if (!box || !this._ofsState || !this._ofsState.showPricing) {
if (box) box.innerHTML = '';
return;
}
const c1 = document.getElementById('ofs-cur')?.value;
const c2 = document.getElementById('ofs-cur2')?.value;
const saved = this.getLastRate(c1, c2);
if (!saved) { box.innerHTML = ''; return; }
const opChar = saved.op === 'div' ? '÷' : '×';
box.innerHTML = `
<button type="button" class="rate-hint-btn" onclick="app.applyOffsetLastRate()">
<span>💡 آخرین نرخ این جفت‌ارز: <strong style="direction:ltr; display:inline-block;">${Num.format(saved.rate, 6)}</strong> (${opChar})</span>
<span style="white-space:nowrap;">اعمال روی خرید ←</span>
</button>
`;
},
applyOffsetLastRate() {
const c1 = document.getElementById('ofs-cur')?.value;
const c2 = document.getElementById('ofs-cur2')?.value;
const saved = this.getLastRate(c1, c2);
if (!saved) return;
const bEl = document.getElementById('ofs-buy-rate');
if (bEl) bEl.value = Num.format(saved.rate, 6);
this._ofsState.op = saved.op || 'mul';
this.syncOffsetUi();
this.updateOffsetPreview();
},
syncOffsetUi() {
const st = this._ofsState;
if (!st) return;
const pP = document.getElementById('ofs-panel-pricing');
const bP = document.getElementById('ofs-pill-pricing');
const pS = document.getElementById('ofs-panel-share');
const bS = document.getElementById('ofs-pill-share');
const pR = document.getElementById('ofs-panel-priv');
const bR = document.getElementById('ofs-pill-priv');
if (pP) pP.style.display = st.showPricing ? 'block' : 'none';
if (bP) bP.className = 'opt-pill' + (st.showPricing ? ' active' : '');
if (pS) pS.style.display = st.showShare ? 'block' : 'none';
if (bS) bS.className = 'opt-pill' + (st.showShare ? ' active-amber' : '');
if (pR) pR.style.display = st.showPriv ? 'block' : 'none';
if (bR) bR.className = 'opt-pill' + (st.showPriv ? ' active-purple' : '');

const lf = document.getElementById('lbl-ofs-from');
const lt = document.getElementById('lbl-ofs-to');
if (lf) lf.textContent = st.showPricing ? 'طرف اول — فروشنده به شما' : 'تحویل‌دهنده / واریزکننده (+)';
if (lt) lt.textContent = st.showPricing ? 'طرف دوم — خریدار از شما' : 'تحویل‌گیرنده (-)';

const opM = document.getElementById('ofs-op-mul');
const opD = document.getElementById('ofs-op-div');
if (opM) opM.className = 'seg-btn' + (st.op === 'mul' ? ' active' : '');
if (opD) opD.className = 'seg-btn' + (st.op === 'div' ? ' active' : '');

const dDir = document.getElementById('ofs-del-direct');
const dOpn = document.getElementById('ofs-del-open');
if (dDir) dDir.className = 'seg-btn' + (st.delivery === 'direct' ? ' active' : '');
if (dOpn) dOpn.className = 'seg-btn' + (st.delivery === 'open' ? ' active' : '');

const effShareMode = st.showPricing ? st.shareMode : 'fixed';
const smWrap = document.getElementById('ofs-share-mode-wrap');
const smPct = document.getElementById('ofs-sm-pct');
const smFix = document.getElementById('ofs-sm-fix');
const pctBox = document.getElementById('ofs-share-pct-box');
const fixBox = document.getElementById('ofs-share-fix-box');
const manGrossWrap = document.getElementById('ofs-manual-gross-wrap');
if (smWrap) smWrap.style.display = st.showPricing ? 'block' : 'none';
if (smPct) smPct.className = 'seg-btn' + (effShareMode === 'percent' ? ' active' : '');
if (smFix) smFix.className = 'seg-btn' + (effShareMode === 'fixed' ? ' active' : '');
if (pctBox) pctBox.style.display = effShareMode === 'percent' ? 'block' : 'none';
if (fixBox) fixBox.style.display = effShareMode === 'fixed' ? 'block' : 'none';
if (manGrossWrap) manGrossWrap.style.display = !st.showPricing ? 'block' : 'none';
},
computeOffsetDraft() {
const st = this._ofsState || {};
const fromId = document.getElementById('ofs-from')?.value || '';
const toId = document.getElementById('ofs-to')?.value || '';
const cur1Code = document.getElementById('ofs-cur')?.value || '';
const amt1Micro = Dec.toMicro(document.getElementById('ofs-amt')?.value || '');
if (!fromId || !toId || fromId === toId) {
return { valid: false, reason: 'طرف اول و طرف دوم باید دو طرف حساب متفاوت باشند.' };
}
if (amt1Micro <= 0n) {
return { valid: false, reason: 'مبلغ را وارد کنید تا اثر دقیق روی حساب‌ها محاسبه شود.' };
}
const fromCp = this.state.counterparties.find(c => c.id === fromId);
const toCp = this.state.counterparties.find(c => c.id === toId);
const cur1 = this.getCurrency(cur1Code);

let pricing = null;
if (st.showPricing) {
const cur2Code = document.getElementById('ofs-cur2')?.value || '';
if (!cur2Code || cur2Code === cur1Code) {
return { valid: false, reason: 'ارز تسویه (دوم) باید با ارز اصلی متفاوت باشد.' };
}
const buyRateMicro = Dec.toMicro(document.getElementById('ofs-buy-rate')?.value || '');
const sellRateMicro = Dec.toMicro(document.getElementById('ofs-sell-rate')?.value || '');
if (buyRateMicro <= 0n || sellRateMicro <= 0n) {
return { valid: false, reason: 'هر دو نرخ خرید و نرخ فروش را وارد کنید.' };
}
const cur2 = this.getCurrency(cur2Code);
const buyTotalMicro = st.op === 'div' ? Dec.divMicro(amt1Micro, buyRateMicro) : Dec.mulMicro(amt1Micro, buyRateMicro);
const sellTotalMicro = st.op === 'div' ? Dec.divMicro(amt1Micro, sellRateMicro) : Dec.mulMicro(amt1Micro, sellRateMicro);
const grossProfitMicro = sellTotalMicro - buyTotalMicro;
pricing = {
cur2Code,
cur2,
op: st.op || 'mul',
delivery: st.delivery || 'direct',
buyRateMicro,
sellRateMicro,
buyTotalMicro,
sellTotalMicro,
grossProfitMicro
};
}

let share = null;
if (st.showShare) {
const partnerId = document.getElementById('ofs-partner')?.value || '';
const partnerCp = this.state.counterparties.find(c => c.id === partnerId);
if (!partnerCp) {
return { valid: false, reason: 'شریک دریافت‌کننده سهم سود را انتخاب کنید.' };
}
const effMode = st.showPricing ? (st.shareMode || 'percent') : 'fixed';
let shareAmtMicro = 0n;
let shareCurCode = '';
let sharePercent = 0;
let manualGrossMicro = 0n;
if (effMode === 'percent' && pricing) {
const pctMicro = Dec.toMicro(document.getElementById('ofs-share-pct')?.value || '');
if (pctMicro <= 0n || pctMicro > Dec.toMicro(100)) {
return { valid: false, reason: 'درصد سهم شریک باید بین ۰ تا ۱۰۰ باشد.' };
}
sharePercent = Num.parse(document.getElementById('ofs-share-pct')?.value || '');
shareCurCode = pricing.cur2Code;
const baseProfit = pricing.grossProfitMicro > 0n ? pricing.grossProfitMicro : 0n;
shareAmtMicro = Dec.divMicro(Dec.mulMicro(baseProfit, pctMicro), Dec.toMicro(100));
if (shareAmtMicro <= 0n) {
return { valid: false, reason: 'سود معامله صفر یا منفی است؛ سهم درصدی قابل محاسبه نیست (از مبلغ ثابت استفاده کنید یا نرخ‌ها را بررسی کنید).' };
}
} else {
shareAmtMicro = Dec.toMicro(document.getElementById('ofs-share-amt')?.value || '');
shareCurCode = document.getElementById('ofs-share-cur')?.value || (pricing ? pricing.cur2Code : cur1Code);
if (!st.showPricing) {
manualGrossMicro = Dec.toMicro(document.getElementById('ofs-manual-gross')?.value || '');
}
if (shareAmtMicro <= 0n) {
return { valid: false, reason: 'مبلغ سهم سود شریک را وارد کنید.' };
}
}
share = {
partnerId,
partnerCp,
mode: effMode,
percent: sharePercent,
amtMicro: shareAmtMicro,
curCode: shareCurCode,
cur: this.getCurrency(shareCurCode),
manualGrossMicro
};
}

return { valid: true, fromId, toId, fromCp, toCp, cur1Code, cur1, amt1Micro, pricing, share };
},
updateOffsetPreview() {
const box = document.getElementById('ofs-preview-box');
if (!box) return;
const d = this.computeOffsetDraft();
if (!d.valid) {
box.innerHTML = `<div style="font-size:12.5px; color:var(--text-muted); text-align:center;">${escapeHtml(d.reason)}</div>`;
return;
}
let linesHtml = '';
let profitHtml = '';
if (!d.pricing) {
linesHtml = `
<div class="preview-line">
<span>حساب <strong>${escapeHtml(d.fromCp?.name)}</strong> (تحویل‌دهنده):</span>
<span class="balance-chip credit">${CurIcon.svg(d.cur1.code, 'xs', d.cur1.symbol)}<span style="direction:ltr">+${Num.formatMicro(d.amt1Micro)}</span><span>${escapeHtml(d.cur1.name)} (طلبکار)</span></span>
</div>
<div class="preview-line">
<span>حساب <strong>${escapeHtml(d.toCp?.name)}</strong> (تحویل‌گیرنده):</span>
<span class="balance-chip debit">${CurIcon.svg(d.cur1.code, 'xs', d.cur1.symbol)}<span style="direction:ltr">-${Num.formatMicro(d.amt1Micro)}</span><span>${escapeHtml(d.cur1.name)} (بدهکار)</span></span>
</div>
`;
} else {
const p = d.pricing;
if (p.delivery === 'direct') {
linesHtml = `
<div class="preview-line">
<span>حساب <strong>${escapeHtml(d.fromCp?.name)}</strong> (فروشنده • تحویل داد):</span>
<span class="balance-chip credit">${CurIcon.svg(p.cur2.code, 'xs', p.cur2.symbol)}<span style="direction:ltr">+${Num.formatMicro(p.buyTotalMicro)}</span><span>${escapeHtml(p.cur2.name)}</span></span>
</div>
<div class="preview-line">
<span>حساب <strong>${escapeHtml(d.toCp?.name)}</strong> (خریدار • تحویل گرفت):</span>
<span class="balance-chip debit">${CurIcon.svg(p.cur2.code, 'xs', p.cur2.symbol)}<span style="direction:ltr">-${Num.formatMicro(p.sellTotalMicro)}</span><span>${escapeHtml(p.cur2.name)}</span></span>
</div>
`;
} else {
linesHtml = `
<div class="preview-line">
<span>حساب <strong>${escapeHtml(d.fromCp?.name)}</strong> (فروشنده):</span>
<span style="display:flex; gap:4px; flex-wrap:wrap;">
<span class="balance-chip debit">${CurIcon.svg(d.cur1.code, 'xs', d.cur1.symbol)}<span style="direction:ltr">-${Num.formatMicro(d.amt1Micro)}</span><span>${escapeHtml(d.cur1.name)}</span></span>
<span class="balance-chip credit">${CurIcon.svg(p.cur2.code, 'xs', p.cur2.symbol)}<span style="direction:ltr">+${Num.formatMicro(p.buyTotalMicro)}</span><span>${escapeHtml(p.cur2.name)}</span></span>
</span>
</div>
<div class="preview-line">
<span>حساب <strong>${escapeHtml(d.toCp?.name)}</strong> (خریدار):</span>
<span style="display:flex; gap:4px; flex-wrap:wrap;">
<span class="balance-chip credit">${CurIcon.svg(d.cur1.code, 'xs', d.cur1.symbol)}<span style="direction:ltr">+${Num.formatMicro(d.amt1Micro)}</span><span>${escapeHtml(d.cur1.name)}</span></span>
<span class="balance-chip debit">${CurIcon.svg(p.cur2.code, 'xs', p.cur2.symbol)}<span style="direction:ltr">-${Num.formatMicro(p.sellTotalMicro)}</span><span>${escapeHtml(p.cur2.name)}</span></span>
</span>
</div>
`;
}
const sameShareCur = d.share && d.share.curCode === p.cur2Code;
const netProfitMicro = sameShareCur ? (p.grossProfitMicro - d.share.amtMicro) : p.grossProfitMicro;
profitHtml = `
<div class="tx-profit-strip" style="${p.grossProfitMicro < 0n ? 'background:var(--debit-bg); border-color:var(--debit-border); color:var(--debit);' : ''}">
<span>💰 اختلاف نرخ (سود کل): <strong style="direction:ltr; display:inline-block;">${Num.formatSigned(p.grossProfitMicro)} ${escapeHtml(p.cur2.name)}</strong></span>
${sameShareCur ? `<span>• سود خالص شما: <strong style="direction:ltr; display:inline-block;">${Num.formatSigned(netProfitMicro)} ${escapeHtml(p.cur2.name)}</strong></span>` : ''}
</div>
`;
}
let shareLine = '';
if (d.share) {
const sh = d.share;
const pctLbl = sh.mode === 'percent' ? ` (${sh.percent}%)` : '';
shareLine = `
<div class="preview-line" style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border);">

saveOffset(openReceipt = false) {
if (!this.requireAdmin()) return;
if (this._submitting) return;
const d = this.computeOffsetDraft();
if (!d.valid) {
this.toast(d.reason, true);
return;
}
const normDate = this.validateDateInput('ofs-date');
if (!normDate) {
this.toast('تاریخ شمسی معتبر نیست (مثلاً 1405/08/29).', true);
return;
}
this._submitting = true;
setTimeout(() => { this._submitting = false; }, 350);

const refCode = Num.toEnDigits(document.getElementById('ofs-ref')?.value || '').trim();
const note = document.getElementById('ofs-note').value.trim();
const privateNote = (document.getElementById('ofs-private-note')?.value || '').trim();
const amt1Stored = Dec.toStoredVal(d.amt1Micro);

const isEdit = Boolean(this._ofsState && this._ofsState.editGroupId);
const gid = isEdit ? this._ofsState.editGroupId : this.nextId('offset');

let oldLegA = null, oldLegB = null, oldLegP = null, beforeGroup = [];
if (isEdit) {
const grp = this.state.transactions.filter(t => t.offsetGroupId === gid && !t.deleted);

oldLegB = grp.find(t => t.offsetRole === 'to') || null;
oldLegP = grp.find(t => t.offsetRole === 'partner') || null;
if (!oldLegA || !oldLegB) return;
beforeGroup = grp.map(x => JSON.parse(JSON.stringify(x)));
}

let legAEffects, legBEffects, fromSummary, toSummary, fromClientSummary, toClientSummary;
let offsetMode = 'simple';
let offsetDelivery = 'direct';
let profitMeta = null;

if (!d.pricing) {
legAEffects = [{ currency: d.cur1Code, delta: amt1Stored }];
legBEffects = [{ currency: d.cur1Code, delta: amt1NegStored }];
fromSummary = `تهاتر دوجانبه: تحویل ${amt1Txt} ${d.cur1.name} به «${d.toCp.name}»`;
toSummary = `تهاتر دوجانبه: دریافت ${amt1Txt} ${d.cur1.name} از «${d.fromCp.name}»`;
fromClientSummary = `دریافت از طرف حساب: ${amt1Txt} ${d.cur1.name}`;
toClientSummary = `پرداخت به طرف حساب: ${amt1Txt} ${d.cur1.name}`;
if (d.share) {

partnerCpId: d.share.partnerId,

}
} else {

const p = d.pricing;
offsetDelivery = p.delivery;
const buyRateTxt = Num.formatMicro(p.buyRateMicro, 6);
const sellRateTxt = Num.formatMicro(p.sellRateMicro, 6);
const buyTotStored = Dec.toStoredVal(p.buyTotalMicro);
const sellTotNegStored = Dec.toStoredVal(-p.sellTotalMicro);
const buyTotTxt = Num.formatMicro(p.buyTotalMicro);
const sellTotTxt = Num.formatMicro(p.sellTotalMicro);
const opChar = p.op === 'div' ? '÷' : '×';
this.recordLastRate(d.cur1Code, p.cur2Code, Dec.toStoredVal(p.buyRateMicro), p.op);

if (p.delivery === 'direct') {
legAEffects = [{ currency: p.cur2Code, delta: buyTotStored }];
legBEffects = [{ currency: p.cur2Code, delta: sellTotNegStored }];
fromSummary = `معامله دوجانبه (تحویل به «${d.toCp.name}»): خرید ${amt1Txt} ${d.cur1.name} با نرخ ${buyRateTxt} معادل ${buyTotTxt} ${p.cur2.name}`;
toSummary = `معامله دوجانبه (تحویل از «${d.fromCp.name}»): فروش ${amt1Txt} ${d.cur1.name} با نرخ ${sellRateTxt} معادل ${sellTotTxt} ${p.cur2.name}`;
fromClientSummary = `خرید و تحویل ${amt1Txt} ${d.cur1.name} با نرخ ${buyRateTxt} معادل ${buyTotTxt} ${p.cur2.name}`;
toClientSummary = `فروش و تحویل ${amt1Txt} ${d.cur1.name} با نرخ ${sellRateTxt} معادل ${sellTotTxt} ${p.cur2.name}`;
} else {
legAEffects = [
{ currency: d.cur1Code, delta: amt1NegStored },
{ currency: p.cur2Code, delta: buyTotStored }
];
legBEffects = [
{ currency: d.cur1Code, delta: amt1Stored },
{ currency: p.cur2Code, delta: sellTotNegStored }
];
fromSummary = `معامله دوجانبه (خریدار: «${d.toCp.name}»): خرید ${amt1Txt} ${d.cur1.name} با نرخ ${buyRateTxt} (${opChar}) معادل ${buyTotTxt} ${p.cur2.name}`;
toSummary = `معامله دوجانبه (فروشنده: «${d.fromCp.name}»): فروش ${amt1Txt} ${d.cur1.name} با نرخ ${sellRateTxt} (${opChar}) معادل ${sellTotTxt} ${p.cur2.name}`;
fromClientSummary = `خرید ${amt1Txt} ${d.cur1.name} با نرخ ${buyRateTxt} (${opChar}) معادل ${buyTotTxt} ${p.cur2.name}`;
toClientSummary = `فروش ${amt1Txt} ${d.cur1.name} با نرخ ${sellRateTxt} (${opChar}) معادل ${sellTotTxt} ${p.cur2.name}`;
}
profitMeta = {

partnerShare: d.share ? Dec.toStoredVal(d.share.amtMicro) : 0,

const nowTs = Date.now();
const pubTypeForId = offsetMode === 'priced' ? 'deal' : 'transfer';

offsetMode,
offsetDelivery,
partnerCpId: d.share ? d.share.partnerId : '',

op: d.pricing ? d.pricing.op : undefined,
effects: legAEffects,
summary: fromSummary,
clientSummary: fromClientSummary,

};
const commonB = {

offsetRole: 'to',
offsetPeerCpId: d.fromId,
offsetMode,
offsetDelivery,
partnerCpId: d.share ? d.share.partnerId : '',
date: normDate,
currency1: d.cur1Code,
amount1: amt1Stored,
currency2: d.pricing ? d.pricing.cur2Code : undefined,
amount2: d.pricing ? Dec.toStoredVal(d.pricing.sellTotalMicro) : undefined,
rate: d.pricing ? Dec.toStoredVal(d.pricing.sellRateMicro) : undefined,
op: d.pricing ? d.pricing.op : undefined,
effects: legBEffects,
summary: toSummary,
clientSummary: toClientSummary,
profitMeta,
refCode,
note,
privateNote,
deleted: false
};

let legA, legB, legP = null;
if (isEdit) {
const fromChanged = oldLegA.cpId !== d.fromId;
const toChanged = oldLegB.cpId !== d.toId;
Object.assign(oldLegA, commonA);
Object.assign(oldLegB, commonB);
if (fromChanged || !oldLegA.publicId) oldLegA.publicId = this.nextCpTxId(d.fromId);
if (toChanged || !oldLegB.publicId) oldLegB.publicId = this.nextCpTxId(d.toId);
legA = oldLegA;
legB = oldLegB;
if (d.share) {
const shStored = Dec.toStoredVal(d.share.amtMicro);
const shTxt = Num.formatMicro(d.share.amtMicro);
const pctNote = d.share.mode === 'percent' ? ` (${d.share.percent}%)` : '';
const pData = {

offsetRole: 'partner',
offsetMode,
date: normDate,
currency1: d.share.curCode,
amount1: shStored,

note,
privateNote,

if (oldLegP) {

this.addLog('edit', `ویرایش عملیات دوجانبه ${gid}`, `${d.fromCp.name} ← ${d.toCp.name}: ${amt1Txt} ${d.cur1.name}`, afterGroup, 'offset_pair', { beforeSnapshot: beforeGroup, cpIds: allCpIds });
this.toast('عملیات دوجانبه با موفقیت به‌روزرسانی شد.');

legB = Object.assign({ id: idB, publicId: idB, createdAt: nowTs + 1 }, commonB);
const created = [legA, legB];
if (d.share) {
const shStored = Dec.toStoredVal(d.share.amtMicro);
const shTxt = Num.formatMicro(d.share.amtMicro);

offsetMode,

}

async submitClientDeposit(cpId) {
if (!this.canAccessCounterparty(cpId)) return;
const curCode = document.getElementById('cdep-cur')?.value || '';
const amtMicro = Dec.toMicro(document.getElementById('cdep-amt')?.value || '');
const normDate = this.validateDateInput('cdep-date');
const refCode = Num.toEnDigits(document.getElementById('cdep-ref')?.value || '').trim();
const note = (document.getElementById('cdep-note')?.value || '').trim();
const btn = document.getElementById('btn-submit-cdep');

if (!curCode) { this.toast('ارز واریزی را انتخاب کنید.', true); return; }
if (amtMicro <= 0n) { this.toast('مبلغ واریزی باید بزرگ‌تر از صفر باشد.', true); return; }
if (!normDate) { this.toast('تاریخ شمسی معتبر نیست.', true); return; }

const amountStr = Dec.toCanonicalStr(amtMicro);
const nowStr = Jalali.nowDateTimeStr();

if (this.isRemoteClient()) {
const ep = Cloud.getPortalEndpoint();
const rem = this.remotePortalData;
if (!ep || !rem || !rem.authUser || !rem.authHash) {
this.toast('خطا در احراز هویت؛ لطفاً دوباره وارد شوید.', true);
return;
}
if (btn) { btn.disabled = true; btn.textContent = '⏳ در حال ارسال اعلام واریز...'; }
const res = await Cloud.call(ep.url, 'client_submit_deposit', {
p_username: rem.authUser,
p_pass_hash: rem.authHash,
p_currency: curCode,
p_amount: amountStr,
p_date: normDate,
p_ref_code: refCode,
p_note: note,
p_created_at: nowStr
});
if (res.ok && res.data && res.data.ok && res.data.deposit) {
if (!Array.isArray(rem.deposits)) rem.deposits = [];
rem.deposits.unshift(res.data.deposit);
try { sessionStorage.setItem(REMOTE_PORTAL_SESS_KEY, JSON.stringify(rem)); } catch (e) {}
this.closeModal();
this.toast('اعلام واریز شما ثبت شد و در وضعیت «در حال بررسی» قرار گرفت ✓');
this.render();
return;
}
if (btn) { btn.disabled = false; btn.textContent = '📨 ثبت اعلام واریز (ارسال برای بررسی)'; }
const err = (res.data && res.data.error) || res.error || 'خطا در ارسال اعلام واریز.';
this.toast(err === 'عملیات ناشناخته است.' ? 'سرور گوگل شیت هنوز به نسخه ۴ به‌روزرسانی نشده است.' : err, true);
return;
}

// Local / preview fallback
const cp = this.findCounterpartyById(cpId);
const dep = {
id: 'DEP-' + Date.now() + '-' + Math.floor(Math.random() * 900 + 100),
cpId,
cpName: cp ? cp.name : '',
currency: curCode,
amount: amountStr,
date: normDate,
refCode,
note,
status: 'pending',
adminReply: '',
approvedTxId: '',
createdAt: nowStr,
reviewedAt: ''
};
if (!Array.isArray(this.state.deposits)) this.state.deposits = [];
this.state.deposits.unshift(dep);
this.saveState(true);
this.closeModal();
this.toast('اعلام واریز ثبت شد (در حال بررسی) ✓');
this.render();
},

async confirmApproveDeposit(depId, openReceipt = false) {
if (!this.requireAdmin()) return;
const d = (this.state.deposits || []).find(x => x.id === depId);
if (!d || d.status !== 'pending') return;
const cp = this.state.counterparties.find(c => c.id === d.cpId && !c.deleted);
if (!cp) return;

const curCode = document.getElementById('adep-cur')?.value || d.currency;
const amtMicro = Dec.toMicro(document.getElementById('adep-amt')?.value || '');
const feeMicro = Dec.toMicro(document.getElementById('adep-fee')?.value || '0');
const normDate = this.validateDateInput('adep-date');
const refCode = Num.toEnDigits(document.getElementById('adep-ref')?.value || '').trim();
const note = (document.getElementById('adep-note')?.value || '').trim();
const reply = (document.getElementById('adep-reply')?.value || '').trim();

if (amtMicro <= 0n) { this.toast('مبلغ باید بزرگ‌تر از صفر باشد.', true); return; }
if (!normDate) { this.toast('تاریخ شمسی معتبر نیست.', true); return; }

const curObj = this.getCurrency(curCode);
const deltaMicro = amtMicro - feeMicro;
const feeTxt = feeMicro > 0n ? ` (کارمزد: ${Num.formatMicro(feeMicro)} ${curObj.name})` : '';
const summary = `دریافت از طرف حساب: ${Num.formatMicro(amtMicro)} ${curObj.name}${feeTxt}`;
const txId = this.nextCpTxId(cp.id);

const tx = {
id: txId,
cpId: cp.id,
type: 'transfer',
side: 'receive',
date: normDate,
createdAt: Date.now(),
refCode,
note,
privateNote: '',
currency1: curCode,
amount1: Dec.toStoredVal(amtMicro),
fee: Dec.toStoredVal(feeMicro),
feeCurrency: curCode,
roundingNote: '',
effects: [{ currency: curCode, delta: Dec.toStoredVal(deltaMicro) }],
summary,
sourceDepositId: d.id,
deleted: false
};

this.state.transactions.push(tx);
this.addLog('create', `تأیید و ثبت واریز اعلامی ${tx.id} (${cp.name})`, tx.summary, tx, 'tx');

const reviewedAt = Jalali.nowDateTimeStr();
d.status = 'approved';
d.approvedTxId = tx.id;
d.adminReply = reply;
d.reviewedAt = reviewedAt;
d.amount = Dec.toCanonicalStr(amtMicro);
d.currency = curCode;
d.date = normDate;

this.saveState(true);
if (Cloud.isAdminConnected()) {
const cfg = Cloud.getAdminConfig();
Cloud.call(cfg.url, 'admin_review_deposit', {
p_admin_hash: cfg.adminHash,
p_deposit_id: d.id,
p_status: 'approved',
p_admin_reply: reply,
p_approved_tx_id: tx.id,
p_reviewed_at: reviewedAt
});
}

this.closeModal();
this.toast(`واریز با شناسه #${tx.id} در دفتر ثبت و مانده به‌روزرسانی شد ✓`);
this.render();
if (openReceipt) {
this.openTxReceiptModal([tx.id]);
}
},

async submitClientChangePassword() {
if (!this.isClientMode()) return;
const oldRaw = Num.toEnDigits(document.getElementById('cpass-old')?.value || '').trim();
const new1 = Num.toEnDigits(document.getElementById('cpass-new1')?.value || '').trim();
const new2 = Num.toEnDigits(document.getElementById('cpass-new2')?.value || '').trim();
const btn = document.getElementById('btn-submit-cpass');

if (!oldRaw) { this.toast('رمز عبور فعلی را وارد کنید.', true); return; }
if (new1.length < 4) { this.toast('رمز عبور جدید باید حداقل ۴ کاراکتر باشد.', true); return; }
if (new1 !== new2) { this.toast('رمز جدید و تکرار آن یکسان نیستند.', true); return; }
if (oldRaw === new1) { this.toast('رمز جدید نمی‌تواند با رمز فعلی یکسان باشد.', true); return; }

const curHash = Sec.hashSecret(oldRaw, 'client');
const newHash = Sec.hashSecret(new1, 'client');

if (this.isRemoteClient()) {
const ep = Cloud.getPortalEndpoint();
const rem = this.remotePortalData;
if (!ep || !rem || !rem.authUser) {
this.toast('خطا در احراز هویت؛ لطفاً دوباره وارد شوید.', true);
return;
}
if (curHash !== rem.authHash) {
this.toast('رمز عبور فعلی اشتباه است.', true);
return;
}
if (btn) { btn.disabled = true; btn.textContent = '⏳ در حال تغییر رمز عبور...'; }
const res = await Cloud.call(ep.url, 'client_change_password', {
p_username: rem.authUser,
p_current_pass_hash: curHash,
p_new_pass_hash: newHash,
p_changed_at: Jalali.nowDateTimeStr()
});
if (res.ok && res.data && res.data.ok) {
rem.authHash = newHash;
try { sessionStorage.setItem(REMOTE_PORTAL_SESS_KEY, JSON.stringify(rem)); } catch (e) {}
this.closeModal();
this.toast('رمز عبور شما با موفقیت تغییر یافت ✓');
return;
}
if (btn) { btn.disabled = false; btn.textContent = '🔑 ذخیره رمز عبور جدید'; }
const err = (res.data && res.data.error) || res.error || 'خطا در تغییر رمز عبور.';
if (err === 'INVALID_CURRENT_PASSWORD') this.toast('رمز عبور فعلی اشتباه است.', true);
else if (err === 'عملیات ناشناخته است.') this.toast('سرور گوگل شیت هنوز به نسخه ۴ به‌روزرسانی نشده است.', true);
else this.toast(err, true);
return;
}

// Local / admin preview fallback
const cp = this.state.counterparties.find(c => c.id === this.session.cpId && !c.deleted);
if (!cp || !cp.portal) { this.toast('حساب پورتال یافت نشد.', true); return; }
if (cp.portal.passHash && cp.portal.passHash !== curHash) {
this.toast('رمز عبور فعلی اشتباه است.', true);
return;
}
cp.portal.passHash = newHash;
cp.portal.updatedAt = Date.now();
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); } catch (e) {}
this.closeModal();
this.toast('رمز عبور با موفقیت تغییر یافت ✓');
},

<span style="font-size:11px; color:var(--text-muted); direction:ltr;">${escapeHtml(d.createdAt)}</span>
</div>
<div style="font-size:11.5px; color:var(--text-muted); margin-bottom:5px;">${escapeHtml(d.txDate)} — ${escapeHtml(d.txSummary)}</div>
<div style="margin-bottom:4px;"><span class="dispute-badge">${escapeHtml(d.reason)}</span></div>
<div style="background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:7px 9px; margin-bottom:6px;">${escapeHtml(d.message)}</div>
${d.adminReply ? `<div style="font-size:12px; color:var(--credit); font-weight:700; margin-bottom:6px;">💬 پاسخ شما: ${escapeHtml(d.adminReply)}</div>` : ''}
<div style="display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;">
${d.cpId ? `<button class="btn btn-xs btn-blue" onclick="app.closeModal(); app.openCounterparty('${d.cpId}', '${escapeHtml(String(d.txId||'').replace(/['"\\]/g,''))}')">↗️ رفتن به تراکنش</button>` : ''}
<button class="btn btn-xs ${isOpen ? 'btn-primary' : 'btn-secondary'}" onclick="app.openResolveDisputeModal('${d.id}')">
${isOpen ? '💬 ثبت پاسخ و بستن' : '✏️ ویرایش پاسخ'}
</button>
</div>
</div>
`;
};
this.openModal(`⚠️ گزارش‌های مغایرت (${openList.length} باز)`, `
${Cloud.isAdminConnected() ? `<button class="btn btn-xs btn-secondary btn-block" style="margin-bottom:10px;" onclick="app.refreshAdminDisputes()">🔄 بررسی گزارش‌های جدید از گوگل شیت</button>` : ''}
${!list.length ? `<div class="empty-state" style="padding:20px 10px;"><div>هیچ گزارش مغایرتی ثبت نشده است.</div></div>` : `
${openList.length ? `<div class="form-label" style="color:var(--amber-text);">در انتظار بررسی (${openList.length}):</div>${openList.map(renderItem).join('')}` : ''}
${resolvedList.length ? `<div class="form-label" style="margin-top:10px; color:var(--credit);">بررسی‌شده (${resolvedList.length}):</div>${resolvedList.slice(0, 20).map(renderItem).join('')}` : ''}
`}
`);
},
async refreshAdminDisputes() {
if (!this.requireAdmin() || !Cloud.isAdminConnected()) return;
await this.cloudPullAdmin(false, false);
this.openDisputesListModal();
},
openResolveDisputeModal(disputeId) {
if (!this.requireAdmin()) return;
const d = (this.state.disputes || []).find(x => x.id === disputeId);
if (!d) return;
const quickReplies = [
'بررسی و اصلاح شد.',
'بررسی شد و مطابق فیش بانکی صحیح است.',
'در حال بررسی هستم، به‌زودی اصلاح می‌شود.'
];
this.openModal(`💬 پاسخ به مغایرت • ${d.cpName}`, `
<div class="card" style="background:var(--amber-bg); border-color:var(--amber-border); color:var(--amber-text); padding:10px 12px; margin-bottom:10px; font-size:12px;">
<div><strong>#${escapeHtml(d.txId)}</strong> (${escapeHtml(d.txDate)}) — ${escapeHtml(d.reason)}</div>
<div style="margin-top:4px;">${escapeHtml(d.message)}</div>
</div>
<div class="reason-pills">
${quickReplies.map(r => `<button type="button" class="reason-pill" onclick="document.getElementById('dsp-admin-reply').value='${escapeHtml(r)}'">${escapeHtml(r)}</button>`).join('')}
</div>
<div class="form-group">
<label class="form-label">پاسخ شما (برای کاربر نمایش داده می‌شود)</label>
<textarea id="dsp-admin-reply" class="receipt-textarea" style="min-height:95px;" placeholder="توضیح نتیجه بررسی...">${escapeHtml(d.adminReply || '')}</textarea>
</div>
<div class="grid-2">
<button class="btn btn-primary" onclick="app.submitResolveDispute('${d.id}', 'resolved')">✅ ثبت پاسخ و بستن</button>
<button class="btn btn-secondary" onclick="app.submitResolveDispute('${d.id}', 'open')">⏳ نگه‌داشتن در حالت باز</button>
</div>
`);
},
async submitResolveDispute(disputeId, newStatus = 'resolved') {
if (!this.requireAdmin()) return;
const d = (this.state.disputes || []).find(x => x.id === disputeId);
if (!d) return;
const reply = (document.getElementById('dsp-admin-reply')?.value || '').trim();
const resolvedAt = newStatus === 'resolved' ? Jalali.nowDateTimeStr() : '';
d.status = newStatus;
d.adminReply = reply;
d.resolvedAt = resolvedAt;
this.saveState(false);

if (Cloud.isAdminConnected()) {
const cfg = Cloud.getAdminConfig();
await Cloud.call(cfg.url, 'admin_resolve_dispute', {
p_admin_hash: cfg.adminHash,
p_dispute_id: d.id,
p_status: newStatus,
p_admin_reply: reply,
p_resolved_at: resolvedAt
});
}
this.closeModal();
this.toast(newStatus === 'resolved' ? 'پاسخ ثبت شد و گزارش مغایرت بسته شد ✓' : 'تغییرات ذخیره شد.');
this.render();
},

openModal(title, bodyHtml) {
document.getElementById('modal-title').textContent = title;
document.getElementById('modal-body').innerHTML = bodyHtml;
document.getElementById('modal-backdrop').classList.add('open');
document.body.classList.add('modal-open');
},
closeModal() {
document.getElementById('modal-backdrop').classList.remove('open');
document.body.classList.remove('modal-open');
}
};
window.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
