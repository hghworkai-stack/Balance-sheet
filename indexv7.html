<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="دفتر صرافی" />
  <title>دفتر صرافی هوشمند</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
--bg: #eef2f6;
--bg-accent: radial-gradient(circle at top right, rgba(15, 118, 110, 0.08), transparent 45%);
--surface: #ffffff;
--surface-2: #f8fafc;
--surface-hover: #f1f5f9;
--border: #e2e8f0;
--border-strong: #cbd5e1;
--text: #0f172a;
--text-secondary: #334155;
--text-muted: #64748b;
--primary: #0d9488;
--primary-dark: #0f766e;
--primary-light: #ccfbf1;
--primary-soft: rgba(13, 148, 136, 0.12);
--credit: #059669;
--credit-bg: #ecfdf5;
--credit-border: #a7f3d0;
--debit: #dc2626;
--debit-bg: #fef2f2;
--debit-border: #fecaca;
--amber: #d97706;
--amber-bg: #fffbeb;
--amber-border: #fde68a;
--amber-text: #92400e;
--blue: #2563eb;
--blue-bg: #eff6ff;
--blue-border: #bfdbfe;
--purple: #7c3aed;
--purple-bg: #f5f3ff;
--purple-border: #ddd6fe;
--topbar-bg: rgba(15, 23, 42, 0.94);
--nav-bg: rgba(255, 255, 255, 0.92);
--dark-card: linear-gradient(135deg, #0b1220 0%, #16243d 52%, #0f4c4a 100%);
--radius: 18px;
--radius-sm: 12px;
--shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
--shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
--shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.16);
--nav-height: 68px;
}
body.dark-theme {
--bg: #090e1a;
--bg-accent: radial-gradient(circle at top right, rgba(20, 184, 166, 0.10), transparent 48%);
--surface: #111827;
--surface-2: #1a2334;
--surface-hover: #222e44;
--border: rgba(148, 163, 184, 0.16);
--border-strong: rgba(148, 163, 184, 0.28);
--text: #f1f5f9;
--text-secondary: #cbd5e1;
--text-muted: #94a3b8;
--primary: #14b8a6;
--primary-dark: #0d9488;
--primary-light: rgba(20, 184, 166, 0.18);
--primary-soft: rgba(20, 184, 166, 0.15);
--credit: #34d399;
--credit-bg: rgba(16, 185, 129, 0.13);
--credit-border: rgba(52, 211, 153, 0.30);
--debit: #f87171;
--debit-bg: rgba(239, 68, 68, 0.13);
--debit-border: rgba(248, 113, 113, 0.30);
--amber: #fbbf24;
--amber-bg: rgba(245, 158, 11, 0.13);
--amber-border: rgba(251, 191, 36, 0.30);
--amber-text: #fde68a;
--blue: #60a5fa;
--blue-bg: rgba(59, 130, 246, 0.14);
--blue-border: rgba(96, 165, 250, 0.30);
--purple: #a78bfa;
--purple-bg: rgba(139, 92, 246, 0.15);
--purple-border: rgba(167, 139, 250, 0.30);
--topbar-bg: rgba(9, 14, 26, 0.94);
--nav-bg: rgba(17, 24, 39, 0.94);
--dark-card: linear-gradient(135deg, #0d1b2a 0%, #152a45 50%, #0f4c4a 100%);
--shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
--shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
--shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.55);
}
* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}
html, body {
margin: 0;
padding: 0;
font-family: 'Vazirmatn', 'IRANSans', 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
background-color: var(--bg);
background-image: var(--bg-accent);
background-attachment: fixed;
color: var(--text);
font-size: 14px;
line-height: 1.65;
min-height: 100vh;
transition: background-color 0.2s ease, color 0.2s ease;
}
body.modal-open {
overflow: hidden;
}
button, input, select, textarea {
font-family: inherit;
font-size: inherit;
}
svg.ico-svg {
width: 18px;
height: 18px;
stroke: currentColor;
fill: none;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
flex-shrink: 0;
}
svg.ico-svg-sm { width: 15px; height: 15px; }
svg.ico-svg-lg { width: 22px; height: 22px; }
.app-shell {
max-width: 680px;
margin: 0 auto;
min-height: 100vh;
padding-bottom: calc(var(--nav-height) + 88px + env(safe-area-inset-bottom, 0px));
}
.topbar {
position: sticky;
top: 0;
z-index: 40;
background: var(--topbar-bg);
backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);
color: #fff;
padding: 11px 14px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
border-bottom: 1px solid rgba(255,255,255,0.08);
box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
}
.topbar-title {
display: flex;
align-items: center;
gap: 9px;
min-width: 0;
flex: 1;
}
.topbar-brand-dot {
width: 34px;
height: 34px;
border-radius: 11px;
background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%);
display: inline-flex;
align-items: center;
justify-content: center;
color: #fff;
flex-shrink: 0;
box-shadow: 0 4px 12px rgba(20, 184, 166, 0.35);
}
.topbar-title-text {
min-width: 0;
}
.topbar-title h1 {
margin: 0;
font-size: 15.5px;
font-weight: 800;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
letter-spacing: -0.01em;
}
.topbar-subtitle {
font-size: 11px;
color: #94a3b8;
display: block;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.topbar-actions {
display: flex;
align-items: center;
gap: 5px;
flex-shrink: 0;
}
.btn-icon {
border: 1px solid rgba(255,255,255,0.10);
background: rgba(255,255,255,0.09);
color: #e2e8f0;
width: 36px;
height: 36px;
border-radius: 11px;
display: inline-flex;
align-items: center;
justify-content: center;
cursor: pointer;
flex-shrink: 0;
font-size: 15px;
transition: background 0.15s, transform 0.1s;
}
.btn-icon:hover { background: rgba(255,255,255,0.16); color: #fff; }
.btn-icon:active { transform: scale(0.93); }
.sync-pill {
font-size: 10.5px;
font-weight: 700;
padding: 4px 8px;
border-radius: 999px;
background: rgba(16, 185, 129, 0.16);
border: 1px solid rgba(52, 211, 153, 0.25);
color: #6ee7b7;
white-space: nowrap;
display: inline-flex;
align-items: center;
gap: 4px;
}
.sync-dot {
width: 6px;
height: 6px;
border-radius: 50%;
background: #34d399;
box-shadow: 0 0 6px #34d399;
}
@media (max-width: 400px) {
.sync-pill #sync-status-text { display: none; }
.sync-pill { padding: 6px; }
}
.backup-banner {
background: var(--amber-bg);
border: 1px solid var(--amber-border);
color: var(--amber-text);
border-radius: 14px;
padding: 10px 12px;
margin-bottom: 12px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
flex-wrap: wrap;
font-size: 12px;
}
.backup-banner-actions {
display: flex;
gap: 6px;
align-items: center;
}
.container {
padding: 14px 14px 10px;
animation: fadeInView 0.16s ease-out;
}
@keyframes fadeInView {
from { opacity: 0.75; transform: translateY(4px); }
to { opacity: 1; transform: translateY(0); }
}
.card {
background: var(--surface);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 14px;
box-shadow: var(--shadow-sm);
margin-bottom: 12px;
}
.section-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 12px;
gap: 8px;
}
.section-title {
margin: 0;
font-size: 15px;
font-weight: 800;
color: var(--text);
display: inline-flex;
align-items: center;
gap: 6px;
}
.btn {
border: none;
border-radius: var(--radius-sm);
padding: 10px 14px;
min-height: 40px;
font-weight: 700;
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
gap: 6px;
transition: transform 0.1s ease, background 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
font-size: 13px;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary {
background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
color: #fff;
box-shadow: 0 4px 12px rgba(13, 148, 136, 0.24);
}
.btn-primary:hover { filter: brightness(1.04); }
.btn-secondary {
background: var(--surface-2);
color: var(--text);
border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--surface-hover); }
.btn-danger { background: var(--debit-bg); color: var(--debit); border: 1px solid var(--debit-border); }
.btn-credit { background: var(--credit-bg); color: var(--credit); border: 1px solid var(--credit-border); }
.btn-blue { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
.btn-amber { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.btn-purple { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-border); }
.btn-sm { padding: 6px 10px; min-height: 34px; font-size: 12px; border-radius: 9px; }
.btn-xs { padding: 4px 9px; min-height: 29px; font-size: 11px; border-radius: 8px; }
.btn-block { width: 100%; }
.form-group {
margin-bottom: 12px;
}
.form-label {
display: flex;
align-items: center;
justify-content: space-between;
font-size: 12px;
font-weight: 700;
color: var(--text-secondary);
margin-bottom: 5px;
gap: 6px;
}
.form-control {
width: 100%;
padding: 10px 12px;
min-height: 42px;
border: 1.5px solid var(--border);
border-radius: var(--radius-sm);
background: var(--surface);
color: var(--text);
outline: none;
transition: border-color 0.15s, box-shadow 0.15s;
}
.form-control:focus {
border-color: var(--primary);
box-shadow: 0 0 0 3px var(--primary-soft);
}
.form-control.invalid {
border-color: var(--debit);
background: var(--debit-bg);
}
.input-ltr {
direction: ltr;
text-align: left;
font-variant-numeric: tabular-nums;
}
.date-hint {
font-size: 11px;
margin-top: 3px;
min-height: 16px;
}
.date-hint.err { color: var(--debit); font-weight: 700; }
.date-hint.ok { color: var(--credit); }
.grid-2 {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.grid-3 {
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 8px;
}
.search-box {
position: relative;
margin-bottom: 12px;
}
.search-box input {
padding-right: 38px;
padding-left: 34px;
border-radius: 14px;
background: var(--surface);
}
.search-box .search-ico {
position: absolute;
right: 12px;
top: 50%;
transform: translateY(-50%);
color: var(--text-muted);
pointer-events: none;
display: inline-flex;
}
.search-clear-btn {
position: absolute;
left: 8px;
top: 50%;
transform: translateY(-50%);
width: 24px;
height: 24px;
border-radius: 50%;
border: none;
background: var(--surface-hover);
color: var(--text-muted);
font-size: 12px;
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
}
.kpi-strip {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 8px;
margin-bottom: 12px;
}
.kpi-mini {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 14px;
padding: 9px 10px;
text-align: center;
box-shadow: var(--shadow-sm);
}
.kpi-mini-val {
font-size: 15px;
font-weight: 800;
color: var(--text);
font-variant-numeric: tabular-nums;
line-height: 1.3;
}
.kpi-mini-lbl {
font-size: 10.5px;
color: var(--text-muted);
font-weight: 600;
}
.cp-item {
background: var(--surface);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 13px 14px;
margin-bottom: 10px;
cursor: pointer;
box-shadow: var(--shadow-sm);
transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
}
.cp-item:hover {
border-color: var(--border-strong);
box-shadow: var(--shadow);
}
.cp-item:active { transform: scale(0.988); border-color: var(--primary); }
.cp-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 10px;
gap: 10px;
}
.cp-ident {
display: flex;
align-items: center;
gap: 10px;
min-width: 0;
}
.cp-avatar {
width: 40px;
height: 40px;
border-radius: 13px;
color: #fff;
font-size: 16px;
font-weight: 800;
display: inline-flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.14);
}
.cp-name {
font-size: 14.5px;
font-weight: 800;
color: var(--text);
line-height: 1.35;
}
.cp-meta {
font-size: 11px;
color: var(--text-muted);
}
.chip-list {
display: flex;
flex-wrap: wrap;
gap: 6px;
}
.balance-chip {
font-size: 12px;
font-weight: 700;
padding: 4px 9px;
border-radius: 9px;
display: inline-flex;
align-items: center;
gap: 5px;
font-variant-numeric: tabular-nums;
}
.balance-chip.credit { background: var(--credit-bg); color: var(--credit); border: 1px solid var(--credit-border); }
.balance-chip.debit { background: var(--debit-bg); color: var(--debit); border: 1px solid var(--debit-border); }
.balance-chip.zero { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
.hero-card {
background: var(--dark-card);
color: #fff;
border-radius: 22px;
padding: 18px 16px 16px;
margin-bottom: 12px;
box-shadow: var(--shadow-lg);
position: relative;
overflow: hidden;
}
.hero-card::before {
content: '';
position: absolute;
top: -40px;
left: -40px;
width: 140px;
height: 140px;
border-radius: 50%;
background: radial-gradient(circle, rgba(45, 212, 191, 0.18), transparent 70%);
pointer-events: none;
}
.hero-card::after {
content: '';
position: absolute;
bottom: -50px;
right: -30px;
width: 160px;
height: 160px;
border-radius: 50%;
background: radial-gradient(circle, rgba(56, 189, 248, 0.14), transparent 70%);
pointer-events: none;
}
.hero-top {
position: relative;
z-index: 1;
display: flex;
justify-content: space-between;
align-items: flex-start;
border-bottom: 1px solid rgba(255,255,255,0.12);
padding-bottom: 12px;
margin-bottom: 12px;
gap: 10px;
}
.hero-name {
font-size: 18px;
font-weight: 800;
margin: 0;
}
.hero-date {
font-size: 11px;
color: #94a3b8;
margin-top: 2px;
}
.hero-badge {
font-size: 10.5px;
font-weight: 700;
background: rgba(255,255,255,0.11);
border: 1px solid rgba(255,255,255,0.14);
padding: 4px 10px;
border-radius: 999px;
color: #e2e8f0;
white-space: nowrap;
}
.hero-row {
position: relative;
z-index: 1;
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 12px;
border-radius: 13px;
background: rgba(255,255,255,0.075);
border: 1px solid rgba(255,255,255,0.08);
margin-bottom: 7px;
gap: 8px;
}
.hero-row:last-child { margin-bottom: 0; }
.hero-cur {
font-weight: 700;
font-size: 13.5px;
color: #f8fafc;
}
.hero-val {
text-align: left;
direction: ltr;
font-weight: 800;
font-size: 16px;
font-variant-numeric: tabular-nums;
letter-spacing: 0.01em;
}
.hero-status {
font-size: 10.5px;
padding: 2px 8px;
border-radius: 7px;
font-weight: 700;
margin-right: 6px;
}
.hero-status.credit { background: rgba(16, 185, 129, 0.22); color: #6ee7b7; }
.hero-status.debit { background: rgba(239, 68, 68, 0.22); color: #fca5a5; }
.hero-status.zero { background: rgba(148, 163, 184, 0.20); color: #cbd5e1; }
.export-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 7px;
margin-bottom: 11px;
}
.export-btn {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 14px;
padding: 9px 4px;
display: flex;
flex-direction: column;
align-items: center;
gap: 5px;
cursor: pointer;
font-size: 11px;
font-weight: 700;
color: var(--text);
box-shadow: var(--shadow-sm);
transition: transform 0.1s, border-color 0.15s, background 0.15s;
}
.export-btn:hover { border-color: var(--primary); background: var(--surface-2); }
.export-btn:active { transform: scale(0.95); }
.export-btn .exp-ico-wrap {
width: 30px;
height: 30px;
border-radius: 9px;
display: inline-flex;
align-items: center;
justify-content: center;
background: var(--primary-soft);
color: var(--primary);
}
.hscroll-bar {
display: flex;
align-items: center;
gap: 6px;
overflow-x: auto;
padding: 2px 1px 6px;
margin-bottom: 8px;
scrollbar-width: none;
-ms-overflow-style: none;
}
.hscroll-bar::-webkit-scrollbar { display: none; }
.hscroll-bar > * { flex-shrink: 0; }
.filter-toolbar {
display: flex;
align-items: center;
gap: 7px;
margin-bottom: 10px;
}
.filter-toolbar .search-box {
flex: 1;
margin-bottom: 0;
}
.filter-toggle-btn {
height: 42px;
padding: 0 12px;
border-radius: 14px;
border: 1.5px solid var(--border);
background: var(--surface);
color: var(--text);
font-size: 12px;
font-weight: 700;
display: inline-flex;
align-items: center;
gap: 5px;
cursor: pointer;
white-space: nowrap;
flex-shrink: 0;
}
.filter-toggle-btn.active {
border-color: var(--primary);
background: var(--primary-soft);
color: var(--primary);
}
.tx-card {
background: var(--surface);
border: 1px solid var(--border);
border-right: 3.5px solid var(--border-strong);
border-radius: 15px;
padding: 12px 13px;
margin-bottom: 10px;
position: relative;
box-shadow: var(--shadow-sm);
}
.tx-card.deal-card { border-right-color: var(--blue); }
.tx-card.transfer-card { border-right-color: var(--primary); }
.tx-card.opening-card { border-right-color: var(--amber); }
.tx-top {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 7px;
gap: 6px;
flex-wrap: wrap;
}
.tx-tag {
font-size: 11px;
font-weight: 800;
padding: 3px 9px;
border-radius: 8px;
display: inline-flex;
align-items: center;
gap: 4px;
}
.tx-tag.deal { background: var(--blue-bg); color: var(--blue); }
.tx-tag.transfer { background: var(--primary-soft); color: var(--primary); }
.tx-tag.opening { background: var(--amber-bg); color: var(--amber); }
.tx-id {
font-size: 11px;
color: var(--text-muted);
font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
direction: ltr;
}
.tx-desc {
font-size: 13.5px;
font-weight: 700;
margin-bottom: 7px;
color: var(--text);
line-height: 1.55;
}
.tx-effects {
display: flex;
flex-wrap: wrap;
gap: 6px;
margin-bottom: 6px;
}
.tx-note {
font-size: 12px;
color: var(--text-secondary);
background: var(--surface-2);
border: 1px solid var(--border);
padding: 6px 10px;
border-radius: 9px;
margin-top: 6px;
}
.tx-actions {
display: flex;
justify-content: flex-end;
gap: 6px;
margin-top: 9px;
padding-top: 8px;
border-top: 1px dashed var(--border);
}
.segmented {
display: grid;
grid-template-columns: 1fr 1fr;
background: var(--surface-2);
border: 1px solid var(--border);
border-radius: 13px;
padding: 4px;
gap: 4px;
margin-bottom: 12px;
}
.seg-btn {
border: none;
background: transparent;
padding: 9px 8px;
border-radius: 10px;
font-weight: 700;
font-size: 12.5px;
color: var(--text-muted);
cursor: pointer;
transition: all 0.15s ease;
}
.seg-btn.active {
background: var(--primary);
color: #fff;
box-shadow: 0 3px 10px rgba(13, 148, 136, 0.28);
}
.seg-btn.active.sell { background: #0f766e; }
.seg-btn.active.buy { background: #1d4ed8; }
.seg-btn.active.receive { background: var(--credit); }
.seg-btn.active.pay { background: var(--debit); }
.preview-box {

<script>
const Jalali = {
toJalaali(gy, gm, gd) {
const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
let gy2 = (gm > 2) ? (gy + 1) : gy;
let days = 355666 + (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
let jy = -1595 + (33 * Math.floor(days / 12053));
days %= 12053;
jy += 4 * Math.floor(days / 1461);
days %= 1461;
if (days > 365) {
jy += Math.floor((days - 1) / 365);
days = (days - 1) % 365;
}
let jm = (days < 186) ? (1 + Math.floor(days / 31)) : (7 + Math.floor((days - 186) / 30));
let jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
return { jy, jm, jd };
},
fromDate(dateObj) {
const j = this.toJalaali(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate());
const pad = n => String(n).padStart(2, '0');
return `${j.jy}/${pad(j.jm)}/${pad(j.jd)}`;
},
todayStr() {
return this.fromDate(new Date());
},
daysAgoStr(days) {

 */

const CHUNK_SIZE = 40000;
const SHEET_VAULT = '_VAULT_DATA';
const SHEET_PORTALS = '_PORTALS';
const SHEET_PASS_CHANGES = '_PORTAL_PASS_CHANGES';

function jsonOut_(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function getOrCreateSheet_(ss, name, hideSheet) {
  let sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    if (hideSheet) {
      try { sh.hideSheet(); } catch (e) {}
    }
  }
  return sh;
}

function splitChunks_(str) {
  const out = [];
  if (!str) return [''];
  for (let i = 0; i < str.length; i += CHUNK_SIZE) {
    out.push(str.slice(i, i + CHUNK_SIZE));
  }
  return out;
}

function formatSignedNum_(val) {
  if (val === null || val === undefined || val === '') return '0';
  let str = String(val).replace(/,/g, '').trim();
  if (!str || str === '0' || str === '-0' || str === '+0') return '0';
  let neg = false;
  if (str.charAt(0) === '-') { neg = true; str = str.slice(1); }
  else if (str.charAt(0) === '+') { str = str.slice(1); }
  const parts = str.split('.');
  const intPart = (parts[0] || '0').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const fracPart = parts[1] ? parts[1].replace(/0+$/, '') : '';
  const body = fracPart ? (intPart + '.' + fracPart) : intPart;
  if (body === '0') return '0';
  return (neg ? '-' : '+') + body;
}

function dateSortKey_(dateStr) {
  const m = /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(String(dateStr || '').trim());
  if (!m) return 0;
  return parseInt(m[1], 10) * 10000 + parseInt(m[2], 10) * 100 + parseInt(m[3], 10);
}

function txTypeLabel_(tx) {
  if (tx.type === 'deal') return tx.side === 'sell' ? 'معامله (فروش شما)' : 'معامله (خرید شما)';
  if (tx.type === 'transfer') return tx.side === 'receive' ? 'انتقال (دریافت)' : 'انتقال (پرداخت)';
  if (tx.type === 'profit_share' || tx.offsetRole === 'partner' || tx.shareRole === 'partner') return 'تسهیم سود (سهم شریک)';
  if (tx.type === 'offset') {
    if (tx.offsetMode === 'priced') return tx.offsetRole === 'from' ? 'معامله دوجانبه (خرید شما)' : 'معامله دوجانبه (فروش شما)';
    return tx.offsetRole === 'from' ? 'تهاتر دوجانبه (تحویل‌دهنده)' : 'تهاتر دوجانبه (تحویل‌گیرنده)';
  }
  if (tx.type === 'opening') return 'مانده اولیه';
  if (tx.type === 'settlement') return 'تأیید مانده';
  return String(tx.type || 'سایر');
}

function writeTransactionsSheet_(ss, state) {
  const txSh = getOrCreateSheet_(ss, SHEET_TXS, false);
  try { txSh.setRightToLeft(true); } catch (e) {}

  const currencies = Array.isArray(state.currencies) ? state.currencies : [];
  const curNameMap = {};
  for (let i = 0; i < currencies.length; i++) {
    if (currencies[i] && currencies[i].code) {
      curNameMap[currencies[i].code] = currencies[i].name || currencies[i].code;
    }
  }

  const cps = Array.isArray(state.counterparties) ? state.counterparties : [];
  const activeCpMap = {};
  for (let i = 0; i < cps.length; i++) {
    if (cps[i] && cps[i].id && !cps[i].deleted) {
      activeCpMap[cps[i].id] = cps[i].name || cps[i].id;
    }
  }

  const rawTxs = Array.isArray(state.transactions) ? state.transactions : [];
  const activeTxs = [];
  for (let i = 0; i < rawTxs.length; i++) {
    const t = rawTxs[i];
    if (t && !t.deleted && activeCpMap[t.cpId]) {
      activeTxs.push(t);
    }
  }

  activeTxs.sort(function(a, b) {
    const ka = dateSortKey_(a.date);
    const kb = dateSortKey_(b.date);
    if (ka !== kb) return kb - ka;
    const ra = a.type === 'opening' ? 0 : 1;
    const rb = b.type === 'opening' ? 0 : 1;
    if (ra !== rb) return rb - ra;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  const rows = [[
    'ردیف',
    'تاریخ',
    'شناسه',
    'طرف حساب',
    'نوع ثبت',
    'شرح تراکنش',
    'تأثیر روی حساب (از دید طرف حساب)',
    'شماره فیش / پیگیری',
    'توضیحات / یادداشت محرمانه'
  ]];

  for (let i = 0; i < activeTxs.length; i++) {
    const tx = activeTxs[i];
    let efTxt = '—';
    if (tx.type === 'settlement') {
      efTxt = 'تأیید مانده (بدون تغییر)';
    } else if (Array.isArray(tx.effects) && tx.effects.length) {
      const efParts = [];
      for (let j = 0; j < tx.effects.length; j++) {
        const ef = tx.effects[j];
        if (!ef || !ef.currency) continue;
        const cname = curNameMap[ef.currency] || ef.currency;
        efParts.push(cname + ': ' + formatSignedNum_(ef.delta));
      }
      if (efParts.length) efTxt = efParts.join(' | ');
    }

    const notes = [];
    if (tx.roundingNote) notes.push(tx.roundingNote);
    if (tx.note) notes.push(tx.note);
    if (tx.privateNote) notes.push('[محرمانه]: ' + tx.privateNote);

    rows.push([
      String(i + 1),
      String(tx.date || ''),
      String(tx.publicId || tx.id || ''),
      String(activeCpMap[tx.cpId] || ''),
      txTypeLabel_(tx),
      String(tx.summary || ''),
      efTxt,
      String(tx.refCode || '—'),
      notes.length ? notes.join(' — ') : '—'
    ]);
  }

  txSh.clearContents();
  const range = txSh.getRange(1, 1, rows.length, 9);
  range.setNumberFormat('@');
  range.setValues(rows);
  try {
    txSh.getRange(1, 1, 1, 9).setFontWeight('bold').setBackground('#0f172a').setFontColor('#ffffff');
    txSh.setFrozenRows(1);
  } catch (e) {}
}

function ensureDisputesSheet_(ss) {
  const sh = getOrCreateSheet_(ss, SHEET_DISPUTES, false);
  try { sh.setRightToLeft(true); } catch (e) {}
  if (sh.getLastRow() === 0) {
    const hdr = [['شناسه گزارش', 'کد حساب', 'نام طرف حساب', 'شناسه تراکنش', 'تاریخ تراکنش', 'شرح تراکنش', 'دلیل', 'متن مغایرت کاربر', 'وضعیت', 'پاسخ مدیر', 'زمان ثبت', 'زمان بررسی']];
    const r = sh.getRange(1, 1, 1, 12);
    r.setNumberFormat('@');
    r.setValues(hdr);
    try {
      r.setFontWeight('bold').setBackground('#92400e').setFontColor('#ffffff');
      sh.setFrozenRows(1);
    } catch (e) {}
  }
  return sh;
}

function readDisputes_(ss, filterCpId) {
  const sh = ss.getSheetByName(SHEET_DISPUTES);
  if (!sh || sh.getLastRow() < 2) return [];
  const rows = sh.getRange(2, 1, sh.getLastRow() - 1, 12).getValues();
  const out = [];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0]) continue;
    if (filterCpId && String(r[1]) !== String(filterCpId)) continue;
    out.push({
      id: String(r[0]),
      cpId: String(r[1] || ''),
      cpName: String(r[2] || ''),
      txId: String(r[3] || ''),
      txDate: String(r[4] || ''),
      txSummary: String(r[5] || ''),
      reason: String(r[6] || ''),
      message: String(r[7] || ''),
      status: String(r[8] || 'open'),
      adminReply: String(r[9] || ''),
      createdAt: String(r[10] || ''),
      resolvedAt: String(r[11] || '')
    });
  }
  out.reverse();
  return out;
}

function ensureConfirmationsSheet_(ss) {
  const sh = getOrCreateSheet_(ss, SHEET_CONFIRMATIONS, false);

  if (sh.getLastRow() === 0) {
    const hdr = [['شناسه تأییدیه', 'کد حساب', 'نام طرف حساب', 'خلاصه مانده تأییدشده', 'تعداد تراکنش', 'توضیح کاربر', 'زمان تأیید']];

    r.setNumberFormat('@');

function readPassChanges_(ss) {

    });

function upsertPassChange_(ss, username, cpId, newPassHash, updatedAtMs, changedAt) {
  const sh = getOrCreateSheet_(ss, SHEET_PASS_CHANGES, true);
  if (sh.getLastRow() === 0) {
    sh.getRange(1, 1, 1, 5).setNumberFormat('@').setValues([['username', 'cp_id', 'pass_hash', 'updated_at_ms', 'changed_at']]);
  }
  const uname = String(username || '').trim().toLowerCase();
  if (sh.getLastRow() >= 2) {
    const rows = sh.getRange(2, 1, sh.getLastRow() - 1, 5).getValues();
    for (let i = 0; i < rows.length; i++) {
      if (String(rows[i][1]) === String(cpId) || String(rows[i][0]).trim().toLowerCase() === uname) {
        sh.getRange(i + 2, 1, 1, 5).setNumberFormat('@').setValues([[uname, String(cpId), String(newPassHash), String(updatedAtMs), String(changedAt)]]);
        return;
      }
    }
  }
  sh.getRange(sh.getLastRow() + 1, 1, 1, 5).setNumberFormat('@').setValues([[uname, String(cpId), String(newPassHash), String(updatedAtMs), String(changedAt)]]);
}

function verifyClientPortal_(ss, uname, passHash) {
  const sh = ss.getSheetByName(SHEET_PORTALS);
  if (!sh || sh.getLastRow() < 2) return null;
  const rows = sh.getRange(2, 1, sh.getLastRow() - 1, 8).getValues();
  const matched = [];
  let updatedAt = '';
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (String(r[0]).trim().toLowerCase() === uname &&
        String(r[2]).trim() === passHash &&
        String(r[3]).toUpperCase() === 'TRUE') {
      matched.push({ idx: parseInt(r[5], 10) || 0, chunk: String(r[7] || ''), rowNum: i + 2 });
      updatedAt = String(r[4] || '');
    }
  }
  if (!matched.length) return null;
  matched.sort(function(a, b) { return a.idx - b.idx; });
  const payload = JSON.parse(matched.map(function(m) { return m.chunk; }).join(''));
  return { payload: payload, updatedAt: updatedAt, rowNums: matched.map(function(m) { return m.rowNum; }) };
}

function verifyAdminHash_(ss, adminHash) {
  if (!adminHash) return false;
  const sh = ss.getSheetByName(SHEET_VAULT);
  if (!sh || sh.getLastRow() < 1) return true;
  const meta = sh.getRange(1, 1, 1, 4).getValues()[0];
  if (!meta || meta[0] !== 'meta' || !meta[1]) return true;
  return String(meta[1]) === adminHash;
}

function doGet(e) {
  return jsonOut_({
    ok: true,
    service: 'sarafi-ledger-gsheets',
    version: 5,
    status: 'active',
    message: 'سرور ابری دفتر صرافی روی گوگل شیت فعال است.'
  });
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  try {
    lock.waitLock(20000);
  } catch (err) {
    return jsonOut_({ ok: false, error: 'سرور مشغول است؛ چند ثانیه بعد دوباره تلاش کنید.' });
  }

  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    if (!ss) {
      return jsonOut_({ ok: false, error: 'اسکریپت باید از داخل گوگل شیت (Extensions -> Apps Script) ساخته شود.' });
    }
    if (!e || !e.postData || !e.postData.contents) {
      return jsonOut_({ ok: false, error: 'درخواست نامعتبر است.' });
    }

    const req = JSON.parse(e.postData.contents);
    const action = req.action;

    if (action === 'admin_sync_pull') return handleAdminPull_(ss, req);
    if (action === 'admin_sync_push') return handleAdminPush_(ss, req);
    if (action === 'client_portal_login') return handleClientLogin_(ss, req);
    if (action === 'client_submit_dispute') return handleClientSubmitDispute_(ss, req);
    if (action === 'admin_resolve_dispute') return handleAdminResolveDispute_(ss, req);
    if (action === 'client_confirm_balance') return handleClientConfirmBalance_(ss, req);
    if (action === 'client_change_password') return handleClientChangePassword_(ss, req);
    if (action === 'client_submit_deposit') return handleClientSubmitDeposit_(ss, req);
    if (action === 'admin_review_deposit') return handleAdminReviewDeposit_(ss, req);
    if (action === 'client_save_note') return handleClientSaveNote_(ss, req);
    return jsonOut_({ ok: false, error: 'عملیات ناشناخته است.' });
  } catch (err) {
    return jsonOut_({ ok: false, error: String(err && err.message ? err.message : err) });
  } finally {
    try { lock.releaseLock(); } catch (e2) {}
  }
}

function handleAdminPull_(ss, req) {
  const adminHash = String(req.p_admin_hash || '').trim();
  if (!adminHash) return jsonOut_({ ok: false, error: 'INVALID_ADMIN_KEY' });

  const sh = ss.getSheetByName(SHEET_VAULT);
  const extras = {
    disputes: readDisputes_(ss, null),
    confirmations: readConfirmations_(ss, null),
    deposits: readDeposits_(ss, null),
    pass_changes: readPassChanges_(ss)
  };
  if (!sh || sh.getLastRow() < 2) {
    return jsonOut_(Object.assign({ ok: true, empty: true }, extras));
  }

  const rows = sh.getRange(1, 1, sh.getLastRow(), 4).getValues();
  const meta = rows[0];
  if (!meta || meta[0] !== 'meta' || !meta[1]) {
    return jsonOut_(Object.assign({ ok: true, empty: true }, extras));
  }
  if (String(meta[1]) !== adminHash) {
    return jsonOut_({ ok: false, error: 'INVALID_ADMIN_KEY' });
  }

  const updatedAt = String(meta[2] || '');
  const expectedChunks = parseInt(meta[3], 10) || 0;
  const parts = [];
  for (let i = 1; i < rows.length; i++) {
    if (rows[i][0] === 'chunk') {
      parts.push(String(rows[i][2] || ''));
    }
  }
  if (expectedChunks > 0 && parts.length !== expectedChunks) {
    return jsonOut_({ ok: false, error: 'داده‌های ذخیره‌شده ناقص است.' });
  }

  const stateJson = parts.join('');
  if (!stateJson) return jsonOut_(Object.assign({ ok: true, empty: true }, extras));

  return jsonOut_(Object.assign({
    ok: true,
    empty: false,
    state: JSON.parse(stateJson),
    updated_at: updatedAt
  }, extras));
}

function handleAdminPush_(ss, req) {
  const adminHash = String(req.p_admin_hash || '').trim();
  if (!verifyAdminHash_(ss, adminHash)) {
    return jsonOut_({ ok: false, error: 'INVALID_ADMIN_KEY' });
  }

  const vaultSh = getOrCreateSheet_(ss, SHEET_VAULT, true);
  const nowIso = new Date().toISOString();
  const stateObj = req.p_state || {};
  const stateStr = JSON.stringify(stateObj);
  const chunks = splitChunks_(stateStr);

  const vaultRows = [['meta', adminHash, nowIso, String(chunks.length)]];
  for (let i = 0; i < chunks.length; i++) {
    vaultRows.push(['chunk', String(i), chunks[i], '']);
  }

  vaultSh.clearContents();
  const vRange = vaultSh.getRange(1, 1, vaultRows.length, 4);
  vRange.setNumberFormat('@');
  vRange.setValues(vaultRows);

  const passChanges = readPassChanges_(ss);
  const passChangeByCp = {};
  for (let i = 0; i < passChanges.length; i++) {
    if (passChanges[i].cpId) passChangeByCp[passChanges[i].cpId] = passChanges[i];
  }

  const portalSh = getOrCreateSheet_(ss, SHEET_PORTALS, true);
  const portals = Array.isArray(req.p_portals) ? req.p_portals : [];
  const portalRows = [['username', 'cp_id', 'pass_hash', 'enabled', 'updated_at', 'chunk_idx', 'chunk_cnt', 'payload']];

  for (let i = 0; i < portals.length; i++) {
    const p = portals[i];
    if (!p || !p.username || !p.pass_hash) continue;
    const uname = String(p.username).trim().toLowerCase();
    const cpId = String(p.cp_id || '');
    let effectivePassHash = String(p.pass_hash || '');
    const clientChg = passChangeByCp[cpId];
    if (clientChg && clientChg.updatedAtMs > (parseInt(p.updated_at_ms, 10) || 0)) {
      effectivePassHash = clientChg.passHash;
    }
    const payloadStr = JSON.stringify({
      shop_title: p.shop_title || 'دفتر صرافی هوشمند',
      currencies: p.currencies || [],
      cp: p.cp_profile || {},
      transactions: p.transactions || []
    });
    const pChunks = splitChunks_(payloadStr);
    for (let c = 0; c < pChunks.length; c++) {
      portalRows.push([
        uname,
        cpId,
        effectivePassHash,
        p.enabled ? 'TRUE' : 'FALSE',
        nowIso,
        String(c),
        String(pChunks.length),
        pChunks[c]
      ]);
    }
  }

  portalSh.clearContents();
  const pRange = portalSh.getRange(1, 1, portalRows.length, 8);
  pRange.setNumberFormat('@');
  pRange.setValues(portalRows);

  const summaryRows = Array.isArray(req.p_summary_rows) ? req.p_summary_rows : [];
  const sumSh = getOrCreateSheet_(ss, SHEET_SUMMARY, false);
  try { sumSh.setRightToLeft(true); } catch (e) {}
  const tableRows = [['نام طرف حساب', 'شماره تماس', 'خلاصه بالانس (از دید طرف حساب)', 'پورتال آنلاین', 'آخرین همگام‌سازی']];
  for (let i = 0; i < summaryRows.length; i++) {
    const r = summaryRows[i];
    tableRows.push([
      String(r.name || ''),
      String(r.phone || '—'),
      String(r.balance || 'تسویه (صفر)'),
      String(r.portal || 'غیرفعال'),
      String(r.syncedAt || nowIso)
    ]);
  }
  sumSh.clearContents();
  const sRange = sumSh.getRange(1, 1, tableRows.length, 5);
  sRange.setNumberFormat('@');
  sRange.setValues(tableRows);
  try {
    sumSh.getRange(1, 1, 1, 5).setFontWeight('bold').setBackground('#0f172a').setFontColor('#ffffff');
    sumSh.setFrozenRows(1);
  } catch (e) {}

  writeTransactionsSheet_(ss, stateObj);

  return jsonOut_({
    ok: true,
    updated_at: nowIso,
    disputes: readDisputes_(ss, null),
    confirmations: readConfirmations_(ss, null),
    deposits: readDeposits_(ss, null),
    pass_changes: passChanges
  });
}

function handleClientLogin_(ss, req) {
  const uname = String(req.p_username || '').trim().toLowerCase();
  const passHash = String(req.p_pass_hash || '').trim();
  if (!uname || !passHash) {
    return jsonOut_({ ok: false, error: 'INVALID_CREDENTIALS' });
  }

  const verified = verifyClientPortal_(ss, uname, passHash);
  if (!verified) {
    return jsonOut_({ ok: false, error: 'INVALID_CREDENTIALS' });
  }
  const payload = verified.payload;
  const cpId = payload.cp && payload.cp.id ? String(payload.cp.id) : '';

  return jsonOut_({
    ok: true,
    shop_title: payload.shop_title || 'دفتر صرافی هوشمند',
    currencies: payload.currencies || [],
    cp: payload.cp || {},
    transactions: payload.transactions || [],
    disputes: readDisputes_(ss, cpId),
    confirmations: readConfirmations_(ss, cpId),
    deposits: readDeposits_(ss, cpId),
    client_notes: readClientNotes_(ss, cpId),
    updated_at: verified.updatedAt
  });
}

function handleClientSubmitDispute_(ss, req) {
  const uname = String(req.p_username || '').trim().toLowerCase();
  const passHash = String(req.p_pass_hash || '').trim();
  const verified = verifyClientPortal_(ss, uname, passHash);
  if (!verified) return jsonOut_({ ok: false, error: 'INVALID_CREDENTIALS' });

  const msg = String(req.p_message || '').trim();
  if (!msg) return jsonOut_({ ok: false, error: 'متن مغایرت خالی است.' });

  const sh = ensureDisputesSheet_(ss);
  const dspId = 'DSP-' + Date.now() + '-' + Math.floor(Math.random() * 900 + 100);
  const dispute = {
    id: dspId,
    cpId: String(cp.id || ''),
    cpName: String(cp.name || ''),
    txId: String(req.p_tx_id || ''),
    txDate: String(req.p_tx_date || ''),
    txSummary: String(req.p_tx_summary || ''),
    reason: String(req.p_reason || 'سایر موارد'),
    message: msg.slice(0, 1000),
    status: 'open',
    adminReply: '',
    createdAt: String(req.p_created_at || new Date().toISOString()),
    resolvedAt: ''
  };

  const rowIdx = sh.getLastRow() + 1;
  sh.getRange(rowIdx, 1, 1, 12).setNumberFormat('@').setValues([[
    dispute.id, dispute.cpId, dispute.cpName, dispute.txId,
    dispute.txDate, dispute.txSummary, dispute.reason, dispute.message,
    dispute.status, dispute.adminReply, dispute.createdAt, dispute.resolvedAt
  ]]);

  return jsonOut_({ ok: true, dispute: dispute });
}

function handleAdminResolveDispute_(ss, req) {
  const adminHash = String(req.p_admin_hash || '').trim();

  const dspId = String(req.p_dispute_id || '').trim();
  const newStatus = String(req.p_status || 'resolved').trim();
  const reply = String(req.p_admin_reply || '').trim();
  const resolvedAt = String(req.p_resolved_at || '');

  const sh = ss.getSheetByName(SHEET_DISPUTES);
  if (!sh || sh.getLastRow() < 2) return jsonOut_({ ok: true, updated: false });
  const rows = sh.getRange(2, 1, sh.getLastRow() - 1, 12).getValues();
  for (let i = 0; i < rows.length; i++) {
    if (String(rows[i][0]) === dspId) {
      sh.getRange(i + 2, 9, 1, 4).setNumberFormat('@').setValues([[newStatus, reply, String(rows[i][10] || ''), resolvedAt]]);
      return jsonOut_({ ok: true, updated: true });

  return jsonOut_({ ok: true, updated: false });
}

function handleClientChangePassword_(ss, req) {
  const uname = String(req.p_username || '').trim().toLowerCase();
  const curHash = String(req.p_current_pass_hash || '').trim();
  const newHash = String(req.p_new_pass_hash || '').trim();

  const verified = verifyClientPortal_(ss, uname, curHash);
  if (!verified) return jsonOut_({ ok: false, error: 'INVALID_CURRENT_PASSWORD' });

  const portalSh = ss.getSheetByName(SHEET_PORTALS);
  const cpId = (verified.payload && verified.payload.cp && verified.payload.cp.id) ? String(verified.payload.cp.id) : '';
  const nowMs = Date.now();
  const changedAt = String(req.p_changed_at || new Date().toISOString());

  for (let i = 0; i < verified.rowNums.length; i++) {
    portalSh.getRange(verified.rowNums[i], 3).setNumberFormat('@').setValue(newHash);
  }
  upsertPassChange_(ss, uname, cpId, newHash, nowMs, changedAt);

  return jsonOut_({ ok: true, updated_at_ms: nowMs });
}

function handleClientSaveNote_(ss, req) {

  const passHash = String(req.p_pass_hash || '').trim();
  const verified = verifyClientPortal_(ss, uname, passHash);
  if (!verified) return jsonOut_({ ok: false, error: 'INVALID_CREDENTIALS' });

  const cp = verified.payload.cp || {};

  const txId = String(req.p_tx_id || '').trim();
  if (!cpId || !txId) return jsonOut_({ ok: false, error: 'شناسه تراکنش نامعتبر است.' });

  const noteText = String(req.p_note || '').trim().slice(0, 1000);
  const updatedAt = String(req.p_updated_at || new Date().toISOString());
  const sh = getOrCreateSheet_(ss, SHEET_CLIENT_NOTES, true);
  if (sh.getLastRow() === 0) {
    sh.getRange(1, 1, 1, 4).setNumberFormat('@').setValues([['cp_id', 'tx_id', 'note', 'updated_at']]);
  }
  if (sh.getLastRow() >= 2) {
    const rows = sh.getRange(2, 1, sh.getLastRow() - 1, 4).getValues();
    for (let i = 0; i < rows.length; i++) {
      if (String(rows[i][0]) === cpId && String(rows[i][1]) === txId) {
        if (!noteText) {
          sh.deleteRow(i + 2);
        } else {
          sh.getRange(i + 2, 1, 1, 4).setNumberFormat('@').setValues([[cpId, txId, noteText, updatedAt]]);
        }
        return jsonOut_({ ok: true, tx_id: txId, note: noteText });
      }
    }
  }
  if (noteText) {
    sh.getRange(sh.getLastRow() + 1, 1, 1, 4).setNumberFormat('@').setValues([[cpId, txId, noteText, updatedAt]]);
  }
  return jsonOut_({ ok: true, tx_id: txId, note: noteText });
}`;

const Cloud = {
  normalizeUrl(raw) {
    let u = String(raw || '').trim();
    if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  },
  isValidScriptUrl(raw) {
    const u = this.normalizeUrl(raw);
    return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/i.test(u);
  },
  encodeConfigToken(url) {
    try {
      const clean = this.normalizeUrl(url);
      const b64 = btoa(unescape(encodeURIComponent(clean)));
      return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    } catch (e) {
      return '';
    }
  },
  decodeConfigToken(token) {
    try {
      if (!token) return null;
      let b64 = String(token).replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const decoded = decodeURIComponent(escape(atob(b64)));
      if (decoded && decoded.startsWith('https://script.google.com/')) {
        return { url: this.normalizeUrl(decoded) };
      }
      const parsed = JSON.parse(decoded);
      if (parsed && typeof parsed.u === 'string' && parsed.u.startsWith('https://script.google.com/')) {
        return { url: this.normalizeUrl(parsed.u) };
      }
      return null;
    } catch (e) {
      return null;
    }
  },
  getAdminConfig() {
    let cfg = { url: '', adminHash: '', lastSyncedAt: 0, lastCloudUpdatedAt: '', pendingPush: false };
    try {
      const raw = localStorage.getItem(CLOUD_CFG_KEY);
      if (raw) cfg = Object.assign(cfg, JSON.parse(raw));
    } catch (e) {}
    if (!cfg.url && EMBEDDED_GSHEETS_URL) cfg.url = this.normalizeUrl(EMBEDDED_GSHEETS_URL);
    return cfg;
  },
  saveAdminConfig(cfg) {
    try {
      localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cfg));
    } catch (e) {}
  },
  clearAdminConfig() {
    try {
      localStorage.removeItem(CLOUD_CFG_KEY);
    } catch (e) {}
  },
  isAdminConnected() {
    const c = this.getAdminConfig();
    return Boolean(c.url && c.adminHash);
  },
  capturePortalTokenFromUrl() {
    try {
      const params = new URLSearchParams(window.location.search);
      const gs = params.get('gs');
      if (gs) {
        const dec = this.decodeConfigToken(gs);
        if (dec && dec.url) {
          localStorage.setItem(PORTAL_CLOUD_KEY, JSON.stringify(dec));
          return dec;
        }
      }
    } catch (e) {}
    return null;
  },
  getPortalEndpoint() {
    const fromUrl = this.capturePortalTokenFromUrl();
    if (fromUrl) return fromUrl;
    if (EMBEDDED_GSHEETS_URL) {
      return { url: this.normalizeUrl(EMBEDDED_GSHEETS_URL) };
    }
    const adminCfg = this.getAdminConfig();
    if (adminCfg.url) {
      return { url: adminCfg.url };
    }
    try {
      const raw = localStorage.getItem(PORTAL_CLOUD_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.url) return parsed;
      }
    } catch (e) {}
    return null;
  },
  async call(url, action, payload) {
    const cleanUrl = this.normalizeUrl(url);
    if (!cleanUrl) return { ok: false, networkError: false, error: 'لینک گوگل شیت (Web App URL) وارد نشده است.' };
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 25000);
    try {
      const res = await fetch(cleanUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action }, payload || {})),
        redirect: 'follow',
        signal: controller.signal
      });
      clearTimeout(timer);
      const txt = await res.text();
      if (txt && txt.trim().startsWith('<')) {
        return {
          ok: false,
          networkError: false,
          error: 'دسترسی Web App روی Anyone تنظیم نشده است! در Apps Script هنگام Deploy گزینه Who has access را روی Anyone بگذارید.'
        };
      }
      let data = null;
      try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
      if (!res.ok || !data) {
        const msg = (data && data.error) || `HTTP ${res.status}`;
        return { ok: false, networkError: false, status: res.status, error: msg };
      }
      return { ok: true, data };
    } catch (err) {
      clearTimeout(timer);
      return {
        ok: false,
        networkError: true,
        error: err && err.name === 'AbortError' ? 'زمان پاسخ سرور گوگل تمام شد (Timeout).' : 'اتصال به سرور گوگل برقرار نشد (اینترنت یا فیلترشکن را بررسی کنید).'
      };
    }
  }
};

migrateLegacyCurrencyCodes(obj) {
if (!obj || typeof obj !== 'object') return false;
let changed = false;
const fixCode = (c) => (c === 'USD_W' ? 'USD_H' : c);
const fixTx = (tx) => {
if (!tx || typeof tx !== 'object') return;
if (tx.currency1 === 'USD_W') { tx.currency1 = 'USD_H'; changed = true; }
if (tx.currency2 === 'USD_W') { tx.currency2 = 'USD_H'; changed = true; }
if (tx.feeCurrency === 'USD_W') { tx.feeCurrency = 'USD_H'; changed = true; }
if (Array.isArray(tx.effects)) {
for (const ef of tx.effects) {
if (ef && ef.currency === 'USD_W') { ef.currency = 'USD_H'; changed = true; }
}
}
if (tx.profitMeta && typeof tx.profitMeta === 'object') {
if (tx.profitMeta.currency === 'USD_W') { tx.profitMeta.currency = 'USD_H'; changed = true; }
if (tx.profitMeta.partnerCurrency === 'USD_W') { tx.profitMeta.partnerCurrency = 'USD_H'; changed = true; }
}
};
if (Array.isArray(obj.currencies)) {
const hasH = obj.currencies.some(c => c && c.code === 'USD_H');
const nextCurs = [];
for (const c of obj.currencies) {
if (!c) continue;
if (c.code === 'USD_W') {
changed = true;
if (!hasH) {
c.code = 'USD_H';
nextCurs.push(c);
}
} else {
nextCurs.push(c);
}
}
obj.currencies = nextCurs;
}
if (Array.isArray(obj.transactions)) {
for (const tx of obj.transactions) fixTx(tx);
}
if (Array.isArray(obj.deposits)) {
for (const d of obj.deposits) {
if (d && d.currency === 'USD_W') { d.currency = 'USD_H'; changed = true; }
}
}
if (obj.settings && obj.settings.baseCurrency === 'USD_W') {
obj.settings.baseCurrency = 'USD_H';
changed = true;
}
const fixRateMap = (mapObj) => {
if (!mapObj || typeof mapObj !== 'object') return;
for (const k of Object.keys(mapObj)) {
if (k.includes('USD_W')) {
const nk = k.replace(/USD_W/g, 'USD_H');
if (!mapObj[nk]) mapObj[nk] = mapObj[k];
delete mapObj[k];
changed = true;
}
}
};
fixRateMap(obj.lastRates);
fixRateMap(obj.marketRates);
if (Array.isArray(obj.logs)) {
const fixSnap = (s) => {
if (!s) return;
if (Array.isArray(s)) s.forEach(fixTx);
else fixTx(s);
};
for (const l of obj.logs) {
if (!l) continue;
fixSnap(l.snapshot);
fixSnap(l.beforeSnapshot);
}
}
return changed;
},
loadState() {
try {
const raw = localStorage.getItem(STORAGE_KEY);
if (raw) {
const parsed = JSON.parse(raw);
const def = createDefaultState();
this.state = Object.assign(def, parsed);
this.state.settings = Object.assign(def.settings, parsed.settings || {});
this.state.seq = Object.assign(def.seq, parsed.seq || {});
this.state.lastRates = Object.assign({}, parsed.lastRates || {});
this.state.marketRates = Object.assign({}, parsed.marketRates || {});
if (!Array.isArray(this.state.currencies) || !this.state.currencies.length) {
this.state.currencies = JSON.parse(JSON.stringify(DEFAULT_CURRENCIES));
}
if (!Array.isArray(this.state.disputes)) this.state.disputes = [];
if (!Array.isArray(this.state.confirmations)) this.state.confirmations = [];
if (!Array.isArray(this.state.deposits)) this.state.deposits = [];
if (this.migrateLegacyCurrencyCodes(this.state)) {
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); } catch (e2) {}
}
}
} catch (e) {
console.error('Load state failed:', e);
}
},
saveState(countAsDataChange = false) {
if (countAsDataChange) {
this.state.settings.changesSinceBackup = (this.state.settings.changesSinceBackup || 0) + 1;
}
const writeToStorage = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
try {
writeToStorage();
} catch (e) {
try {
if (Array.isArray(this.state.logs) && this.state.logs.length > 120) {
const recent = this.state.logs.slice(0, 120);
const olderDeletes = this.state.logs.slice(120).filter(l => l.action === 'delete' && !l.restored).slice(0, 40);
this.state.logs = recent.concat(olderDeletes);
writeToStorage();
this.toast('فضای حافظه فشرده‌سازی شد و اطلاعات ذخیره گردید.');
} else {
throw e;
}
} catch (e2) {
this.toast('خطا در ذخیره حافظه مرورگر! لطفاً فوراً پشتیبان JSON بگیرید.', true);
return false;
}
}
if (Cloud.isAdminConnected() && this.session.role === 'admin') {
if (countAsDataChange) {
this.scheduleCloudPush();
} else {
this.scheduleCloudPush();
}
} else {
this.setSyncPillState('local', 'ذخیره شد ✓');
clearTimeout(this._saveTimer);
this._saveTimer = setTimeout(() => {
this.refreshSyncPillIdle();
}, 1600);
}
return true;
},
shouldShowBackupBanner() {
const s = this.state.settings || {};
const now = Date.now();
if (s.backupSnoozeUntil && now < s.backupSnoozeUntil) return null;
const activeTxCount = this.state.transactions.filter(t => !t.deleted).length;
const activeCpCount = this.state.counterparties.filter(c => !c.deleted).length;
if (activeTxCount === 0 && activeCpCount === 0) return null;
const changes = s.changesSinceBackup || 0;
const changeLimit = s.backupReminderChanges || 10;
const hoursLimit = s.backupReminderHours || 48;
if (changes >= changeLimit) {
return `${changes} تغییر جدید از آخرین پشتیبان‌گیری ثبت شده است. برای جلوگیری از از دست رفتن اطلاعات، فایل پشتیبان بگیرید.`;
}
if (s.lastBackupAt > 0) {
const diffHours = (now - s.lastBackupAt) / (1000 * 60 * 60);
if (diffHours >= hoursLimit && changes > 0) {
return `بیش از ${Math.floor(diffHours)} ساعت از آخرین پشتیبان‌گیری گذشته و ${changes} تغییر جدید دارید.`;
}
} else if (activeTxCount >= 5) {
return `تاکنون فایل پشتیبان دانلود نکرده‌اید (${activeTxCount} تراکنش ثبت شده). همین الان یک نسخه پشتیبان ذخیره کنید.`;
}
return null;
},

getDisputesForTx(tx, cpId) {

mergeRemoteDisputes(remoteList) {
if (!Array.isArray(remoteList) || !remoteList.length) return false;
if (!Array.isArray(this.state.disputes)) this.state.disputes = [];
if (!Array.isArray(this.state.confirmations)) this.state.confirmations = [];
if (!Array.isArray(this.state.deposits)) this.state.deposits = [];
const byId = {};
this.state.disputes.forEach(d => { if (d && d.id) byId[d.id] = d; });
let changed = false;
for (const rd of remoteList) {
if (!rd || !rd.id) continue;
const existing = byId[rd.id];
if (!existing) {
this.state.disputes.unshift(rd);
byId[rd.id] = rd;
changed = true;
} else {
if (existing.status !== rd.status || existing.adminReply !== rd.adminReply || existing.resolvedAt !== rd.resolvedAt) {
existing.status = rd.status;
existing.adminReply = rd.adminReply;
existing.resolvedAt = rd.resolvedAt;
changed = true;
}
}
}
if (changed) {

},

parseConfDateAndTs(conf) {
if (!conf) return { date: Jalali.todayStr(), dateKey: Jalali.toSortKey(Jalali.todayStr()), ts: Date.now() };
const rawAt = String(conf.confirmedAt || '').trim();
const firstPart = rawAt.split(/[\s-]+/)[0] || '';
const normDate = Jalali.normalizeDate(firstPart) || Jalali.todayStr();
let ts = 0;
const m = /^CNF-(\d+)/.exec(String(conf.id || ''));
if (m) ts = parseInt(m[1], 10) || 0;
return { date: normDate, dateKey: Jalali.toSortKey(normDate), ts };
},
ensureConfirmationCheckpointTx(conf) {
if (!conf || !conf.id || !conf.cpId) return false;
const exists = this.state.transactions.some(t => t && t.sourceConfirmationId === conf.id);
if (exists) return false;
const cp = this.state.counterparties.find(c => c.id === conf.cpId && !c.deleted);
if (!cp) return false;
const info = this.parseConfDateAndTs(conf);
const tx = {
id: this.nextCpTxId(conf.cpId),
cpId: conf.cpId,
type: 'settlement',
confirmedBy: 'client',
sourceConfirmationId: conf.id,
date: info.date,
createdAt: info.ts || Date.now(),
effects: [],
summary: `تأیید مانده توسط کاربر در تاریخ ${info.date}`,
note: conf.note || '',
deleted: false
};
this.state.transactions.push(tx);
return true;
},
mergeRemoteConfirmations(remoteList) {
if (!Array.isArray(remoteList) || !remoteList.length) return false;
if (!Array.isArray(this.state.confirmations)) this.state.confirmations = [];
const seen = new Set(this.state.confirmations.map(c => c && c.id));
let changed = false;
// Process oldest first so sequential IDs & order stay chronological
const ordered = [...remoteList].reverse();
for (const rc of ordered) {
if (!rc || !rc.id) continue;
if (!seen.has(rc.id)) {
this.state.confirmations.unshift(rc);
seen.add(rc.id);
changed = true;
}
if (this.ensureConfirmationCheckpointTx(rc)) {
changed = true;
}
}
if (changed) {
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); } catch (e) {}
}
return changed;
},
mergeRemoteDeposits(remoteList) {
if (!Array.isArray(remoteList) || !remoteList.length) return false;
if (!Array.isArray(this.state.deposits)) this.state.deposits = [];
const byId = {};
this.state.deposits.forEach(d => { if (d && d.id) byId[d.id] = d; });
let changed = false;
for (const rd of remoteList) {
if (!rd || !rd.id) continue;
const ex = byId[rd.id];
if (!ex) {
this.state.deposits.unshift(rd);
byId[rd.id] = rd;
changed = true;
} else {
if (ex.status !== rd.status || ex.adminReply !== rd.adminReply || ex.approvedTxId !== rd.approvedTxId || ex.reviewedAt !== rd.reviewedAt) {
ex.status = rd.status;
ex.adminReply = rd.adminReply;
ex.approvedTxId = rd.approvedTxId;
ex.reviewedAt = rd.reviewedAt;
changed = true;
}
}
}
if (changed) {
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); } catch (e) {}
}
return changed;
},
mergeRemotePassChanges(remoteList) {
if (!Array.isArray(remoteList) || !remoteList.length) return false;
let changed = false;
for (const ch of remoteList) {
if (!ch || !ch.cpId || !ch.passHash) continue;
const cp = this.state.counterparties.find(c => c.id === ch.cpId && !c.deleted && c.portal);
if (!cp) continue;
const localMs = Number(cp.portal.updatedAt || 0);
if (Number(ch.updatedAtMs || 0) > localMs && cp.portal.passHash !== ch.passHash) {
cp.portal.passHash = ch.passHash;
cp.portal.updatedAt = Number(ch.updatedAtMs);
changed = true;
}
}
if (changed) {
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); } catch (e) {}
}
return changed;
},

pill.classList.remove('syncing', 'offline', 'error');
if (mode && mode !== 'local' && mode !== 'synced') pill.classList.add(mode);
txt.textContent = label;
},
refreshSyncPillIdle() {
if (!Cloud.isAdminConnected()) {
this.setSyncPillState('local', 'ذخیره محلی');
return;
}
const cfg = Cloud.getAdminConfig();
if (cfg.pendingPush) {
this.setSyncPillState('offline', 'در صف ارسال');
} else {
this.setSyncPillState('synced', 'همگام با گوگل شیت ✓');
}
},
handleSyncPillClick() {
if (this.isClientMode()) return;
if (Cloud.isAdminConnected()) {
this.manualCloudSync();
} else {
this.switchTab('settings');
this.toast('برای ذخیره دائمی و ورود کاربران، بخش گوگل شیت را تنظیم کنید.');
}
},
buildSanitizedPortals() {
const shopTitle = this.state.settings.shopTitle || 'دفتر صرافی هوشمند';
const activeCps = this.state.counterparties.filter(c =>
!c.deleted && c.portal && c.portal.enabled && c.portal.username && c.portal.passHash
);
return activeCps.map(cp => {
const txs = this.state.transactions
.filter(t => t.cpId === cp.id && !t.deleted)
.map(t => {
const pubType = this.getTxPublicType(t);
const pubSide = this.getTxPublicSide(t);
return {
id: this.getTxPublicId(t),
cpId: t.cpId,
type: pubType,
side: pubSide,
op: t.op,
date: t.date,
createdAt: t.createdAt,
currency1: t.currency1,
amount1: t.amount1,
currency2: pubType === 'deal' ? t.currency2 : undefined,
amount2: pubType === 'deal' ? t.amount2 : undefined,
rate: pubType === 'deal' ? t.rate : undefined,
fee: t.fee,
feeCurrency: t.feeCurrency,
effects: Array.isArray(t.effects) ? t.effects : [],
summary: this.getTxDisplaySummary(t, true),
refCode: t.refCode || '',
note: t.note || '',
roundingNote: t.roundingNote || '',
confirmedBy: t.confirmedBy || '',
sourceConfirmationId: t.sourceConfirmationId || ''
};
});
return {
cp_id: cp.id,
username: Sec.normalizeUsername(cp.portal.username),
pass_hash: cp.portal.passHash,
updated_at_ms: Number(cp.portal.updatedAt || 0),
enabled: true,
shop_title: shopTitle,
currencies: this.state.currencies,
cp_profile: {
id: cp.id,
name: cp.name,
phone: cp.phone || ''
},
transactions: txs
};
});
},
buildReadableSummaryRows() {
const nowStr = Jalali.nowDateTimeStr();
const activeCps = this.state.counterparties.filter(c => !c.deleted);
return activeCps.map(cp => {
const bals = this.getCounterpartyBalances(cp.id);
const balStr = bals.length
? bals.map(b => {
const cur = this.getCurrency(b.code);
return `${cur.name}: ${Num.formatSigned(b.micro)} (${this.getStatusText(b.micro)})`;
}).join(' | ')
: 'تسویه (صفر)';
const portalStr = (cp.portal && cp.portal.enabled) ? `فعال (${cp.portal.username})` : 'غیرفعال';
return {
name: cp.name,
phone: cp.phone || '—',
balance: balStr,
portal: portalStr,
syncedAt: nowStr
};
});
},
scheduleCloudPush() {
if (this.isClientMode() || !Cloud.isAdminConnected()) return;
const cfg = Cloud.getAdminConfig();
cfg.pendingPush = true;
Cloud.saveAdminConfig(cfg);
this.setSyncPillState('syncing', 'در حال همگام‌سازی...');
clearTimeout(this._cloudPushTimer);
this._cloudPushTimer = setTimeout(() => {
this.cloudPushAdmin(true);
}, 1200);
},
async cloudPushAdmin(silent = false) {
if (!this.requireAdmin() || !Cloud.isAdminConnected()) return false;
const cfg = Cloud.getAdminConfig();
this.setSyncPillState('syncing', 'ارسال به گوگل شیت...');
const portals = this.buildSanitizedPortals();
const summaryRows = this.buildReadableSummaryRows();
const res = await Cloud.call(cfg.url, 'admin_sync_push', {
p_admin_hash: cfg.adminHash,
p_state: this.state,
p_portals: portals,
p_summary_rows: summaryRows
});
if (res.ok && res.data && res.data.ok) {
let hadRemoteUpdates = false;
if (Array.isArray(res.data.disputes) && this.mergeRemoteDisputes(res.data.disputes)) hadRemoteUpdates = true;
if (Array.isArray(res.data.confirmations) && this.mergeRemoteConfirmations(res.data.confirmations)) hadRemoteUpdates = true;
if (Array.isArray(res.data.deposits) && this.mergeRemoteDeposits(res.data.deposits)) hadRemoteUpdates = true;
if (Array.isArray(res.data.pass_changes)) this.mergeRemotePassChanges(res.data.pass_changes);
if (hadRemoteUpdates) this.render();
cfg.pendingPush = false;
cfg.lastSyncedAt = Date.now();
cfg.lastCloudUpdatedAt = res.data.updated_at || '';
Cloud.saveAdminConfig(cfg);
this.setSyncPillState('synced', 'همگام با گوگل شیت ✓');
if (!silent) this.toast('اطلاعات و پورتال کاربران با موفقیت در گوگل شیت ذخیره شد ✓');
if (this.ui.activeTab === 'settings' && !this.ui.selectedCpId) this.renderSettings();
return true;
}
if (res.networkError) {
cfg.pendingPush = true;
Cloud.saveAdminConfig(cfg);
this.setSyncPillState('offline', 'آفلاین (در صف)');
if (!silent) this.toast('اتصال به گوگل برقرار نشد؛ تغییرات روی گوشی ذخیره شد و پس از اتصال ارسال می‌شود.', true);
return false;
}
this.setSyncPillState('error', 'خطای همگام‌سازی');
if (!silent) {
const errTxt = (res.data && res.data.error === 'INVALID_ADMIN_KEY')
? 'رمز ارشد همگام‌سازی اشتباه است.'
: ((res.data && res.data.error) || res.error || 'خطا در همگام‌سازی با گوگل شیت');
this.toast(errTxt, true);
}
return false;
},
async cloudPullAdmin(silent = false, forceReplace = false) {
if (!this.requireAdmin() || !Cloud.isAdminConnected()) return false;
const cfg = Cloud.getAdminConfig();
this.setSyncPillState('syncing', 'دریافت از گوگل شیت...');
const res = await Cloud.call(cfg.url, 'admin_sync_pull', {
p_admin_hash: cfg.adminHash
});
if (res.ok && res.data && res.data.ok) {
if (res.data.empty) {
return await this.cloudPushAdmin(silent);
}
const remoteUpdated = res.data.updated_at || '';
const remoteState = res.data.state;
if (!remoteState || !Array.isArray(remoteState.counterparties) || !Array.isArray(remoteState.transactions)) {
this.setSyncPillState('error', 'خطای ساختار داده');
if (!silent) this.toast('داده دریافت‌شده از گوگل شیت معتبر نیست.', true);
return false;
}
const isNewer = !cfg.lastCloudUpdatedAt || (remoteUpdated && remoteUpdated !== cfg.lastCloudUpdatedAt);
if (forceReplace || isNewer) {
const def = createDefaultState();
this.state = Object.assign(def, remoteState);
this.state.settings = Object.assign(def.settings, remoteState.settings || {});
this.state.seq = Object.assign(def.seq, remoteState.seq || {});
this.state.lastRates = Object.assign({}, remoteState.lastRates || {});
this.state.marketRates = Object.assign({}, remoteState.marketRates || {});
if (!Array.isArray(this.state.currencies) || !this.state.currencies.length) {
this.state.currencies = JSON.parse(JSON.stringify(DEFAULT_CURRENCIES));
}
if (!Array.isArray(this.state.disputes)) this.state.disputes = [];
if (!Array.isArray(this.state.confirmations)) this.state.confirmations = [];
if (!Array.isArray(this.state.deposits)) this.state.deposits = [];
const migratedFromPull = this.migrateLegacyCurrencyCodes(this.state);
localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
this.applyThemeClass();
if (migratedFromPull) this.scheduleCloudPush();
}
if (Array.isArray(res.data.disputes)) this.mergeRemoteDisputes(res.data.disputes);
if (Array.isArray(res.data.confirmations)) this.mergeRemoteConfirmations(res.data.confirmations);
if (Array.isArray(res.data.deposits)) this.mergeRemoteDeposits(res.data.deposits);
if (Array.isArray(res.data.pass_changes)) this.mergeRemotePassChanges(res.data.pass_changes);
cfg.pendingPush = false;
cfg.lastSyncedAt = Date.now();
cfg.lastCloudUpdatedAt = remoteUpdated;
Cloud.saveAdminConfig(cfg);
this.setSyncPillState('synced', 'همگام با گوگل شیت ✓');
if (!silent) this.toast('آخرین اطلاعات از گوگل شیت دریافت و همگام شد ✓');
this.render();
return true;
}
if (res.networkError) {
this.setSyncPillState('offline', 'آفلاین');
if (!silent) this.toast('اتصال به اینترنت یا سرور گوگل برقرار نشد.', true);
return false;
}
this.setSyncPillState('error', 'خطای همگام‌سازی');
if (!silent) {
const errTxt = (res.data && res.data.error === 'INVALID_ADMIN_KEY')
? 'رمز ارشد همگام‌سازی با رمز ثبت‌شده در گوگل شیت مطابقت ندارد.'
: ((res.data && res.data.error) || res.error || 'خطا در دریافت از گوگل شیت');
this.toast(errTxt, true);
}
return false;
},
async cloudSyncOnStartup() {
const cfg = Cloud.getAdminConfig();
if (cfg.pendingPush) {
await this.cloudPushAdmin(true);
} else {
await this.cloudPullAdmin(true, false);
}
},
async manualCloudSync() {
if (!this.requireAdmin() || !Cloud.isAdminConnected()) return;

},
async connectGoogleSheets() {
if (!this.requireAdmin()) return;
const urlEl = document.getElementById('gs-url');
const passEl = document.getElementById('gs-pass');
const url = Cloud.normalizeUrl(urlEl ? urlEl.value : '');
const rawPass = Num.toEnDigits(passEl ? passEl.value : '').trim();
const prevCfg = Cloud.getAdminConfig();

if (!url) {
this.toast('لینک Web App گوگل شیت را وارد کنید.', true);
return;
}
if (url.includes('docs.google.com/spreadsheets')) {
this.toast('این لینک خود فایل شیت است! باید لینک Web App (شروع‌شده با script.google.com و پایان /exec) را وارد کنید.', true);
return;
}
if (url.endsWith('/dev')) {
this.toast('لینک آزمایشی (/dev) معتبر نیست؛ لینک نهایی که با /exec تمام می‌شود را وارد کنید.', true);
return;
}
if (!Cloud.isValidScriptUrl(url)) {
this.toast('فرمت لینک معتبر نیست (باید شبیه https://script.google.com/macros/s/.../exec باشد).', true);
return;
}
const adminHash = rawPass ? Sec.hashSecret(rawPass, 'cloud_admin') : prevCfg.adminHash;
if (!adminHash) {
this.toast('یک رمز ارشد همگام‌سازی (حداقل ۶ کاراکتر) انتخاب کنید.', true);
return;
}
if (rawPass && rawPass.length < 6) {
this.toast('رمز ارشد همگام‌سازی باید حداقل ۶ کاراکتر باشد.', true);
return;
}

this.setSyncPillState('syncing', 'در حال تست اتصال...');
this.toast('در حال اتصال به گوگل شیت...');
const check = await Cloud.call(url, 'admin_sync_pull', { p_admin_hash: adminHash });
if (!check.ok) {
this.setSyncPillState('error', 'خطای اتصال');
this.toast(`خطای اتصال: ${check.error || 'اتصال برقرار نشد.'}`, true);
return;
}
if (check.data && check.data.error === 'INVALID_ADMIN_KEY') {
this.setSyncPillState('error', 'رمز اشتباه');
this.toast('رمز ارشد همگام‌سازی با رمز ثبت‌شده در این گوگل شیت مطابقت ندارد.', true);
return;
}
if (check.data && !check.data.ok) {
this.setSyncPillState('error', 'خطای سرور');
this.toast(check.data.error || 'پاسخ نامعتبر از سرور گوگل شیت.', true);
return;
}

const newCfg = {
url,
adminHash,
lastSyncedAt: Date.now(),
lastCloudUpdatedAt: (check.data && check.data.updated_at) || '',
pendingPush: false
};
Cloud.saveAdminConfig(newCfg);

if (check.data && check.data.empty) {
await this.cloudPushAdmin(false);
this.renderSettings();
return;
}

const hasLocalData = this.state.counterparties.length > 0 || this.state.transactions.length > 0;
if (!hasLocalData) {
await this.cloudPullAdmin(false, true);
this.renderSettings();
return;
}

const pullFromCloud = confirm(
'اتصال به گوگل شیت با موفقیت برقرار شد!\nدر این گوگل شیت اطلاعات قبلی وجود دارد.\n\n• برای دانلود اطلاعات گوگل شیت روی این گوشی، OK (تأیید) بزنید.\n• برای ارسال اطلاعات فعلی این گوشی به گوگل شیت، Cancel (لغو) بزنید.'
);
if (pullFromCloud) {
await this.cloudPullAdmin(false, true);
} else {
await this.cloudPushAdmin(false);
}
this.renderSettings();
},

submitDangerConfirm() {
if (!this.requireAdmin() || !this._dangerConfirm) return;
const cfg = this._dangerConfirm;
const errEl = document.getElementById('dng-auth-err');
const showErr = (msg) => {
if (errEl) {
errEl.textContent = msg;
errEl.classList.add('show');
}
this.toast(msg, true);
};
if (errEl) { errEl.textContent = ''; errEl.classList.remove('show'); }

if (cfg.requireAck) {
const ack = document.getElementById('dng-ack-chk');
if (!ack || !ack.checked) {
showErr('ابتدا تیک تأیید هشدار را بزنید.');
return;
}
}

const inp = document.getElementById('dng-auth-input');
const rawVal = inp ? inp.value.trim() : '';
if (!rawVal) {
showErr(cfg.authType === 'word' ? `لطفاً کلمه «${cfg.requiredWord}» را وارد کنید.` : 'لطفاً رمز مدیر را وارد کنید.');
return;
}

if (cfg.authType === 'pin') {
const h = Sec.hashSecret(Num.toEnDigits(rawVal), 'pin');
if (h !== this.state.settings.adminPinHash) {
showErr('رمز ورود مدیر (PIN) اشتباه است!');
if (inp) { inp.value = ''; inp.focus(); }
return;
}
} else if (cfg.authType === 'cloud') {
const cloudCfg = Cloud.getAdminConfig();
const h = Sec.hashSecret(Num.toEnDigits(rawVal), 'cloud_admin');
if (h !== cloudCfg.adminHash) {
showErr('رمز ارشد همگام‌سازی اشتباه است!');
if (inp) { inp.value = ''; inp.focus(); }
return;
}
} else {
const normInput = rawVal.replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/أ|إ|آ/g, 'ا').trim();
const normReq = cfg.requiredWord.replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/أ|إ|آ/g, 'ا').trim();
if (normInput !== normReq) {
showErr(`عبارت واردشده اشتباه است؛ دقیقاً کلمه «${cfg.requiredWord}» را بنویسید.`);
return;
}
}

const cb = cfg.onConfirm;
this._dangerConfirm = null;
this.closeModal();
if (typeof cb === 'function') cb();
},
