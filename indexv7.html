getCurrency(code) {
return this.getActiveCurrencies().find(c => c.code === code) || { code, name: code, symbol: code, exact: false };
},
ensureUniqueIdPrefix(basePrefix, excludeCpId = '') {
let base = Sec.normalizeIdPrefix(basePrefix) || 'acc';
const used = new Set(
this.state.counterparties
.filter(c => c && c.id !== excludeCpId && c.idPrefix)
.map(c => Sec.normalizeIdPrefix(c.idPrefix))
);
if (!used.has(base)) return base;
let n = 2;
while (used.has(`${base}${n}`)) n++;
return `${base}${n}`;
},
ensureCounterpartyIdConfig(cp) {
if (!cp) return { prefix: 'acc', nextSeq: 101 };
if (!cp.idPrefix) {
const fromPortal = (cp.portal && cp.portal.username) ? Sec.normalizeIdPrefix(cp.portal.username) : '';
const candidate = fromPortal || Sec.suggestIdPrefix(cp.name);
cp.idPrefix = this.ensureUniqueIdPrefix(candidate, cp.id);
}
if (!Number.isFinite(Number(cp.nextTxSeq)) || Number(cp.nextTxSeq) < 1) {
let maxFound = 0;
const re = new RegExp(`^${cp.idPrefix}[_-](\\d+)$`, 'i');
for (const t of this.state.transactions) {
if (t.cpId !== cp.id) continue;
const m1 = re.exec(String(t.id || ''));
if (m1) maxFound = Math.max(maxFound, parseInt(m1[1], 10));
const m2 = re.exec(String(t.publicId || ''));
if (m2) maxFound = Math.max(maxFound, parseInt(m2[1], 10));
}
cp.nextTxSeq = maxFound > 0 ? (maxFound + 1) : 101;
}
return { prefix: cp.idPrefix, nextSeq: Math.floor(Number(cp.nextTxSeq)) };
},
nextCpTxId(cpId) {
const cp = this.state.counterparties.find(c => c.id === cpId);
if (!cp) return this.nextId('transfer');
const cfg = this.ensureCounterpartyIdConfig(cp);
let seq = cfg.nextSeq;
const prefix = cfg.prefix;
const exists = (cand) => this.state.transactions.some(t => t.id === cand || t.publicId === cand);
let candidate = `${prefix}_${seq}`;
while (exists(candidate)) {
seq += 1;
candidate = `${prefix}_${seq}`;
}
cp.nextTxSeq = seq + 1;
return candidate;
},
nextId(type) {
if (type === 'deal') {
this.state.seq.deal = (this.state.seq.deal || 1000) + 1;
return `DEAL-${this.state.seq.deal}`;
}
if (type === 'opening') {
this.state.seq.opening = (this.state.seq.opening || 100) + 1;
return `OB-${this.state.seq.opening}`;
}
if (type === 'settlement') {
this.state.seq.settlement = (this.state.seq.settlement || 100) + 1;
return `STL-${this.state.seq.settlement}`;
}
if (type === 'offset') {
this.state.seq.offset = (this.state.seq.offset || 100) + 1;
return `OFS-${this.state.seq.offset}`;
}
if (type === 'share') {
this.state.seq.share = (this.state.seq.share || 100) + 1;
return `SHR-${this.state.seq.share}`;
}
this.state.seq.transfer = (this.state.seq.transfer || 1000) + 1;
return `TRF-${this.state.seq.transfer}`;
},
addLog(action, title, details, snapshot = null, entityType = 'tx', meta = {}) {
const clone = (obj) => obj ? JSON.parse(JSON.stringify(obj)) : null;
const snapClone = clone(snapshot);
const beforeClone = clone(meta && meta.beforeSnapshot ? meta.beforeSnapshot : null);
const cpSet = new Set();
const addIdsFrom = (obj) => {
if (!obj) return;
if (Array.isArray(obj)) {
obj.forEach(item => {
if (item && item.cpId) cpSet.add(item.cpId);
if (item && item.offsetPeerCpId) cpSet.add(item.offsetPeerCpId);
});
} else {
if (entityType === 'cp' && obj.id) cpSet.add(obj.id);
if (obj.cpId) cpSet.add(obj.cpId);
if (obj.offsetPeerCpId) cpSet.add(obj.offsetPeerCpId);
}
};
if (meta && Array.isArray(meta.cpIds)) {
meta.cpIds.forEach(id => { if (id) cpSet.add(id); });
}
addIdsFrom(snapClone);
addIdsFrom(beforeClone);
this.state.logs.unshift({
id: 'LOG-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
at: Jalali.nowDateTimeStr(),
action, // create | edit | delete | restore
title,
details,
entityType,
cpIds: Array.from(cpSet),
snapshot: snapClone,
beforeSnapshot: beforeClone,
editScope: (meta && meta.editScope) ? meta.editScope : '',
restored: false,
undone: false
});
if (this.state.logs.length > 500) this.state.logs.length = 500;
},
sortTransactions(txList, direction = 'desc') {
return [...txList].sort((a, b) => {
const ka = Jalali.toSortKey(a.date);
const kb = Jalali.toSortKey(b.date);
if (ka !== kb) {
return direction === 'desc' ? (kb - ka) : (ka - kb);
}
const typeRankA = a.type === 'opening' ? 0 : 1;
const typeRankB = b.type === 'opening' ? 0 : 1;
if (typeRankA !== typeRankB) {
return direction === 'desc' ? (typeRankB - typeRankA) : (typeRankA - typeRankB);
}
const ca = a.createdAt || 0;
const cb = b.createdAt || 0;
return direction === 'desc' ? (cb - ca) : (ca - cb);
});
},
orderBalanceMap(map, includeZeroCodes = null) {
const ordered = [];
const seen = new Set();
for (const cur of this.getActiveCurrencies()) {
seen.add(cur.code);
const val = map[cur.code] ?? 0n;
const forceInclude = includeZeroCodes && includeZeroCodes.has(cur.code);
if (val !== 0n || forceInclude) {
ordered.push({ code: cur.code, micro: val });
}
}
for (const code of Object.keys(map)) {
if (!seen.has(code)) {
const val = map[code] ?? 0n;
const forceInclude = includeZeroCodes && includeZeroCodes.has(code);
if (val !== 0n || forceInclude) {
ordered.push({ code, micro: val });
}
}
}
return ordered;
},
getCounterpartyBalances(cpId) {
const map = {}; // code -> BigInt micro
const txs = this.getActiveTransactions().filter(t => t.cpId === cpId && !t.deleted);
for (const tx of txs) {
if (!Array.isArray(tx.effects)) continue;
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
map[ef.currency] = (map[ef.currency] || 0n) + Dec.toMicro(ef.delta);
}
}
return this.orderBalanceMap(map);
},
findLatestConfirmationInfo(cpId, allAsc) {
let lastStlIdx = -1;
let stlDateKey = 0;
let stlTs = 0;
let stlTx = null;
for (let i = 0; i < allAsc.length; i++) {
if (allAsc[i].type === 'settlement') {
lastStlIdx = i;
stlTx = allAsc[i];
stlDateKey = Jalali.toSortKey(stlTx.date);
stlTs = Number(stlTx.createdAt || 0);
}
}
const latestConf = this.getLatestConfirmation(cpId);
let useVirtualConf = false;
let virtualCutoffIdx = -1;
let virtualDate = '';
if (latestConf) {
const alreadyMaterialized = allAsc.some(t => t.sourceConfirmationId === latestConf.id);
if (!alreadyMaterialized) {
const info = this.parseConfDateAndTs(latestConf);
const isNewer = (lastStlIdx === -1)
|| (info.dateKey > stlDateKey)
|| (info.dateKey === stlDateKey && info.ts >= stlTs);
if (isNewer) {
useVirtualConf = true;
virtualDate = info.date;
let idxFound = -1;
for (let i = 0; i < allAsc.length; i++) {
const tk = Jalali.toSortKey(allAsc[i].date);
const tc = Number(allAsc[i].createdAt || 0);
if (tk < info.dateKey || (tk === info.dateKey && (info.ts <= 0 || tc <= info.ts))) {
idxFound = i;
}
}
if (idxFound === -1 && Number(latestConf.txCount) > 0) {
idxFound = Math.min(allAsc.length - 1, Number(latestConf.txCount) - 1);
}
virtualCutoffIdx = idxFound;
}
}
}
if (useVirtualConf) {
return {
hasConfirmation: true,
cutoffIdx: virtualCutoffIdx,
date: virtualDate,
confirmedAt: latestConf.confirmedAt || virtualDate,
source: 'client',
tx: null,
conf: latestConf
};
}
if (lastStlIdx !== -1 && stlTx) {
return {
hasConfirmation: true,
cutoffIdx: lastStlIdx,
date: stlTx.date,
confirmedAt: stlTx.date,
source: stlTx.confirmedBy || 'admin',
tx: stlTx,
conf: null
};
}
return {
hasConfirmation: false,
cutoffIdx: -1,
date: '',
confirmedAt: '',
source: '',
tx: null,
conf: null
};
},
buildStatementSlice(cpId, sliceOpts = {}) {
const allAsc = this.sortTransactions(
this.getActiveTransactions().filter(t => t.cpId === cpId && !t.deleted),
'asc'
);
const runningMap = {};
const touchedRunningById = {};
const fullRunningById = {};
allAsc.forEach((tx) => {
const touchedSet = new Set();
if (Array.isArray(tx.effects)) {
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
runningMap[ef.currency] = (runningMap[ef.currency] || 0n) + Dec.toMicro(ef.delta);
touchedSet.add(ef.currency);
}
}
const touchedMap = {};
touchedSet.forEach(c => { touchedMap[c] = runningMap[c] ?? 0n; });
touchedRunningById[tx.id] = this.orderBalanceMap(touchedMap, touchedSet);
fullRunningById[tx.id] = this.orderBalanceMap(runningMap);
});
const currentBalances = this.orderBalanceMap(runningMap);
const confInfo = this.findLatestConfirmationInfo(cpId, allAsc);
const hasConfirmation = confInfo.hasConfirmation;
const realTxCount = allAsc.filter(t => t.type !== 'settlement').length;

let mode = sliceOpts.mode || 'all';
if (mode === 'since_settlement') mode = 'since_confirm';
if (mode === 'since_confirm' && !hasConfirmation) mode = 'all';

let beforePeriod = [];
let inPeriodAsc = allAsc;
let periodLabel = 'همه تراکنش‌ها (کل تاریخچه)';
let isFiltered = false;
let isFromConfirmation = false;

if (mode === 'since_confirm' && hasConfirmation) {
const cut = confInfo.cutoffIdx;
beforePeriod = cut >= 0 ? allAsc.slice(0, cut + 1) : [];
inPeriodAsc = cut >= 0 ? allAsc.slice(cut + 1) : allAsc;
periodLabel = `از آخرین تأیید مانده (${confInfo.confirmedAt || confInfo.date})`;
isFiltered = true;
isFromConfirmation = true;
} else if (mode === 'last_n') {
const n = Math.max(1, parseInt(sliceOpts.count, 10) || 10);
// Collect last N real (non-confirmation-marker) transactions
let collected = 0;
let startIdx = 0;
for (let i = allAsc.length - 1; i >= 0; i--) {
if (allAsc[i].type !== 'settlement') collected++;
if (collected >= n) {
startIdx = i;
break;
}
}
if (collected >= n && startIdx > 0) {
beforePeriod = allAsc.slice(0, startIdx);
inPeriodAsc = allAsc.slice(startIdx);
isFiltered = true;
periodLabel = `آخرین ${n} تراکنش`;
} else {
beforePeriod = [];
inPeriodAsc = allAsc;
isFiltered = false;
periodLabel = `آخرین ${n} تراکنش (همه ${realTxCount} مورد)`;
}
} else if (mode === 'today' || mode === '7d' || mode === '30d' || mode === 'custom' || mode === 'date_range') {
let fromStr = '';
let toStr = '';
if (mode === 'today') {
fromStr = Jalali.todayStr();
toStr = fromStr;
periodLabel = `امروز (${fromStr})`;
} else if (mode === '7d') {
fromStr = Jalali.daysAgoStr(6);
toStr = Jalali.todayStr();
periodLabel = `۷ روز اخیر (${fromStr} تا ${toStr})`;
} else if (mode === '30d') {
fromStr = Jalali.daysAgoStr(29);
toStr = Jalali.todayStr();
periodLabel = `۳۰ روز اخیر (${fromStr} تا ${toStr})`;
} else {
fromStr = Jalali.normalizeDate(sliceOpts.dateFrom) || '';
toStr = Jalali.normalizeDate(sliceOpts.dateTo) || '';
if (fromStr && toStr) periodLabel = `از ${fromStr} تا ${toStr}`;
else if (fromStr) periodLabel = `از تاریخ ${fromStr} به بعد`;
else if (toStr) periodLabel = `تا تاریخ ${toStr}`;
else periodLabel = 'همه تاریخ‌ها';
}
const fromKey = fromStr ? Jalali.toSortKey(fromStr) : 0;
const toKey = toStr ? Jalali.toSortKey(toStr) : 99999999;
if (fromKey > 0 || toKey < 99999999) {
isFiltered = true;
beforePeriod = allAsc.filter(t => Jalali.toSortKey(t.date) < fromKey);
inPeriodAsc = allAsc.filter(t => {
const k = Jalali.toSortKey(t.date);
return k >= fromKey && k <= toKey;
});
}
}

const bfMap = {};
for (const tx of beforePeriod) {
if (!Array.isArray(tx.effects)) continue;
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
bfMap[ef.currency] = (bfMap[ef.currency] || 0n) + Dec.toMicro(ef.delta);
}
}
const broughtForward = this.orderBalanceMap(bfMap);
const endMap = { ...bfMap };
for (const tx of inPeriodAsc) {
if (!Array.isArray(tx.effects)) continue;
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
endMap[ef.currency] = (endMap[ef.currency] || 0n) + Dec.toMicro(ef.delta);
}
}
const periodEndingBalances = this.orderBalanceMap(endMap);
const beforeConfirmAsc = (hasConfirmation && confInfo.cutoffIdx >= 0)
? allAsc.slice(0, confInfo.cutoffIdx + 1)
: [];
const afterConfirmAsc = (hasConfirmation && confInfo.cutoffIdx >= 0)
? allAsc.slice(confInfo.cutoffIdx + 1)
: allAsc;
const confBalMap = {};
for (const tx of beforeConfirmAsc) {
if (!Array.isArray(tx.effects)) continue;
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
confBalMap[ef.currency] = (confBalMap[ef.currency] || 0n) + Dec.toMicro(ef.delta);
}
}
const confirmedBalances = this.orderBalanceMap(confBalMap);
return {
allAsc,
realTxCount,
inPeriodAsc,
inPeriodDesc: [...inPeriodAsc].reverse(),
beforeConfirmAsc,
afterConfirmAsc,
confirmedBalances,
touchedRunningById,
fullRunningById,
currentBalances,
broughtForward,
periodEndingBalances,
hasConfirmation,
hasSettlement: hasConfirmation,
confirmInfo: confInfo,
lastSettlement: confInfo.tx,
isFiltered,
isFromConfirmation,
periodMode: mode,
periodLabel
};
},
buildCounterpartyStatement(cpId) {
return this.buildStatementSlice(cpId, {
mode: this.ui.periodMode || 'all',
dateFrom: this.ui.dateFrom || '',
dateTo: this.ui.dateTo || ''

getCounterpartyActivityMap() {
const map = {};
for (const tx of this.state.transactions) {
if (!tx || tx.deleted || !tx.cpId) continue;
const cur = map[tx.cpId] || { txCount: 0, lastCreatedAt: 0, lastDateKey: 0, lastDate: '' };
cur.txCount += 1;
const ct = Number(tx.createdAt) || 0;
const dk = Jalali.toSortKey(tx.date);
if (ct > cur.lastCreatedAt || (ct === cur.lastCreatedAt && dk >= cur.lastDateKey)) {
cur.lastCreatedAt = ct;
cur.lastDate = tx.date || cur.lastDate;
}
if (dk > cur.lastDateKey) {
cur.lastDateKey = dk;
if (!cur.lastDate) cur.lastDate = tx.date || '';
}
map[tx.cpId] = cur;
}
return map;
},
getSortedActiveCounterparties() {
const actMap = this.getCounterpartyActivityMap();
const activeCps = this.state.counterparties.filter(c => !c.deleted);
return activeCps.sort((a, b) => {
const actA = actMap[a.id];
const actB = actMap[b.id];
const scoreA = Math.max(actA ? actA.lastCreatedAt : 0, Number(a.createdAt) || 0);
const scoreB = Math.max(actB ? actB.lastCreatedAt : 0, Number(b.createdAt) || 0);
if (scoreB !== scoreA) return scoreB - scoreA;
const dkA = actA ? actA.lastDateKey : 0;
const dkB = actB ? actB.lastDateKey : 0;
if (dkB !== dkA) return dkB - dkA;
return (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0);
});
},
buildAccountsSearchOutput() {
const activeCps = this.getSortedActiveCounterparties();
const rawQ = (this.ui.searchQuery || '').trim();
const q = Num.toEnDigits(rawQ).toLowerCase();
const qOrig = rawQ.toLowerCase();
const filteredCps = !rawQ
? activeCps
: activeCps.filter(c =>
c.name.toLowerCase().includes(qOrig) ||
Num.toEnDigits(c.phone || '').toLowerCase().includes(q) ||
(c.note || '').toLowerCase().includes(qOrig)
);
let txMatchesHtml = '';
if (rawQ.length >= 2) {
const cpMap = {};
activeCps.forEach(c => { cpMap[c.id] = c; });
const matchedTxs = this.sortTransactions(
this.state.transactions.filter(t => {
if (t.deleted || !cpMap[t.cpId]) return false;
const ref = Num.toEnDigits(t.refCode || '').toLowerCase();
const tid = (t.id || '').toLowerCase();
const sum = (t.summary || '').toLowerCase();
const nt = (t.note || '').toLowerCase();
return ref.includes(q) || tid.includes(q) || sum.includes(qOrig) || nt.includes(qOrig);
}),
'desc'
).slice(0, 15);
if (matchedTxs.length) {
txMatchesHtml = `
<div style="margin-top:14px;">
<div style="font-size:12.5px; font-weight:800; color:#1e40af; margin-bottom:7px;">🧾 تراکنش‌ها و فیش‌های مرتبط (${matchedTxs.length}):</div>
${matchedTxs.map(t => {
const cp = cpMap[t.cpId];
const jumpKey = String(t.refCode || t.id || '').replace(/['"\\]/g, '');
return `
<div class="global-tx-match" onclick="app.openCounterparty('${cp.id}', '${escapeHtml(jumpKey)}')">

<div style="font-size:12px; color:var(--text-secondary);">${escapeHtml(t.summary)}</div>
</div>
`;
}).join('')}
</div>
`;
}
}
if (!filteredCps.length && txMatchesHtml) {

}
return this.buildAccountsListHtml(filteredCps) + txMatchesHtml;

getTxPublicId(tx) {
if (!tx) return '';
if (tx.publicId) return tx.publicId;
if (tx.type === 'offset') {
const num = String(tx.id || '').replace(/[^0-9]/g, '') || '100';
if (tx.offsetRole === 'partner') return `TRF-${num}`;
return tx.offsetMode === 'priced' ? `DEAL-${num}` : `TRF-${num}`;
}
if (tx.type === 'profit_share') {
const num = String(tx.id || '').replace(/[^0-9]/g, '') || '100';
return `TRF-${num}`;
}
return tx.id || '';
},
getTxPublicType(tx) {
if (!tx) return 'transfer';
if (tx.type === 'profit_share' || tx.offsetRole === 'partner' || tx.shareRole === 'partner') return 'profit_share';
if (tx.type === 'offset') {
return tx.offsetMode === 'priced' ? 'deal' : 'transfer';
}
return tx.type;
},
getTxPublicSide(tx) {
if (!tx) return undefined;
if (tx.type === 'offset') {
if (tx.offsetRole === 'partner') return 'receive';
if (tx.offsetMode === 'priced') return tx.offsetRole === 'from' ? 'buy' : 'sell';
return tx.offsetRole === 'from' ? 'receive' : 'pay';
}
return tx.side;
},
getTxDisplaySummary(tx, readOnly = false) {
if (!tx) return '';
if (readOnly) {
if (tx.clientSummary) return tx.clientSummary;
if (tx.type === 'profit_share' || tx.offsetRole === 'partner' || tx.shareRole === 'partner') {
const cur = this.getCurrency(tx.currency1);
return `سهم سود / پورسانت: ${Num.format(tx.amount1)} ${cur.name}`;
}
if (tx.type === 'offset') {
const cur = this.getCurrency(tx.currency1);
const amtTxt = Num.format(tx.amount1);
if (tx.offsetMode === 'priced' && tx.currency2 && tx.rate) {
const cur2 = this.getCurrency(tx.currency2);
const amt2Txt = Num.format(tx.amount2 || 0);
const rateTxt = Num.format(tx.rate, 6);
if (tx.offsetDelivery === 'direct') {
return tx.offsetRole === 'from'
? `خرید و تحویل ${amtTxt} ${cur.name} با نرخ ${rateTxt} معادل ${amt2Txt} ${cur2.name}`
: `فروش و تحویل ${amtTxt} ${cur.name} با نرخ ${rateTxt} معادل ${amt2Txt} ${cur2.name}`;
}
return tx.offsetRole === 'from'
? `خرید ${amtTxt} ${cur.name} با نرخ ${rateTxt} معادل ${amt2Txt} ${cur2.name}`
: `فروش ${amtTxt} ${cur.name} با نرخ ${rateTxt} معادل ${amt2Txt} ${cur2.name}`;
}
return tx.offsetRole === 'from'
? `واریز به حساب: ${amtTxt} ${cur.name}`
: `برداشت / دریافت وجه: ${amtTxt} ${cur.name}`;
}
if (tx.type === 'transfer') {
const cur = this.getCurrency(tx.currency1);
const amtTxt = Num.format(tx.amount1 || 0);
const feeM = Dec.toMicro(tx.fee || 0);
const feeTxt = feeM > 0n ? ` (کارمزد: ${Num.formatMicro(feeM)} ${cur.name})` : '';
return tx.side === 'receive'
? `واریز به حساب: ${amtTxt} ${cur.name}${feeTxt}`
: `برداشت / دریافت وجه: ${amtTxt} ${cur.name}${feeTxt}`;
}
}
return tx.summary || '';
},
txMatchesFilterAndSearch(tx, cpId, readOnly = false) {
if (!tx) return false;
if (this.ui.txFilter !== 'all') {
if (this.ui.txFilter === 'disputed') {
if (this.getDisputesForTx(tx, cpId).length === 0) return false;
} else if (this.ui.txFilter === 'profit_share') {
if (!(tx.type === 'profit_share' || tx.offsetRole === 'partner' || tx.shareRole === 'partner')) return false;
} else {
if ((readOnly ? this.getTxPublicType(tx) : tx.type) !== this.ui.txFilter) return false;
}
}
const txQRaw = (this.ui.txSearchQuery || '').trim();
if (txQRaw) {
const txQEn = Num.toEnDigits(txQRaw).toLowerCase();
const txQOrig = txQRaw.toLowerCase();
const dispSummary = this.getTxDisplaySummary(tx, readOnly).toLowerCase();
const ref = Num.toEnDigits(tx.refCode || '').toLowerCase();
const tid = (readOnly ? this.getTxPublicId(tx) : (tx.publicId || tx.id || '')).toLowerCase();
const dt = Num.toEnDigits(tx.date || '').toLowerCase();
const nt = (tx.note || '').toLowerCase();
const pnt = readOnly ? this.getClientNoteForTx(tx).toLowerCase() : (tx.privateNote || '').toLowerCase();
return ref.includes(txQEn) || tid.includes(txQEn) || dt.includes(txQEn) || dispSummary.includes(txQOrig) || nt.includes(txQOrig) || pnt.includes(txQOrig);
}
return true;
},

const newAllDesc = [...stmt.afterConfirmAsc].reverse();

},
getBaseCurrencyCode() {
const pref = this.state.settings.baseCurrency || 'IRT';
if (this.state.currencies.some(c => c.code === pref)) return pref;
return this.state.currencies[0]?.code || 'IRT';
},
getMarketRateMicro(curCode, baseCode = null) {
const base = baseCode || this.getBaseCurrencyCode();
if (curCode === base) return Dec.SCALE; // 1.000000
const mr = this.state.marketRates || {};
const direct = mr[`${base}__${curCode}`];
if (direct && Dec.toMicro(direct.rate) > 0n) {
return Dec.toMicro(direct.rate);
}
return 0n;
},
convertToBaseMicro(amountMicro, curCode, baseCode = null) {
const base = baseCode || this.getBaseCurrencyCode();
if (curCode === base) return { ok: true, baseMicro: amountMicro, rateMicro: Dec.SCALE };
const rateMicro = this.getMarketRateMicro(curCode, base);
if (rateMicro <= 0n) return { ok: false, baseMicro: 0n, rateMicro: 0n };
return { ok: true, baseMicro: Dec.mulMicro(amountMicro, rateMicro), rateMicro };
},
computeDashboardData() {
const baseCode = this.getBaseCurrencyCode();
const activeCps = this.state.counterparties.filter(c => !c.deleted);
const totals = {};
for (const cur of this.state.currencies) {
totals[cur.code] = { receivables: 0n, payables: 0n, net: 0n };
}
for (const cp of activeCps) {
const balances = this.getCounterpartyBalances(cp.id);
for (const b of balances) {
if (!totals[b.code]) totals[b.code] = { receivables: 0n, payables: 0n, net: 0n };
if (b.micro < 0n) {
totals[b.code].receivables += Dec.abs(b.micro);
} else if (b.micro > 0n) {
totals[b.code].payables += b.micro;
}
totals[b.code].net = totals[b.code].receivables - totals[b.code].payables;
}
}
let totalRecBase = 0n;
let totalPayBase = 0n;
let totalNetBase = 0n;
const missingRateCodes = [];
for (const code of Object.keys(totals)) {
const t = totals[code];
const hasActivity = t.receivables !== 0n || t.payables !== 0n;
const convRec = this.convertToBaseMicro(t.receivables, code, baseCode);
const convPay = this.convertToBaseMicro(t.payables, code, baseCode);
const convNet = this.convertToBaseMicro(t.net, code, baseCode);
t.hasRate = convNet.ok;
t.rateMicro = convNet.rateMicro;
t.netBase = convNet.baseMicro;
if (hasActivity) {
if (convNet.ok) {
totalRecBase += convRec.baseMicro;
totalPayBase += convPay.baseMicro;
totalNetBase += convNet.baseMicro;
} else {
missingRateCodes.push(code);
}
}
}
return { baseCode, totals, totalRecBase, totalPayBase, totalNetBase, missingRateCodes, activeCpCount: activeCps.length };
},
computeFeeAndSpreadReport() {
const baseCode = this.getBaseCurrencyCode();
const activeCpSet = new Set(this.state.counterparties.filter(c => !c.deleted).map(c => c.id));
const mode = this.ui.reportPeriodMode || 'all';
let fromStr = '';
let toStr = '';
let periodLabel = 'کل تاریخچه';
if (mode === 'today') {
fromStr = Jalali.todayStr();
toStr = fromStr;
periodLabel = `امروز (${fromStr})`;
} else if (mode === '7d') {
fromStr = Jalali.daysAgoStr(6);
toStr = Jalali.todayStr();
periodLabel = `۷ روز اخیر (${fromStr} تا ${toStr})`;
} else if (mode === '30d') {
fromStr = Jalali.daysAgoStr(29);
toStr = Jalali.todayStr();
periodLabel = `۳۰ روز اخیر (${fromStr} تا ${toStr})`;
} else if (mode === 'custom') {
fromStr = Jalali.normalizeDate(this.ui.reportDateFrom) || '';
toStr = Jalali.normalizeDate(this.ui.reportDateTo) || '';
if (fromStr && toStr) periodLabel = `از ${fromStr} تا ${toStr}`;
else if (fromStr) periodLabel = `از ${fromStr} به بعد`;
else if (toStr) periodLabel = `تا ${toStr}`;
else periodLabel = 'بازه دلخواه (همه تاریخ‌ها)';
}
const fromKey = fromStr ? Jalali.toSortKey(fromStr) : 0;
const toKey = toStr ? Jalali.toSortKey(toStr) : 99999999;
const txs = this.state.transactions.filter(t => {
if (t.deleted || !activeCpSet.has(t.cpId)) return false;
if (fromKey > 0 || toKey < 99999999) {
const k = Jalali.toSortKey(t.date);
if (k < fromKey || k > toKey) return false;
}
return true;
});
const feesByCur = {};
const pairStats = {};
const bilateralByCur = {};
const partnerShareByCur = {};
const seenOffsetProfitGroups = new Set();
let dealCount = 0;
let transferCount = 0;
let offsetCount = 0;
let shareCount = 0;
for (const tx of txs) {
if (tx.type === 'deal') dealCount++;
else if (tx.type === 'transfer') transferCount++;
else if (tx.type === 'offset' && tx.offsetRole === 'from') offsetCount++;
if (tx.type === 'profit_share' || tx.offsetRole === 'partner' || tx.shareRole === 'partner') {
shareCount++;
const shCur = tx.currency1;
const shMicro = Dec.toMicro(tx.amount1 || 0);
if (shCur && shMicro > 0n) {
if (!partnerShareByCur[shCur]) partnerShareByCur[shCur] = { totalMicro: 0n, count: 0 };
partnerShareByCur[shCur].totalMicro += shMicro;
partnerShareByCur[shCur].count += 1;
}
continue;
}
if (tx.type === 'offset' && tx.offsetRole === 'from' && tx.profitMeta && tx.offsetGroupId && !seenOffsetProfitGroups.has(tx.offsetGroupId)) {
seenOffsetProfitGroups.add(tx.offsetGroupId);
const pCur = tx.profitMeta.currency;
const pGross = Dec.toMicro(tx.profitMeta.gross || 0);
if (pCur && pGross !== 0n) {
if (!bilateralByCur[pCur]) bilateralByCur[pCur] = { totalMicro: 0n, count: 0 };
bilateralByCur[pCur].totalMicro += pGross;
bilateralByCur[pCur].count += 1;
}
}
const feeMicro = Dec.toMicro(tx.fee || 0);
if (feeMicro > 0n && (tx.type === 'deal' || tx.type === 'transfer')) {
const fCur = tx.feeCurrency || tx.currency1;
if (fCur) {
if (!feesByCur[fCur]) feesByCur[fCur] = { totalMicro: 0n, count: 0 };
feesByCur[fCur].totalMicro += feeMicro;
feesByCur[fCur].count += 1;
}
}
if (tx.type === 'deal' && tx.currency1 && tx.currency2) {
const amt1 = Dec.toMicro(tx.amount1 || 0);
const rateM = Dec.toMicro(tx.rate || 0);
if (amt1 > 0n && rateM > 0n) {
const base2 = tx.op === 'div' ? Dec.divMicro(amt1, rateM) : Dec.mulMicro(amt1, rateM);
const idx1 = this.state.currencies.findIndex(c => c.code === tx.currency1);
const idx2 = this.state.currencies.findIndex(c => c.code === tx.currency2);
const ord1 = idx1 === -1 ? 999 : idx1;
const ord2 = idx2 === -1 ? 999 : idx2;
const flip = ord1 > ord2 || (ord1 === ord2 && tx.currency1 > tx.currency2);
const c1 = flip ? tx.currency2 : tx.currency1;
const c2 = flip ? tx.currency1 : tx.currency2;
const vol1 = flip ? base2 : amt1;
const vol2 = flip ? amt1 : base2;
const effSide = flip ? (tx.side === 'sell' ? 'buy' : 'sell') : tx.side;
const key = `${c1}__${c2}`;
if (!pairStats[key]) {
pairStats[key] = {
cur1: c1,
cur2: c2,
sellVol1: 0n, sellVol2: 0n, sellCount: 0,
buyVol1: 0n, buyVol2: 0n, buyCount: 0
};
}
const ps = pairStats[key];
if (effSide === 'sell') {
ps.sellVol1 += vol1;
ps.sellVol2 += vol2;
ps.sellCount += 1;
} else {
ps.buyVol1 += vol1;
ps.buyVol2 += vol2;
ps.buyCount += 1;
}
}
}
}
let totalFeesBase = 0n;
let missingFeeRates = 0;
const feeRows = Object.keys(feesByCur).map(code => {
const item = feesByCur[code];
const conv = this.convertToBaseMicro(item.totalMicro, code, baseCode);
if (conv.ok) totalFeesBase += conv.baseMicro;
else missingFeeRates++;
return { code, totalMicro: item.totalMicro, count: item.count, hasRate: conv.ok, baseMicro: conv.baseMicro };
});
let totalBilateralBase = 0n;
let missingBilateralRates = 0;
const bilateralRows = Object.keys(bilateralByCur).map(code => {
const item = bilateralByCur[code];
const conv = this.convertToBaseMicro(item.totalMicro, code, baseCode);
if (conv.ok) totalBilateralBase += conv.baseMicro;
else missingBilateralRates++;
return { code, totalMicro: item.totalMicro, count: item.count, hasRate: conv.ok, baseMicro: conv.baseMicro };
});
let totalPartnerShareBase = 0n;
let missingShareRates = 0;
const partnerShareRows = Object.keys(partnerShareByCur).map(code => {
const item = partnerShareByCur[code];
const conv = this.convertToBaseMicro(item.totalMicro, code, baseCode);
if (conv.ok) totalPartnerShareBase += conv.baseMicro;
else missingShareRates++;
return { code, totalMicro: item.totalMicro, count: item.count, hasRate: conv.ok, baseMicro: conv.baseMicro };
});
let totalSpreadBase = 0n;
let missingSpreadRates = 0;
const pairRows = Object.values(pairStats).map(ps => {
const avgSell = ps.sellVol1 > 0n ? Dec.divMicro(ps.sellVol2, ps.sellVol1) : 0n;
const avgBuy = ps.buyVol1 > 0n ? Dec.divMicro(ps.buyVol2, ps.buyVol1) : 0n;
const matchedVol1 = (ps.sellVol1 > 0n && ps.buyVol1 > 0n)
? (ps.sellVol1 < ps.buyVol1 ? ps.sellVol1 : ps.buyVol1)
: 0n;
const spreadProfitCur2 = matchedVol1 > 0n ? Dec.mulMicro(matchedVol1, avgSell - avgBuy) : 0n;
const convSpread = this.convertToBaseMicro(spreadProfitCur2, ps.cur2, baseCode);
if (matchedVol1 > 0n) {
if (convSpread.ok) totalSpreadBase += convSpread.baseMicro;
else missingSpreadRates++;
}
return {
...ps,
avgSell,
avgBuy,
matchedVol1,
spreadProfitCur2,
hasSpreadBase: convSpread.ok,
spreadBase: convSpread.baseMicro
};
});
const grossSpreadAllBase = totalSpreadBase + totalBilateralBase;
return {
baseCode,
periodMode: mode,
periodLabel,
dealCount,
transferCount,
offsetCount,
shareCount,
feeRows,
totalFeesBase,
bilateralRows,
totalBilateralBase,
partnerShareRows,
totalPartnerShareBase,
missingFeeRates: missingFeeRates + missingBilateralRates + missingShareRates,
pairRows,
totalSpreadBase,
grossSpreadAllBase,
missingSpreadRates,
combinedProfitBase: totalFeesBase + totalSpreadBase + totalBilateralBase - totalPartnerShareBase
};
},

const rt = tEl ? tEl.value.trim() : '';

if (rt && !Jalali.normalizeDate(rt)) { this.toast('تاریخ «تا» معتبر نیست.'); return; }
const nf = rf ? Jalali.normalizeDate(rf) : '';
const nt = rt ? Jalali.normalizeDate(rt) : '';

}
this.ui.reportPeriodMode = 'custom';
this.ui.reportDateFrom = nf;
this.ui.reportDateTo = nt;
this.renderDashboard();

foundMicro = direct.op === 'div' ? Dec.divMicro(Dec.SCALE, rm) : rm;

logMatchesCounterparty(log, cpId) {
if (!cpId || cpId === 'all') return true;
if (Array.isArray(log.cpIds) && log.cpIds.includes(cpId)) return true;
if (log.snapshot) {
if (Array.isArray(log.snapshot) && log.snapshot.some(s => s && (s.cpId === cpId || s.offsetPeerCpId === cpId))) return true;
if (log.entityType === 'cp' && log.snapshot.id === cpId) return true;
if (log.snapshot.cpId === cpId || log.snapshot.offsetPeerCpId === cpId) return true;
}
const cp = this.state.counterparties.find(c => c.id === cpId);
if (cp && cp.name) {
const haystack = `${log.title || ''} ${log.details || ''}`;
if (haystack.includes(cp.name)) return true;
}
return false;
},
getFilteredLogs() {
const allLogs = this.state.logs || [];
const act = this.ui.logFilterAction || 'all';
const cpId = this.ui.logFilterCpId || 'all';
const qRaw = (this.ui.logSearchQuery || '').trim();
const qEn = Num.toEnDigits(qRaw).toLowerCase();
const qOrig = qRaw.toLowerCase();
return allLogs.filter(log => {
if (act !== 'all' && log.action !== act) return false;
if (!this.logMatchesCounterparty(log, cpId)) return false;
if (qRaw) {
const hay = `${log.title || ''} ${log.details || ''} ${log.at || ''} ${log.id || ''}`;
const hayLower = hay.toLowerCase();
const hayEn = Num.toEnDigits(hay).toLowerCase();
if (!hayLower.includes(qOrig) && !hayEn.includes(qEn)) return false;
}
return true;
});
},
formatSnapBrief(snap, entityType) {
if (!snap) return '';
if (entityType === 'offset_pair' && Array.isArray(snap)) {
const legA = snap.find(s => s.offsetRole === 'from') || snap[0];
if (!legA) return '';
const extras = [
legA.date ? `تاریخ: ${legA.date}` : '',
legA.refCode ? `پیگیری: ${legA.refCode}` : '',
legA.note ? `شرح: ${legA.note}` : ''
].filter(Boolean).join(' • ');
return `${legA.summary || ''}${extras ? ` (${extras})` : ''}`;
}
if (entityType === 'cp') {
const parts = [
`نام: ${snap.name || '—'}`,
snap.phone ? `تلفن: ${snap.phone}` : '',
snap.note ? `توضیح: ${snap.note}` : '',
snap.portal ? `پورتال: ${snap.portal.enabled ? 'فعال (' + (snap.portal.username || '') + ')' : 'غیرفعال'}` : ''
].filter(Boolean);
return parts.join(' • ');
}
const extras = [
snap.date ? `تاریخ: ${snap.date}` : '',
snap.refCode ? `پیگیری: ${snap.refCode}` : '',
snap.note ? `توضیح: ${snap.note}` : ''
].filter(Boolean).join(' • ');
return `${snap.summary || ''}${extras ? ` (${extras})` : ''}`;
},
buildLogsListHtml(filtered) {
const badgeMap = {
create: { text: 'ثبت جدید', cls: 'credit' },
edit: { text: 'ویرایش', cls: 'zero' },
delete: { text: 'حذف شده', cls: 'debit' },
restore: { text: 'بازیابی / بازگشت', cls: 'credit' }
};

return `<div class="card empty-state"><div class="big-ico">🧾</div><div>رویدادی مطابق با فیلتر فعلی یافت نشد.</div></div>`;

const b = badgeMap[log.action] || { text: log.action, cls: 'zero' };
const canRestoreDelete = log.action === 'delete' && !log.restored && log.snapshot;
const canUndoEdit = log.action === 'edit' && !log.undone && log.beforeSnapshot;
let diffHtml = '';
if (log.action === 'edit' && log.beforeSnapshot && log.snapshot) {
const beforeStr = this.formatSnapBrief(log.beforeSnapshot, log.entityType);
const afterStr = this.formatSnapBrief(log.snapshot, log.entityType);
diffHtml = `

}
return `

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; gap:8px;">
<span class="balance-chip ${b.cls}" style="font-size:11px; padding:2px 8px;">${b.text}</span>

${canUndoEdit ? `<button class="btn btn-sm btn-amber" onclick="app.undoEditFromLog('${log.id}')">↩️ برگرداندن به نسخه قبل از ویرایش</button>` : ''}
</div>
` : ''}
${log.restored ? `<div style="margin-top:6px; font-size:11px; color:var(--credit); font-weight:700;">✓ این مورد حذف‌شده قبلاً بازیابی شده است</div>` : ''}
${log.undone ? `<div style="margin-top:6px; font-size:11px; color:var(--amber); font-weight:700;">✓ این ویرایش قبلاً به نسخه قبل برگردانده شده است</div>` : ''}
</div>
`;
}).join('');
},

const allLogs = this.state.logs || [];

undoEditFromLog(logId) {
if (!this.requireAdmin()) return;
const log = this.state.logs.find(l => l.id === logId);
if (!log || log.action !== 'edit' || !log.beforeSnapshot || log.undone) return;
const before = JSON.parse(JSON.stringify(log.beforeSnapshot));
if (log.entityType === 'tx') {
const idx = this.state.transactions.findIndex(t => t.id === before.id);
if (idx !== -1 && this.state.transactions[idx].deleted) {
this.toast('این تراکنش پس از ویرایش حذف شده است؛ ابتدا از همین تب آن را بازیابی کنید.', true);
return;
}
if (!confirm('آیا این ویرایش به نسخه قبلی خود برگردانده شود؟ مانده حساب‌ها به‌طور خودکار اصلاح می‌شوند.')) return;
const currentSnap = idx !== -1 ? JSON.parse(JSON.stringify(this.state.transactions[idx])) : null;
if (idx !== -1) {
this.state.transactions[idx] = before;
} else {
this.state.transactions.push(before);
}
log.undone = true;
this.addLog(
'restore',
`بازگشت ویرایش ${before.id}`,
`برگردانده شد به نسخه قبل: ${before.summary || ''}`,
before,
'tx',
{ beforeSnapshot: currentSnap, cpIds: [before.cpId] }
);
this.saveState(true);
this.toast('ویرایش با موفقیت به نسخه قبل برگردانده شد و بالانس اصلاح گردید.');
this.renderLogs();
} else if (log.entityType === 'offset_pair' && Array.isArray(before)) {
const anyDeleted = before.some(leg => {
const cur = this.state.transactions.find(t => t.id === leg.id);
return cur && cur.deleted;
});
if (anyDeleted) {
this.toast('این عملیات مرتبط حذف شده است؛ ابتدا آن را بازیابی کنید.', true);
return;
}
if (!confirm('آیا تمام ردیف‌های مرتبط این عملیات به نسخه قبل از ویرایش برگردانده شوند؟')) return;
const cpIds = new Set();
const currentPair = [];
const beforeIds = new Set(before.map(l => l.id));
if (Array.isArray(log.snapshot)) {
for (const afterLeg of log.snapshot) {
if (!beforeIds.has(afterLeg.id)) {
const extraTx = this.state.transactions.find(t => t.id === afterLeg.id);
if (extraTx) {
currentPair.push(JSON.parse(JSON.stringify(extraTx)));
if (extraTx.cpId) cpIds.add(extraTx.cpId);
extraTx.deleted = true;
}
}
}
}
for (const legBefore of before) {
if (legBefore.cpId) cpIds.add(legBefore.cpId);
const idx = this.state.transactions.findIndex(t => t.id === legBefore.id);
if (idx !== -1) {
currentPair.push(JSON.parse(JSON.stringify(this.state.transactions[idx])));
if (this.state.transactions[idx].cpId) cpIds.add(this.state.transactions[idx].cpId);
this.state.transactions[idx] = legBefore;
} else {
this.state.transactions.push(legBefore);
}
}
log.undone = true;
this.addLog(
'restore',
`بازگشت ویرایش ${before[0]?.offsetGroupId || before[0]?.shareGroupId || ''}`,
`تمام ردیف‌های مرتبط به نسخه قبل برگردانده شدند.`,
before,
'offset_pair',
{ beforeSnapshot: currentPair, cpIds: Array.from(cpIds) }
);
this.saveState(true);
this.toast('تمام ردیف‌های مرتبط به نسخه قبل از ویرایش برگردانده شدند.');
this.renderLogs();
} else if (log.entityType === 'cp') {
const idx = this.state.counterparties.findIndex(c => c.id === before.id);
if (idx !== -1 && this.state.counterparties[idx].deleted) {
this.toast('این طرف حساب حذف شده است؛ ابتدا آن را بازیابی کنید.', true);
return;
}
if (!confirm('آیا این ویرایش طرف حساب به نسخه قبل برگردانده شود؟')) return;
const currentSnap = idx !== -1 ? JSON.parse(JSON.stringify(this.state.counterparties[idx])) : null;
if (idx !== -1) {
if (log.editScope === 'profile') {
this.state.counterparties[idx].name = before.name;
this.state.counterparties[idx].phone = before.phone;
this.state.counterparties[idx].note = before.note;
this.state.counterparties[idx].idPrefix = before.idPrefix;
this.state.counterparties[idx].nextTxSeq = before.nextTxSeq;
} else if (log.editScope === 'portal') {
this.state.counterparties[idx].portal = before.portal || undefined;
} else {
this.state.counterparties[idx] = before;
}
} else {
this.state.counterparties.push(before);
}
log.undone = true;
this.addLog(
'restore',
`بازگشت ویرایش طرف حساب: ${before.name}`,
`به نسخه قبل برگردانده شد.`,
idx !== -1 ? this.state.counterparties[idx] : before,
'cp',
{ beforeSnapshot: currentSnap, cpIds: [before.id] }
);
this.saveState(true);
this.toast('تغییر طرف حساب به نسخه قبل برگردانده شد.');
this.renderLogs();
}
},
restoreFromLog(logId) {
if (!this.requireAdmin()) return;
const log = this.state.logs.find(l => l.id === logId);
if (!log || !log.snapshot) return;
if (log.entityType === 'tx') {
const existing = this.state.transactions.find(t => t.id === log.snapshot.id);
if (existing) {
existing.deleted = false;
} else {
const restoredTx = JSON.parse(JSON.stringify(log.snapshot));
restoredTx.deleted = false;
this.state.transactions.push(restoredTx);
}
log.restored = true;
this.addLog('restore', `بازیابی تراکنش ${log.snapshot.id}`, log.snapshot.summary || '', log.snapshot, 'tx', { cpIds: [log.snapshot.cpId] });
this.saveState(true);
this.toast('تراکنش با موفقیت بازیابی شد و بالانس به‌روزرسانی شد.');
this.renderLogs();
} else if (log.entityType === 'offset_pair' && Array.isArray(log.snapshot)) {
const cpIds = [];
for (const snap of log.snapshot) {
if (snap.cpId) cpIds.push(snap.cpId);
const existing = this.state.transactions.find(t => t.id === snap.id);
if (existing) {
existing.deleted = false;
} else {
const copy = JSON.parse(JSON.stringify(snap));
copy.deleted = false;
this.state.transactions.push(copy);
}
}
log.restored = true;
this.addLog('restore', `بازیابی تهاتر سه‌جانبه (${log.snapshot[0]?.offsetGroupId || ''})`, log.details || '', log.snapshot, 'offset_pair', { cpIds });
this.saveState(true);
this.toast('هر دو طرف تهاتر سه‌جانبه بازیابی شد.');
this.renderLogs();
} else if (log.entityType === 'cp') {
const existing = this.state.counterparties.find(c => c.id === log.snapshot.id);
if (existing) {
existing.deleted = false;
} else {
const restoredCp = JSON.parse(JSON.stringify(log.snapshot));
restoredCp.deleted = false;
this.state.counterparties.push(restoredCp);
}
log.restored = true;
this.addLog('restore', `بازیابی طرف حساب: ${log.snapshot.name}`, '', log.snapshot, 'cp', { cpIds: [log.snapshot.id] });
this.saveState(true);
this.toast('طرف حساب با موفقیت بازیابی شد.');
this.renderLogs();
}

saveGeneralSettings() {
if (!this.requireAdmin()) return;
const title = document.getElementById('set-shop-title').value.trim() || 'دفتر صرافی هوشمند';
const th = Num.parse(document.getElementById('set-round-th').value);
const rm = document.getElementById('set-round-mode')?.value || 'favor_cp';
const bkpChg = Math.max(1, Math.floor(Num.parse(document.getElementById('set-bkp-chg').value) || 10));
this.state.settings.shopTitle = title;
this.state.settings.defaultRoundMode = ['favor_cp', 'nearest', 'favor_me', 'none'].includes(rm) ? rm : 'favor_cp';
this.state.settings.roundingThreshold = (th >= 0 && th < 1) ? th : 0.1;
this.state.settings.backupReminderChanges = bkpChg;
this.saveState(false);
this.toast('تنظیمات ذخیره شد.');
this.render();
},
moveCurrency(idx, dir) {
if (!this.requireAdmin()) return;
const target = idx + dir;
if (target < 0 || target >= this.state.currencies.length) return;
const arr = this.state.currencies;
[arr[idx], arr[target]] = [arr[target], arr[idx]];
this.saveState(false);
this.renderSettings();
},
toggleCurrencyExact(idx) {
if (!this.requireAdmin()) return;
this.state.currencies[idx].exact = !this.state.currencies[idx].exact;
this.saveState(false);
this.renderSettings();
},

this.openModal('افزودن ارز جدید', `

saveNewCurrency() {
if (!this.requireAdmin()) return;
const name = document.getElementById('new-cur-name').value.trim();
const code = Num.toEnDigits(document.getElementById('new-cur-code').value).trim().toUpperCase().replace(/\s+/g, '_');
const symbol = document.getElementById('new-cur-sym').value.trim() || code;
const exact = document.getElementById('new-cur-exact').checked;
if (!name || !code) {
this.toast('نام فارسی و کد انگلیسی ارز را وارد کنید.');
return;
}
if (this.state.currencies.some(c => c.code === code)) {
this.toast('این کد ارز قبلاً وجود دارد.');
return;
}
this.state.currencies.push({ code, name, symbol, exact });
this.saveState(false);
this.closeModal();
this.toast(`ارز «${name}» اضافه شد.`);
this.renderSettings();
},
exportBackupJson() {
if (!this.requireAdmin()) return;
this.state.settings.lastBackupAt = Date.now();
this.state.settings.changesSinceBackup = 0;
this.state.settings.backupSnoozeUntil = 0;
this.saveState(false);
const dataStr = JSON.stringify(this.state, null, 2);
const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `sarafi-backup-${Jalali.todayStr().replace(/\//g, '-')}.json`;
a.click();
URL.revokeObjectURL(url);
this.toast('فایل پشتیبان دانلود شد و شمارنده پشتیبان صفر شد.');
this.render();
},
importBackupJson(event) {
if (!this.requireAdmin()) return;
const input = event.target;
const file = input && input.files ? input.files[0] : null;
if (!file) return;
const reader = new FileReader();
reader.onload = (e) => {
try {
const parsed = JSON.parse(e.target.result);
if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.counterparties) || !Array.isArray(parsed.transactions)) {
throw new Error('فرمت فایل معتبر نیست');
}
if (!this._backupImportAuthorized) return;
this._backupImportAuthorized = false;
const def = createDefaultState();
const validCurs = Array.isArray(parsed.currencies) && parsed.currencies.length
? parsed.currencies.filter(c => c && typeof c.code === 'string' && c.code.trim() && typeof c.name === 'string' && c.name.trim())
: def.currencies;
this.state = Object.assign(def, parsed);
this.state.currencies = validCurs.length ? validCurs : def.currencies;
this.state.logs = Array.isArray(parsed.logs) ? parsed.logs : [];
this.state.disputes = Array.isArray(parsed.disputes) ? parsed.disputes : [];
this.state.confirmations = Array.isArray(parsed.confirmations) ? parsed.confirmations : [];
this.state.deposits = Array.isArray(parsed.deposits) ? parsed.deposits : [];
this.state.settings = Object.assign(def.settings, parsed.settings || {});
this.state.seq = Object.assign(def.seq, parsed.seq || {});
this.state.lastRates = Object.assign({}, parsed.lastRates || {});
this.state.marketRates = Object.assign({}, parsed.marketRates || {});
this.state.settings.changesSinceBackup = 0;
this.state.settings.lastBackupAt = Date.now();
this.migrateLegacyCurrencyCodes(this.state);
this.applyThemeClass();
this.saveState(false);
this.toast('پشتیبان با موفقیت بازیابی شد.');
this.switchTab('accounts');
} catch (err) {
this.toast('فایل پشتیبان نامعتبر یا خراب است.', true);
} finally {
if (input) input.value = '';
}
};
reader.onerror = () => {
if (input) input.value = '';
this.toast('خطا در خواندن فایل پشتیبان.', true);
};
reader.readAsText(file);
},
resetAllData() {
if (!this.requireAdmin()) return;
const cpCnt = this.state.counterparties.filter(c => !c.deleted).length;
const txCnt = this.state.transactions.filter(t => !t.deleted).length;
this.openDangerConfirmModal({
title: 'پاک کردن کامل دفتر (بازنشانی)',
warningHtml: `<strong>🚨 هشدار بسیار مهم — غیرقابل بازگشت!</strong><br/>با تأیید این عملیات، <strong>تمام ${cpCnt} طرف حساب، ${txCnt} تراکنش، پورتال کاربران، لاگ تغییرات و تنظیمات</strong> به‌طور کامل پاک می‌شوند.<br/>حتماً قبل از ادامه، یک فایل پشتیبان (JSON) ذخیره کنید.`,
confirmLabel: '🗑️ پاک کردن کامل همه اطلاعات',
showBackupBtn: true,
requireAck: true,
ackText: 'مطمئن هستم و می‌خواهم کل اطلاعات دفتر برای همیشه پاک شود.',
confirmWord: 'حذف کامل',
onConfirm: () => {
this.state = createDefaultState();
this.applyThemeClass();
this.saveState(false);
this.toast('دفتر به‌طور کامل بازنشانی شد.');
this.switchTab('accounts');
}
});
},
setDateInputValue(inputId, val) {
const el = document.getElementById(inputId);
if (!el) return;
el.value = val;
this.validateDateInput(inputId);
},
validateDateInput(inputId) {
const el = document.getElementById(inputId);
const hint = document.getElementById(inputId + '-hint');
if (!el) return null;
const norm = Jalali.normalizeDate(el.value);
if (!norm) {
el.classList.add('invalid');
if (hint) {
hint.className = 'date-hint err';
hint.textContent = 'فرمت صحیح: 1405/08/29';
}
return null;
}
el.classList.remove('invalid');
if (hint) {
hint.className = 'date-hint ok';
hint.textContent = `✓ تاریخ معتبر (${norm})`;
}
return norm;
},

`<option value="${escapeHtml(c.code)}" ${c.code === selectedCode ? 'selected' : ''}>${CurIcon.emoji(c.code)} ${escapeHtml(c.name)} (${escapeHtml(c.code)})</option>`
).join('');

onNewCpNameInput(val) {
if (this._cpPrefixManual) return;
const pEl = document.getElementById('cp-id-prefix');
if (pEl) {
const sug = this.ensureUniqueIdPrefix(Sec.suggestIdPrefix(val));
pEl.value = val.trim() ? sug : '';
}
this.updateCpIdPreview('cp-id-prefix', 'cp-id-start', 'cp-id-preview');
},
updateCpIdPreview(prefId, numId, outId) {
const pEl = document.getElementById(prefId);
const nEl = document.getElementById(numId);
const oEl = document.getElementById(outId);
if (!oEl) return;

</div>
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">ارز کارمزد</label>
<select id="tx-fee-cur" class="form-control" onchange="app.onTxAutoFieldChange()">${this.currencyOptionsHtml(editTx?.feeCurrency || editTx?.currency2 || defaultCur2)}</select>
</div>
</div>
<div class="form-group" style="margin-bottom:10px;">
<label class="form-label">روش گرد کردن این معامله</label>

<option value="nearest" ${this._txForm.roundMode==='nearest'?'selected':''}>نزدیک‌ترین عدد صحیح (۰.۵)</option>
<option value="favor_me" ${this._txForm.roundMode==='favor_me'?'selected':''}>به نفع من</option>
<option value="none" ${this._txForm.roundMode==='none'?'selected':''}>دقیق (بدون گرد کردن)</option>
</select>
</div>
</div>
<div id="tx-more-trf-fee" style="display:${this._txForm.type==='transfer'?'block':'none'}">
<div class="form-group" style="margin-bottom:10px;">
<label class="form-label">کارمزد انتقال به عهده طرف حساب (پیش‌فرض ۰)</label>
<input type="text" inputmode="decimal" id="trf-fee" class="form-control input-ltr" placeholder="0" value="${editTx && editTx.type==='transfer' && editTx.fee ? Num.format(editTx.fee) : '0'}" oninput="Num.formatLiveInput(this); app.updateTxPreview()" />
</div>
</div>
<div class="grid-2" style="margin-bottom:8px;">
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">
<span>تاریخ شمسی</span>
<span>
<button type="button" class="btn btn-xs btn-secondary" onclick="app.setDateInputValue('tx-date', Jalali.todayStr()); app.syncTxDateBadge()">امروز</button>
<button type="button" class="btn btn-xs btn-secondary" onclick="app.setDateInputValue('tx-date', Jalali.yesterdayStr()); app.syncTxDateBadge()">دیروز</button>
</span>
</label>
<input type="text" id="tx-date" class="form-control input-ltr" value="${escapeHtml(editTx ? editTx.date : Jalali.todayStr())}" oninput="app.validateDateInput('tx-date'); app.syncTxDateBadge()" />
<div id="tx-date-hint" class="date-hint"></div>
</div>
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">شماره فیش / کد پیگیری</label>
<input type="text" id="tx-ref" class="form-control input-ltr" placeholder="اختیاری" value="${escapeHtml(editTx ? (editTx.refCode || '') : '')}" />
</div>
</div>
<div class="form-group" style="margin-bottom:10px;">
<label class="form-label" style="color:var(--purple);">🔒 یادداشت محرمانه (فقط برای خودتان — مخفی از کاربر)</label>
<input type="text" id="tx-private-note" class="form-control" placeholder="اختیاری..." value="${escapeHtml(editTx ? (editTx.privateNote || '') : '')}" />
</div>
<div style="border-top:1px dashed var(--border); padding-top:8px;">
<label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--amber-text); margin-bottom:8px;">
<input type="checkbox" id="tx-chk-share" ${this._txForm.showShare ? 'checked' : ''} onchange="app.toggleTxExtra('share', this.checked)" />
<span>🤝 ثبت همزمان تسهیم سود برای شریک / معرف</span>
</label>
<div id="tx-share-panel" style="display:none;">
<div class="form-group" style="margin-bottom:8px;">
<label class="form-label">شریک دریافت‌کننده سهم سود (+ طلبکار می‌شود)</label>
<select id="tx-share-partner" class="form-control" onchange="app.updateTxPreview()">
${activeCps.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
</select>
</div>
<div class="grid-2">
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">مبلغ سهم سود</label>
<input type="text" inputmode="decimal" id="tx-share-amt" class="form-control input-ltr" placeholder="مثلاً 50" oninput="Num.formatLiveInput(this); app.updateTxPreview()" />
</div>
<div class="form-group" style="margin-bottom:0;">
<label class="form-label">ارز سهم سود</label>
<select id="tx-share-cur" class="form-control" onchange="app.updateTxPreview()">${this.currencyOptionsHtml(defaultCur1)}</select>
</div>
</div>
</div>
</div>
</div>
<!-- LIVE CALCULATION PREVIEW -->
<div class="preview-box" id="tx-preview-box"></div>
<div class="grid-2">
<button class="btn btn-primary" onclick="app.saveTx(false)">
${isEdit ? '💾 ذخیره تغییرات' : '✅ ثبت در دفتر'}
</button>
<button class="btn btn-blue" onclick="app.saveTx(true)">
📋 ${isEdit ? 'ذخیره + متن رسید' : 'ثبت + متن رسید'}
</button>
</div>
`);
if (existingPartnerLeg) {
const pSel = document.getElementById('tx-share-partner');
const pAmt = document.getElementById('tx-share-amt');
const pCur = document.getElementById('tx-share-cur');
if (pSel) pSel.value = existingPartnerLeg.cpId;
if (pAmt) pAmt.value = Num.format(existingPartnerLeg.amount1);
if (pCur) pCur.value = existingPartnerLeg.currency1;
}
this.syncTxExtraPanels();
this.validateDateInput('tx-date');
this.renderLastRateHint();
this.updateTxPreview(Boolean(editTx && editTx.type === 'deal' && editTx.manualAmt2));
},
syncTxDateBadge() {
const dEl = document.getElementById('tx-date');
const bEl = document.getElementById('tx-date-mini-badge');
if (dEl && bEl) bEl.textContent = `📅 ${dEl.value.trim() || Jalali.todayStr()}`;
},
toggleTxExtra(which, forceVal = null) {
if (which === 'more') this._txForm.showMore = !this._txForm.showMore;
if (which === 'share') this._txForm.showShare = forceVal !== null ? !!forceVal : !this._txForm.showShare;
this.syncTxExtraPanels();
this.updateTxPreview();
},
syncTxExtraPanels() {
const mp = document.getElementById('tx-more-panel');
const mb = document.getElementById('tx-btn-more');
const ml = document.getElementById('tx-btn-more-lbl');
const sp = document.getElementById('tx-share-panel');
const sc = document.getElementById('tx-chk-share');
if (mp) mp.style.display = this._txForm.showMore ? 'block' : 'none';
if (mb) mb.className = 'opt-pill' + (this._txForm.showMore ? ' active' : '');
if (ml) ml.textContent = this._txForm.showMore ? '⚙️ بستن گزینه‌های بیشتر ▴' : '⚙️ بیشتر ▾';
if (sp) sp.style.display = this._txForm.showShare ? 'block' : 'none';
if (sc) sc.checked = !!this._txForm.showShare;
},
setTxFormType(type) {
this._txForm.type = type;
document.querySelectorAll('#seg-tx-type .seg-btn').forEach((b, i) => {
b.classList.toggle('active', (i === 0 && type === 'deal') || (i === 1 && type === 'transfer'));
});
document.getElementById('deal-fields').style.display = type === 'deal' ? 'block' : 'none';
document.getElementById('transfer-fields').style.display = type === 'transfer' ? 'block' : 'none';
const df = document.getElementById('tx-more-deal-fee');
const tf = document.getElementById('tx-more-trf-fee');
if (df) df.style.display = type === 'deal' ? 'block' : 'none';
if (tf) tf.style.display = type === 'transfer' ? 'block' : 'none';
this.updateTxPreview();
},
setDealSide(side) {
this._txForm.dealSide = side;
document.getElementById('btn-side-sell').className = 'seg-btn ' + (side === 'sell' ? 'active sell' : '');
document.getElementById('btn-side-buy').className = 'seg-btn ' + (side === 'buy' ? 'active buy' : '');
this.updateTxPreview(this._txForm.amt2Manual);
},
setDealOp(op) {
this._txForm.op = op;
const bm = document.getElementById('btn-op-mul');
const bd = document.getElementById('btn-op-div');
if (bm) bm.className = 'deal-op-btn ' + (op === 'mul' ? 'active' : '');
if (bd) bd.className = 'deal-op-btn ' + (op === 'div' ? 'active' : '');
this._txForm.amt2Manual = false;
this.updateTxPreview(false);
},
setDealRoundMode(mode) {
this._txForm.roundMode = mode;
this._txForm.amt2Manual = false;
const sel = document.getElementById('tx-round-mode');
if (sel && sel.value !== mode) sel.value = mode;
this.updateTxPreview(false);
},
onTxAutoFieldChange() {
if (this._txForm) this._txForm.amt2Manual = false;
this.updateTxPreview(false);
},
onTxAmt2Input() {
if (!this._txForm || this._txForm.type !== 'deal') return;
const amt2El = document.getElementById('tx-amt2');
const amt1El = document.getElementById('tx-amt1');
const rateEl = document.getElementById('tx-rate');
const cur2El = document.getElementById('tx-cur2');
const feeEl = document.getElementById('tx-fee');
const feeCurEl = document.getElementById('tx-fee-cur');
const rawVal = amt2El ? amt2El.value.trim() : '';
const amt2Micro = Dec.toMicro(rawVal);
if (!rawVal || amt2Micro <= 0n) {
this._txForm.amt2Manual = false;
this.updateTxPreview(true);
return;
}
this._txForm.amt2Manual = true;
const amt1Micro = Dec.toMicro(amt1El ? amt1El.value : '');
if (amt1Micro > 0n && rateEl) {
const feeMicro = Dec.toMicro(feeEl ? feeEl.value : '');
const cur2 = cur2El ? cur2El.value : '';
const feeCur = feeCurEl ? feeCurEl.value : '';
let base2Micro = amt2Micro;
if (feeMicro > 0n && feeCur === cur2) {
const adj = this._txForm.dealSide === 'sell' ? (amt2Micro - feeMicro) : (amt2Micro + feeMicro);
if (adj > 0n) base2Micro = adj;
}
const newRateMicro = this._txForm.op === 'mul'
? Dec.divMicro(base2Micro, amt1Micro)
: Dec.divMicro(amt1Micro, base2Micro);
if (newRateMicro > 0n) {
rateEl.value = Num.formatMicro(newRateMicro, 6);
}
}
this.updateTxPreview(true);
},
applyQuickSnapAmt2(valStr) {
const amt2El = document.getElementById('tx-amt2');
if (!amt2El) return;
amt2El.value = Num.format(valStr, 4);
this.onTxAmt2Input();
},
setTransferSide(side) {
this._txForm.transferSide = side;
document.getElementById('btn-trf-recv').className = 'seg-btn ' + (side === 'receive' ? 'active receive' : '');
document.getElementById('btn-trf-pay').className = 'seg-btn ' + (side === 'pay' ? 'active pay' : '');
this.updateTxPreview();
},
syncFeeCurrencyDefault() {
const cur2 = document.getElementById('tx-cur2').value;
const feeCurEl = document.getElementById('tx-fee-cur');
if (feeCurEl) feeCurEl.value = cur2;
},
computeTxDraft() {
const f = this._txForm;
if (f.type === 'deal') {
const cur1 = document.getElementById('tx-cur1').value;
const cur2 = document.getElementById('tx-cur2').value;
const amt1Micro = Dec.toMicro(document.getElementById('tx-amt1').value);
const rateMicro = Dec.toMicro(document.getElementById('tx-rate').value);
const manualAmt2Micro = Dec.toMicro(document.getElementById('tx-amt2')?.value || '');
const feeMicro = Dec.toMicro(document.getElementById('tx-fee').value);
const feeCur = document.getElementById('tx-fee-cur').value;
const roundMode = f.roundMode || 'favor_cp';
const isManualAmt2 = Boolean(f.amt2Manual && manualAmt2Micro > 0n);

if (amt1Micro <= 0n) return { valid: false, reason: 'مقدار ارز اول را وارد کنید.' };
if (cur1 === cur2) return { valid: false, reason: 'در معامله دو ارزی، ارز اول و ارز دوم باید متفاوت باشند.' };
if (!isManualAmt2 && rateMicro <= 0n) return { valid: false, reason: 'نرخ تبدیل یا مقدار ارز دوم را وارد کنید.' };

const c1Obj = this.getCurrency(cur1);
const c2Obj = this.getCurrency(cur2);
const feeObj = this.getCurrency(feeCur);
const sign1 = f.dealSide === 'sell' ? 1 : -1;
const sign2 = f.dealSide === 'sell' ? -1 : 1;
const feeSeparate = Boolean(feeMicro > 0n && feeCur !== cur2);

let effRateMicro = rateMicro;
let rawTotal2AbsMicro = 0n;
let finalAmt2AbsMicro = 0n;
let finalSign2 = sign2;
let roundingNote = '';
let roundInfo = null;

if (isManualAmt2) {
finalAmt2AbsMicro = manualAmt2Micro;
rawTotal2AbsMicro = manualAmt2Micro;
let base2Micro = manualAmt2Micro;
if (feeMicro > 0n && feeCur === cur2) {
const adj = f.dealSide === 'sell' ? (manualAmt2Micro - feeMicro) : (manualAmt2Micro + feeMicro);
if (adj > 0n) base2Micro = adj;
}
effRateMicro = f.op === 'mul'
? Dec.divMicro(base2Micro, amt1Micro)
: Dec.divMicro(amt1Micro, base2Micro);
const fl = (manualAmt2Micro / Dec.SCALE) * Dec.SCALE;
const hasFrac = (manualAmt2Micro % Dec.SCALE) !== 0n;
roundInfo = {
rawMicro: manualAmt2Micro,
finalMicro: manualAmt2Micro,
hasFrac,
floorMicro: fl,
ceilMicro: hasFrac ? (fl + Dec.SCALE) : fl,
rounded: false,
favored: 'manual'
};
} else {
const base2Micro = f.op === 'mul'
? Dec.mulMicro(amt1Micro, rateMicro)
: Dec.divMicro(amt1Micro, rateMicro);
let total2Micro = base2Micro;
if (feeMicro > 0n && feeCur === cur2) {
total2Micro = (f.dealSide === 'sell') ? (base2Micro + feeMicro) : (base2Micro - feeMicro);
}
rawTotal2AbsMicro = Dec.abs(total2Micro);
finalAmt2AbsMicro = rawTotal2AbsMicro;
finalSign2 = total2Micro >= 0n ? sign2 : -sign2;

const effectiveMode = (c2Obj.exact && roundMode === 'favor_cp') ? 'none' : roundMode;
const th = this.state.settings.roundingThreshold ?? 0.1;
roundInfo = Num.smartRoundMicro(rawTotal2AbsMicro, finalSign2, th, effectiveMode);
if (roundInfo.rounded) {
finalAmt2AbsMicro = roundInfo.finalMicro;
if (effectiveMode === 'nearest') {
roundingNote = `گرد کردن به نزدیک‌ترین عدد صحیح: مبلغ دقیق ${Num.formatMicro(roundInfo.rawMicro)} ${c2Obj.name} ← ثبت نهایی ${Num.formatMicro(roundInfo.finalMicro)} ${c2Obj.name}`;
} else if (effectiveMode === 'favor_me') {
roundingNote = `گرد کردن به عدد صحیح: مبلغ دقیق ${Num.formatMicro(roundInfo.rawMicro)} ${c2Obj.name} ← ثبت نهایی ${Num.formatMicro(roundInfo.finalMicro)} ${c2Obj.name}`;
} else if (roundInfo.favored === 'me') {
roundingNote = `گرد کردن هوشمند (نزدیک به عدد صحیح): مبلغ دقیق ${Num.formatMicro(roundInfo.rawMicro)} ${c2Obj.name} ← ثبت نهایی ${Num.formatMicro(roundInfo.finalMicro)} ${c2Obj.name}`;
} else {
roundingNote = `گرد کردن هوشمند به نفع طرف حساب: مبلغ دقیق ${Num.formatMicro(roundInfo.rawMicro)} ${c2Obj.name} ← ثبت نهایی ${Num.formatMicro(roundInfo.finalMicro)} ${c2Obj.name}`;
}
}
}

const delta1Micro = sign1 > 0 ? amt1Micro : -amt1Micro;
const delta2Micro = finalSign2 > 0 ? finalAmt2AbsMicro : -finalAmt2AbsMicro;
const effectsMicro = [
{ currency: cur1, deltaMicro: delta1Micro },
{ currency: cur2, deltaMicro: delta2Micro }
];
if (feeSeparate && feeMicro > 0n) {
const existing = effectsMicro.find(e => e.currency === feeCur);
if (existing) {
existing.deltaMicro -= feeMicro;
} else {
effectsMicro.push({ currency: feeCur, deltaMicro: -feeMicro });
}
}
const effects = effectsMicro.map(e => ({
currency: e.currency,
delta: Dec.toStoredVal(e.deltaMicro),
deltaMicro: e.deltaMicro
}));
const opChar = f.op === 'mul' ? '×' : '÷';
const sideTitle = f.dealSide === 'sell' ? 'فروش' : 'خرید';
const feeText = feeMicro > 0n ? ` (کارمزد: ${Num.formatMicro(feeMicro)} ${feeObj.name})` : '';
const summary = `${sideTitle} ${Num.formatMicro(amt1Micro)} ${c1Obj.name} با نرخ ${Num.formatMicro(effRateMicro, 6)} (${opChar}) معادل ${Num.formatMicro(finalAmt2AbsMicro)} ${c2Obj.name}${feeText}`;
return {
valid: true,
type: 'deal',
side: f.dealSide,
op: f.op,
currency1: cur1,
amount1: Dec.toStoredVal(amt1Micro),
currency2: cur2,
amount2: Dec.toStoredVal(finalAmt2AbsMicro),
finalAmt2Micro: finalAmt2AbsMicro,
rate: Dec.toStoredVal(effRateMicro),
fee: Dec.toStoredVal(feeMicro),
feeCurrency: feeCur,
roundMode,
smartRound: roundMode !== 'none',
manualAmt2: isManualAmt2,
roundInfo,
roundingNote,
effects,
summary
};
} else {
const cur = document.getElementById('trf-cur').value;
const amtMicro = Dec.toMicro(document.getElementById('trf-amt').value);
const feeMicro = Dec.toMicro(document.getElementById('trf-fee').value);
if (amtMicro <= 0n) return { valid: false, reason: 'مبلغ انتقال را وارد کنید.' };
const cObj = this.getCurrency(cur);
const deltaMicro = f.transferSide === 'receive'
? (amtMicro - feeMicro)
: -(amtMicro + feeMicro);
const sideText = f.transferSide === 'receive' ? 'دریافت از طرف حساب' : 'پرداخت به طرف حساب';
const feeText = feeMicro > 0n ? ` (کارمزد: ${Num.formatMicro(feeMicro)} ${cObj.name})` : '';
const summary = `${sideText}: ${Num.formatMicro(amtMicro)} ${cObj.name}${feeText}`;
return {
valid: true,
type: 'transfer',
side: f.transferSide,
currency1: cur,
amount1: Dec.toStoredVal(amtMicro),
fee: Dec.toStoredVal(feeMicro),
feeCurrency: cur,
roundingNote: '',
effects: [{ currency: cur, delta: Dec.toStoredVal(deltaMicro), deltaMicro }],
summary
};
}
},
updateTxPreview(skipSyncAmt2 = false) {
const box = document.getElementById('tx-preview-box');
if (!box) return;
const d = this.computeTxDraft();

// Keep tx-amt2 box & badge visually synced
const amt2El = document.getElementById('tx-amt2');
const badgeEl = document.getElementById('tx-amt2-badge');
if (this._txForm && this._txForm.type === 'deal' && amt2El) {
if (!d.valid) {
if (!skipSyncAmt2) amt2El.value = '';
amt2El.classList.remove('amt2-input-manual');
if (badgeEl) {
badgeEl.textContent = 'قابل ویرایش';
badgeEl.style.color = 'var(--primary)';
}
} else {
if (!skipSyncAmt2 && !d.manualAmt2) {
amt2El.value = Num.formatMicro(d.finalAmt2Micro, 4);
}
amt2El.classList.toggle('amt2-input-manual', !!d.manualAmt2);
if (badgeEl) {
if (d.manualAmt2) {
badgeEl.textContent = '✏️ دستی (نرخ تنظیم شد)';
badgeEl.style.color = 'var(--blue)';
} else {
badgeEl.textContent = 'قابل ویرایش';
badgeEl.style.color = 'var(--primary)';
}
}
}
}

if (!d.valid) {
box.innerHTML = `<div style="font-size:12.5px; color:var(--text-muted); text-align:center;">${escapeHtml(d.reason)}</div>`;
return;
}

const lines = d.effects.map(ef => {
const cur = this.getCurrency(ef.currency);
const cls = this.getStatusClass(ef.deltaMicro);
const st = this.getStatusText(ef.deltaMicro);
return `
<div class="preview-line">
<span class="cur-with-flag"><span>تأثیر روی</span>${CurIcon.svg(cur.code, 'xs', cur.symbol)}<strong>${escapeHtml(cur.name)}</strong><span>:</span></span>
<span class="balance-chip ${cls}" style="direction:ltr">${Num.formatSigned(ef.deltaMicro)} (${st})</span>
</div>
`;
}).join('');

let sharePrev = '';
if (this._txForm && this._txForm.showShare) {
const pId = document.getElementById('tx-share-partner')?.value;
const pAmtM = Dec.toMicro(document.getElementById('tx-share-amt')?.value || '');
const pCurCode = document.getElementById('tx-share-cur')?.value;
const pCp = this.state.counterparties.find(c => c.id === pId);
const pCur = this.getCurrency(pCurCode);
if (pCp && pAmtM > 0n) {
sharePrev = `<div class="preview-line" style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border);">
<span>🤝 سهم سود <strong>${escapeHtml(pCp.name)}</strong>:</span>
<span class="balance-chip credit" style="direction:ltr">+${Num.formatMicro(pAmtM)} ${escapeHtml(pCur.name)} (طلبکار)</span>
</div>`;
}
}

// Interactive rounding & quick floor/ceil selector whenever deal has fractional raw value or manual override
let roundCtrlHtml = '';
if (d.type === 'deal' && d.roundInfo && (d.roundInfo.hasFrac || d.manualAmt2)) {
const ri = d.roundInfo;
const cur2 = this.getCurrency(d.currency2);
const rm = d.roundMode || 'favor_cp';
const floorStr = Dec.toCanonicalStr(ri.floorMicro, 0);
const ceilStr = Dec.toCanonicalStr(ri.ceilMicro, 0);
const rawStr = Dec.toCanonicalStr(ri.rawMicro, 4);
const isFloorActive = d.finalAmt2Micro === ri.floorMicro;
const isCeilActive = d.finalAmt2Micro === ri.ceilMicro;
const quickBtnsHtml = ri.hasFrac ? `
<div class="quick-snap-row">
<span>انتخاب سریع عدد نهایی (با تنظیم خودکار نرخ):</span>
<button type="button" class="quick-snap-btn ${isFloorActive ? 'active' : ''}" onclick="app.applyQuickSnapAmt2('${floorStr}')">${Num.formatMicro(ri.floorMicro, 0)}</button>
<button type="button" class="quick-snap-btn ${isCeilActive ? 'active' : ''}" onclick="app.applyQuickSnapAmt2('${ceilStr}')">${Num.formatMicro(ri.ceilMicro, 0)}</button>
<button type="button" class="quick-snap-btn ${(!isFloorActive && !isCeilActive) ? 'active' : ''}" onclick="app.setDealRoundMode('none')">${Num.formatMicro(ri.rawMicro, 4)}</button>
</div>
` : '';

roundCtrlHtml = `
<div class="round-control-box">
<div class="round-control-head">
<span>⚖️ ${d.manualAmt2 ? 'مقدار نهایی دستی تنظیم شد (نرخ جابجا شد)' : `مبلغ دقیق: <strong style="direction:ltr; display:inline-block;">${Num.formatMicro(ri.rawMicro, 4)}</strong> ${escapeHtml(cur2.name)}`}</span>
${d.manualAmt2 ? `<button type="button" class="btn btn-xs btn-secondary" onclick="app.onTxAutoFieldChange()">↺ محاسبه خودکار</button>` : ''}
</div>

getCounterpartyBalancesForCard(cpId, includeZeroTouched = false) {
const map = {};
const touched = new Set();
const txs = this.getActiveTransactions().filter(t => t.cpId === cpId && !t.deleted);
for (const tx of txs) {
if (!Array.isArray(tx.effects)) continue;
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
touched.add(ef.currency);
map[ef.currency] = (map[ef.currency] || 0n) + Dec.toMicro(ef.delta);
}
}
return this.orderBalanceMap(map, includeZeroTouched ? touched : null);
},

drawRoundRect(ctx, x, y, w, h, r, fill) {
ctx.fillStyle = fill;
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.lineTo(x + w - r, y);
ctx.quadraticCurveTo(x + w, y, x + w, y + r);
ctx.lineTo(x + w, y + h - r);
ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
ctx.lineTo(x + r, y + h);
ctx.quadraticCurveTo(x, y + h, x, y + h - r);
ctx.lineTo(x, y + r);
ctx.quadraticCurveTo(x, y, x + r, y);
ctx.closePath();
ctx.fill();
},

async shareLastPng() {
try {
const res = await fetch(this._lastPngDataUrl);
const blob = await res.blob();
const file = new File([blob], this._lastPngName, { type: 'image/png' });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
await navigator.share({ files: [file], title: 'تصویر بالانس حساب' });
} else {
this.downloadLastPng();
}
} catch (e) {
this.downloadLastPng();
}

async copyLastPng() {
try {

this.toast('تصویر در کلیپ‌بورد کپی شد.');
} catch (e) {
this.toast('مرورگر از کپی مستقیم تصویر پشتیبانی نکرد؛ از دکمه دانلود یا اشتراک استفاده کنید.');

amt2Txt = Num.format(tx.amount2);
} else {
const ef2 = (tx.effects || []).find(e => e.currency === tx.currency2);
if (ef2) amt2Txt = Num.formatMicro(Dec.abs(Dec.toMicro(ef2.delta)));
}
const enSide = pubSide === 'sell' ? 'Sell' : 'Buy';
const enCur1 = this.getReceiptEnCurrencyName(tx.currency1);
const enCur2 = this.getReceiptEnCurrencyName(tx.currency2);
lines.push('');
lines.push('Deal 🤝');
lines.push(`${enSide} ${amt1Txt} ${enCur1} @ ${rateTxt}`);
if (amt2Txt) lines.push(`${amt2Txt} ${enCur2}`);
lines.push('');
lines.push(`💵 ${actWord}: ${amt1Txt} ${c1.name}`);
lines.push(`📈 نرخ: ${rateTxt} ${c2.name}`);
if (amt2Txt) lines.push(`💰 معادل: ${amt2Txt} ${c2.name}`);
const feeM = Dec.toMicro(tx.fee || 0);
if (feeM > 0n) {
const fc = this.getCurrency(tx.feeCurrency || tx.currency2);
lines.push(`🧾 کارمزد: ${Num.formatMicro(feeM)} ${fc.name}`);
}
} else {
const cur1 = this.getCurrency(tx.currency1);
const amt1Txt = Num.format(tx.amount1 || 0);
if (pubType === 'transfer') {
const dirWord = pubSide === 'receive' ? 'دریافت (واریز به حساب)' : 'پرداخت (برداشت از حساب)';
lines.push(`💵 ${dirWord}: ${amt1Txt} ${cur1.name}`);
const feeM = Dec.toMicro(tx.fee || 0);
if (feeM > 0n) {
lines.push(`🧾 کارمزد: ${Num.formatMicro(feeM)} ${cur1.name}`);
}
} else {
lines.push(`💵 ${this.getTxDisplaySummary(tx, true)}`);
}
}

if (showEffects && tx.type !== 'settlement' && Array.isArray(tx.effects) && tx.effects.length) {
lines.push('📌 ثبت در حساب:');
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
lines.push(this.formatEffectLine(ef.currency, ef.delta));
}
}

if (tx.refCode) lines.push(`🔖 شماره پیگیری: ${tx.refCode}`);
if (tx.roundingNote) lines.push(`⚖️ ${tx.roundingNote}`);
if (tx.note) lines.push(`📝 توضیحات: ${tx.note}`);
return lines;
},
buildCleanStatementText(cpId, mode = 'summary', opts = {}) {
const cp = this.findCounterpartyById(cpId);
if (!cp) return '';
const includeSettled = !!opts.includeSettled;
const includeRunning = !!opts.includeRunning;
const includeName = opts.includeName !== false;
const sliceOpts = opts.sliceOpts || {
mode: this.ui.periodMode || 'all',
dateFrom: this.ui.dateFrom || '',
dateTo: this.ui.dateTo || ''
};
const stmt = this.buildStatementSlice(cpId, sliceOpts);
const activeBalances = stmt.isFiltered ? stmt.periodEndingBalances : stmt.currentBalances;
const txs = stmt.inPeriodAsc;

const settledCodes = [];
if (includeSettled) {
const allTouched = this.getCounterpartyBalancesForCard(cpId, true);
const activeMap = {};
activeBalances.forEach(b => { activeMap[b.code] = b.micro; });
for (const item of allTouched) {
if ((activeMap[item.code] ?? 0n) === 0n) settledCodes.push(item.code);
}
}

const lines = [];
const titlePrefix = mode === 'summary' ? '📊 بالانس نهایی حساب' : '📊 صورت‌حساب و بالانس';
lines.push(includeName ? `${titlePrefix} — ${cp.name}` : titlePrefix);
lines.push(`📅 ${Jalali.nowDateTimeStr().replace(' - ', '  |  ')}`);
if (mode !== 'summary' && stmt.isFiltered) lines.push(`🔎 ${stmt.periodLabel}`);
lines.push('');

if (!activeBalances.length) {
lines.push('⚪ تمامی ارزها تسویه (صفر) است.');
} else {
lines.push('💼 حساب‌های فعال:');
for (const b of activeBalances) {
lines.push(this.formatCleanBalanceLine(b.code, b.micro));
}
}

if (includeSettled && settledCodes.length) {
lines.push('');
lines.push('✅ حساب‌های تسویه‌شده:');
for (const code of settledCodes) {
lines.push(this.formatCleanBalanceLine(code, 0n));
}
}

if (mode === 'summary') {
return lines.join('\n');
}

if (stmt.isFiltered) {
lines.push('');
lines.push(stmt.isFromConfirmation
? `✅ مانده تأییدشده در تاریخ ${stmt.confirmInfo.date}:`
: '⏩ مانده انتقالی ابتدای بازه:');
if (!stmt.broughtForward.length) {
lines.push('⚪ تسویه (صفر)');
} else {
for (const b of stmt.broughtForward) {
lines.push(this.formatCleanBalanceLine(b.code, b.micro));
}
}
}

lines.push('');
const txSectionTitle = stmt.isFromConfirmation
? `📋 تراکنش‌های پس از تأیید مانده (${txs.length} مورد):`
: `📋 ریز تراکنش‌ها (${txs.length} مورد):`;
lines.push(txSectionTitle);
if (!txs.length) {
lines.push(stmt.isFromConfirmation
? 'تراکنش جدیدی پس از آخرین تأیید مانده ثبت نشده است.'
: 'تراکنشی در این بازه ثبت نشده است.');
} else {
lines.push('');
txs.forEach((tx, idx) => {
const block = this.buildSingleTxBlockLines(tx, { showId: true, showEffects: true });
lines.push(`${idx + 1}) ${block[0]}`);
for (let k = 1; k < block.length; k++) {
lines.push(block[k]);
}
if (tx.type === 'settlement') {
lines.push(`⚖️ مانده تأییدشده: ${this.formatCleanRunningInline(tx, stmt)}`);
} else if (includeRunning) {
lines.push(`⚖️ مانده پس از ثبت: ${this.formatCleanRunningInline(tx, stmt)}`);
}
if (idx < txs.length - 1) lines.push('');
});
}

return lines.join('\n');
},
buildMultiReceiptsText(cpId, txIds, opts = {}) {
const cp = this.findCounterpartyById(cpId);
if (!cp) return '';
const includeName = !!opts.includeName;
const includeBalance = opts.includeBalance !== false;
const stmt = this.buildStatementSlice(cpId, { mode: 'all' });
const idSet = new Set(txIds || []);
const chosen = stmt.allAsc.filter(t => idSet.has(t.id));
if (!chosen.length) return 'لطفاً حداقل یک تراکنش را از لیست بالا انتخاب کنید.';

const lines = [];
if (includeName) {
lines.push(`🧾 رسید معاملات — ${cp.name}`);
lines.push('');
}
chosen.forEach((tx, idx) => {
const block = this.buildSingleTxBlockLines(tx, { showId: true, showEffects: true });
if (chosen.length > 1) {
lines.push(`${idx + 1}) ${block[0]}`);
for (let k = 1; k < block.length; k++) lines.push(block[k]);
} else {
lines.push(...block);
}
if (idx < chosen.length - 1) lines.push('');
});

if (includeBalance) {
const balList = stmt.currentBalances || [];
lines.push('');
lines.push('⚖️ مانده نهایی حساب:');
if (!balList.length) {
lines.push('⚪ تمامی ارزها تسویه (صفر) است.');
} else {
for (const b of balList) {
lines.push(this.formatCleanBalanceLine(b.code, b.micro));
}
}
}
return lines.join('\n');
},
copyTextStatement(cpId) {
if (!this.canAccessCounterparty(cpId)) return;
const cp = this.findCounterpartyById(cpId);
if (!cp) return;
const pageStmt = this.buildCounterpartyStatement(cpId);
const hasConf = pageStmt.hasConfirmation;
// Default detailed scope: start from last تأیید مانده if available (unless page has a specific date filter)
let defaultScope = 'all';
if (pageStmt.isFiltered && pageStmt.periodMode !== 'since_confirm') {
defaultScope = 'page';
} else if (hasConf) {
defaultScope = 'since_confirm';
}
const confSlice = hasConf ? this.buildStatementSlice(cpId, { mode: 'since_confirm' }) : pageStmt;
const multiPoolDesc = hasConf && confSlice.inPeriodDesc.length ? confSlice.inPeriodDesc : pageStmt.inPeriodDesc;
const recentIds = (hasConf && confSlice.inPeriodDesc.length && confSlice.inPeriodDesc.length <= 10)
? confSlice.inPeriodDesc.map(t => t.id)
: multiPoolDesc.slice(0, 3).map(t => t.id);

this._stmtTextModal = {

mode: pageStmt.isFiltered ? 'detailed' : 'summary', // summary | detailed | multi
textScope: defaultScope, // since_confirm | all | page
hasConf,
pageIsCustomFiltered: Boolean(pageStmt.isFiltered && pageStmt.periodMode !== 'since_confirm'),

return `<label class="multi-tx-row">

}).join('')
: `<div style="text-align:center; padding:10px; font-size:12px; color:var(--text-muted);">تراکنشی ثبت نشده است.</div>`;

const scopeBarHtml = (hasConf || this._stmtTextModal.pageIsCustomFiltered) ? `
<div id="stxt-scope-wrap" style="display:${this._stmtTextModal.mode==='detailed'?'block':'none'}; margin-bottom:8px;">
<div class="scope-chip-bar" style="margin-bottom:0;">
${hasConf ? `<button type="button" id="stxt-sc-conf" class="btn btn-xs ${defaultScope==='since_confirm'?'btn-primary':'btn-secondary'}" onclick="app.setStatementTextScope('since_confirm')">✅ از آخرین تأیید مانده (${escapeHtml(pageStmt.confirmInfo.date)})</button>` : ''}
${this._stmtTextModal.pageIsCustomFiltered ? `<button type="button" id="stxt-sc-page" class="btn btn-xs ${defaultScope==='page'?'btn-primary':'btn-secondary'}" onclick="app.setStatementTextScope('page')">🔎 بازه فعلی</button>` : ''}
<button type="button" id="stxt-sc-all" class="btn btn-xs ${defaultScope==='all'?'btn-primary':'btn-secondary'}" onclick="app.setStatementTextScope('all')">📋 همه تراکنش‌ها</button>
</div>
</div>
` : '';

this.openModal(`📋 متن آماده ارسال: ${cp.name}`, `
<div class="segmented segmented-3" style="margin-bottom:10px;">
<button type="button" id="stxt-tab-summary" class="seg-btn ${this._stmtTextModal.mode==='summary'?'active':''}" onclick="app.setStatementTextMode('summary')">خلاصه بالانس</button>
<button type="button" id="stxt-tab-detailed" class="seg-btn ${this._stmtTextModal.mode==='detailed'?'active':''}" onclick="app.setStatementTextMode('detailed')">بالانس + ریز</button>

<div id="stxt-balance-opts" class="receipt-opts">
<label>
<input type="checkbox" id="stxt-chk-settled" onchange="app.toggleStatementOpt('settled', this.checked)" />
<span>نمایش ارزهای تسویه‌شده (صفر)</span>
</label>
<label>
<input type="checkbox" id="stxt-chk-name" checked onchange="app.toggleStatementOpt('name', this.checked)" />
<span>ذکر نام حساب در تیتر</span>
</label>
<label id="stxt-lbl-running" style="display:${this._stmtTextModal.mode==='detailed'?'inline-flex':'none'};">
<input type="checkbox" id="stxt-chk-running" onchange="app.toggleStatementOpt('running', this.checked)" />
<span>مانده لحظه‌ای زیر هر ثبت</span>
</label>
</div>
<div id="stxt-multi-wrap" style="display:none;">

<strong>تراکنش‌هایی که می‌خواهید در یک پیام کپی شوند:</strong>

<button type="button" class="btn btn-xs btn-secondary" onclick="app.selectAllMultiTxs(true)">همه</button>
<button type="button" class="btn btn-xs btn-secondary" onclick="app.selectAllMultiTxs(false)">هیچکدام</button>
</span>
</div>
<div class="multi-tx-picker" id="stxt-multi-list">${multiPickerRows}</div>
<div class="receipt-opts">
<label>
<input type="checkbox" id="stxt-multi-bal" checked onchange="app.toggleStatementOpt('multiBal', this.checked)" />
<span>افزودن مانده نهایی در پایین</span>
</label>
<label>
<input type="checkbox" id="stxt-multi-name" onchange="app.toggleStatementOpt('multiName', this.checked)" />
<span>ذکر نام حساب در بالا</span>

</div>
<textarea id="text-export-area" class="receipt-textarea"></textarea>
<div class="grid-2" style="margin-top:10px;">

<button class="btn btn-blue" onclick="app.shareFromTextarea('text-export-area', 'وضعیت حساب')">📤 اشتراک مستقیم</button>
</div>
`);
this.refreshStatementTextarea();
},
setStatementTextScope(scope) {
if (!this._stmtTextModal) return;
this._stmtTextModal.textScope = scope;
const bConf = document.getElementById('stxt-sc-conf');
const bPage = document.getElementById('stxt-sc-page');
const bAll = document.getElementById('stxt-sc-all');
if (bConf) bConf.className = 'btn btn-xs ' + (scope === 'since_confirm' ? 'btn-primary' : 'btn-secondary');
if (bPage) bPage.className = 'btn btn-xs ' + (scope === 'page' ? 'btn-primary' : 'btn-secondary');
if (bAll) bAll.className = 'btn btn-xs ' + (scope === 'all' ? 'btn-primary' : 'btn-secondary');
this.refreshStatementTextarea();
},
setStatementTextMode(mode) {
if (!this._stmtTextModal) return;
this._stmtTextModal.mode = mode;
const b1 = document.getElementById('stxt-tab-summary');
const b2 = document.getElementById('stxt-tab-detailed');
const b3 = document.getElementById('stxt-tab-multi');
const balOpts = document.getElementById('stxt-balance-opts');
const runLbl = document.getElementById('stxt-lbl-running');
const scopeWrap = document.getElementById('stxt-scope-wrap');
const multiWrap = document.getElementById('stxt-multi-wrap');
if (b1) b1.className = 'seg-btn' + (mode === 'summary' ? ' active' : '');
if (b2) b2.className = 'seg-btn' + (mode === 'detailed' ? ' active' : '');
if (b3) b3.className = 'seg-btn' + (mode === 'multi' ? ' active' : '');
if (balOpts) balOpts.style.display = mode === 'multi' ? 'none' : 'flex';
if (runLbl) runLbl.style.display = mode === 'detailed' ? 'inline-flex' : 'none';
if (scopeWrap) scopeWrap.style.display = mode === 'detailed' ? 'block' : 'none';

},
toggleStatementOpt(which, checked) {
if (!this._stmtTextModal) return;
if (which === 'settled') this._stmtTextModal.includeSettled = !!checked;
if (which === 'running') this._stmtTextModal.includeRunning = !!checked;
if (which === 'name') this._stmtTextModal.includeName = !!checked;
if (which === 'multiBal') this._stmtTextModal.multiIncludeBalance = !!checked;
if (which === 'multiName') this._stmtTextModal.multiIncludeName = !!checked;

toggleMultiTxSelection(txId, checked) {

else set.delete(txId);
this._stmtTextModal.selectedTxIds = Array.from(set);

selectAllMultiTxs(selectAll) {
